<title>WOS-TOP BIACHES</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0A1020; --bg2: #0D1526; --card: #111A2E; --card2: #16223B; --line: #24324F; --line2: #2A3A5C;
  --text: #E6EEF8; --muted: #93A4BF; --soft: #C9D6EA; --ice: #7DD3FC; --ember: #F59E0B; --gold: #FCD34D;
  --inf: #60A5FA; --lan: #FCD34D; --mar: #F97316; --ok: #86EFAC; --bad: #FCA5A5;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #070C18; color: var(--text); font-family: Inter, system-ui, sans-serif; }
body { min-height: 100vh; display: flex; justify-content: center; }
#app { width: 100%; max-width: 520px; min-height: 100vh; background: var(--bg); display: flex; flex-direction: column; }
a { color: var(--ice); }
button, input, select { font: inherit; color: inherit; }
.h-font { font-family: Rajdhani, sans-serif; font-weight: 700; letter-spacing: 0.06em; }

header.top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1E2A44; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo-sm { width: 38px; height: 38px; flex: none; border-radius: 50%; background: #0F1A30; border: 2px solid var(--ice); box-shadow: 0 0 0 2px var(--ember); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.brand-name { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em; line-height: 1; white-space: nowrap; }
.brand-name span { color: var(--ember); }
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
.chip-btn { cursor: pointer; }

main { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 90px; }
nav.bottom { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #1E2A44; background: var(--bg2); padding: 8px 4px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
nav.bottom button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 600; padding: 4px 0; cursor: pointer; }
nav.bottom button.on { color: var(--ice); }

.seg { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { background: transparent; color: var(--muted); border: 0; border-radius: 9px; padding: 9px 4px; font-weight: 600; font-size: 13px; cursor: pointer; }
.seg button.on { background: #1B2A47; color: var(--text); }
.seg.warm button.on { background: #2A1B0A; color: var(--gold); }
.tabs { display: grid; gap: 4px; }
.tabs button { background: var(--card); color: var(--muted); border: 1px solid var(--line); border-radius: 9px; padding: 9px 0; font-weight: 600; font-size: 12px; cursor: pointer; }
.tabs button.on { background: #1B2A47; color: var(--text); border-color: #3B5687; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.warm { background: #1E1708; border-color: #6B4A12; }
.card.red { background: #1A1216; border-color: #5A2A33; }
.card.blue { background: #0F1D33; border-color: #23406B; }
.card-title { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.06em; text-transform: uppercase; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.label { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.note { font-size: 12px; color: var(--soft); line-height: 1.5; }
.small { font-size: 11px; color: var(--muted); line-height: 1.45; }
.row { display: flex; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.in, select.in { width: 100%; background: var(--bg2); border: 1px solid var(--line2); border-radius: 9px; color: var(--text); padding: 9px 10px; font-size: 14px; min-width: 0; }
.in.big { padding: 13px 14px; font-size: 15px; background: var(--card); }
.in:focus { outline: 2px solid #3B5687; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--ember); color: #1A1206; border: 0; border-radius: 12px; padding: 14px; font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.1em; cursor: pointer; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--ice); border: 1px dashed #3B5687; font-family: Inter, sans-serif; font-size: 14px; letter-spacing: 0; }
.btn:disabled { opacity: 0.6; cursor: default; }
.pill { background: var(--bg2); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
.pill.on { background: #1B2A47; color: var(--text); border-color: var(--ice); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.err { color: var(--bad); font-size: 13px; }

.hero-row { display: grid; grid-template-columns: minmax(0, 1fr) 70px 64px 52px; gap: 6px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 7px 8px; }
.hero-row.owned { border-color: #3B5687; }
.hero-name { display: flex; align-items: center; gap: 9px; min-width: 0; }
.ticon { width: 32px; height: 32px; flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.ticon.inf { background: #0F2240; color: var(--inf); }
.ticon.lan { background: #2A240C; color: var(--lan); }
.ticon.mar { background: #2A1608; color: var(--mar); }
.gen { font-size: 10px; font-weight: 700; color: var(--soft); background: #1B2A47; border-radius: 5px; padding: 1px 5px; }
.jtag { font-size: 10px; font-weight: 700; color: var(--gold); }
.mini { padding: 7px 2px; text-align: center; text-align-last: center; font-size: 13px; }
select.mini { -webkit-appearance: none; appearance: none; cursor: pointer; }

.unit { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--bg2); border: 1px solid #1E2A44; border-radius: 10px; padding: 7px 10px; }
.tag { font-size: 11px; font-weight: 700; border: 1px solid currentColor; border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
.ratio-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 84px; gap: 8px; align-items: center; }
.bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #1E2A44; }
.bar i { display: block; height: 100%; }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--soft); }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.num { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 15px; text-align: right; }
.list-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: center; background: var(--bg2); border: 1px solid #1E2A44; border-radius: 10px; padding: 8px 10px; }
.rank { font-family: Rajdhani, sans-serif; font-weight: 700; font-size: 15px; color: var(--gold); }

.gear-grid { display: grid; grid-template-columns: 44px repeat(4, minmax(0, 1fr)); gap: 5px; align-items: stretch; }
.gear-cell { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 3px; }
.gear-cell select, .gear-cell input { width: 100%; background: transparent; border: 0; color: var(--text); text-align: center; font-size: 12px; padding: 2px 0; }
.gear-cell input { border-top: 1px solid #1E2A44; }
.q-L { border-top: 3px solid #EF4444; } .q-M { border-top: 3px solid #F59E0B; } .q-E { border-top: 3px solid #A855F7; } .q-R { border-top: 3px solid #3B82F6; }

.toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #1B2A47; color: var(--text); border: 1px solid #3B5687; border-radius: 10px; padding: 8px 14px; font-size: 13px; z-index: 20; }
.loading { text-align: center; color: var(--muted); padding: 30px 0; font-size: 13px; }
.badge-ok { font-size: 11px; font-weight: 600; border: 1px solid currentColor; border-radius: 999px; padding: 3px 8px; }
.arena-slot { display: flex; flex-direction: column; align-items: center; gap: 5px; background: var(--bg2); border: 1px solid #1E2A44; border-radius: 12px; padding: 10px 6px; text-align: center; }
.login { padding: 24px 16px; gap: 14px; }

.jname { font-size: 14px; font-weight: 600; }
.jeff { font-size: 11px; color: var(--muted); margin-top: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
.savebar { position: sticky; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card2); border: 1px solid #3B5687; border-radius: 12px; padding: 10px 12px; z-index: 4; }
.hero-row.not-owned { opacity: 0.6; }
.nocheck { display: flex; align-items: center; justify-content: center; min-height: 36px; cursor: pointer; }
.nocheck input { width: 20px; height: 20px; accent-color: #F59E0B; cursor: pointer; }
/* sub-tabs stay pinned under the header while scrolling */
.subnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hh, 63px)); z-index: 4; display: flex; flex-direction: column; gap: 8px; margin: -14px -16px 0; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid #1E2A44; box-shadow: 0 6px 12px -8px rgba(0, 0, 0, 0.6); }
.lang-sel { -webkit-appearance: none; appearance: none; cursor: pointer; padding: 6px 10px; text-align: center; }
header.top .brand { flex: 1; }
header.top .row { flex: none; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }
.icon-btn { display: flex; align-items: center; justify-content: center; padding: 6px 9px; }
#team-body { display: flex; flex-direction: column; gap: 12px; }
input.in:disabled { opacity: 0.6; }
.thead > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav.bottom.six button { font-size: 10px; letter-spacing: -0.01em; }

</style>

<script>
/* WOS-TOP BIACHES — formation engine.
 * Community battle model (not the official formula, which is not public):
 *   kills/round = K * sqrt(n * N) * (ATK * LETH) / (DEF * HP) * counter * damageMods
 * A troop stat = base(tier) * (1 + bonus%) where bonus% = account bonuses + hero expedition stats + hero gear
 *   + special weapon stats, then "special bonuses" (widget skills, gem buffs, pets) apply as
 *   bonus% * (1 + s) + s  (whiteoutsurvival.wiki, Combat Stats & Special Bonuses).
 * Hero skills (expedition skills, joiner skills) are battle buffs: each stat category is its own multiplier
 *   (1 + sum of that category), enemy debuffs multiply by (1 - sum), damage dealt / taken likewise.
 * Chance / periodic skills are applied as expected value (value * uptime).
 * Everything here is pure JS so it runs in the browser and in node tests.
 */
(function (root) {
  'use strict';

  const TYPES = ['inf', 'lan', 'mar'];
  const BEATS = { inf: 'lan', lan: 'mar', mar: 'inf' };
  const K = 0.03;
  let HERO_W = 1;
  const PIECES = ['goggles', 'gloves', 'belt', 'boots'];

  let DB = null;
  let BY_NAME = {};

  function setDB(db) {
    DB = db;
    BY_NAME = {};
    db.heroes.forEach((h) => { BY_NAME[h.n] = h; });
  }
  function hero(name) { return BY_NAME[name]; }

  /* ---------- account helpers ---------- */

  // typical total stat bonus % of an active player of that generation (real reports: Gen 9 ~ 1000-2200%)
  function defaultBonus(gen) { return 100 + 135 * (gen || 1); }
  function defaultRally(gen) { return 150000 + 60000 * (gen || 1); }
  function defaultMarch(gen) { return 40000 + 12000 * (gen || 1); }

  function num(v, d) {
    const x = parseFloat(v);
    return Number.isFinite(x) ? x : d;
  }

  // Share of the hero's 5-star expedition Attack/Defense at (stars, star pieces), measured in game
  // (Philly/Norah/Edith/Hendrik 4★ = 69.33%, Greg/Sonya 4/1 = 73.8%, Alonso 4/3 = 82.9%, Renee 4/4 = 87.4%,
  //  Lynn 3/1 = 50.6%, Zinman 3/2 = 53.9%, Logan 3/4 = 60.3%, Ahmose 3/5 = 63.5%, Natalia 1★ = 20.6%, Gordon 1/2 = 23.9%).
  // 0★ and 2★ are interpolated.
  const STAR_BASE = [0.15, 0.206, 0.33, 0.4742, 0.6933, 1];
  const STAR_STEP = [0.0093, 0.0164, 0.024, 0.0322, 0.0451, 0];
  function starFactor(st, sp) {
    const s = Math.max(0, Math.min(5, Math.floor(st || 0)));
    const p = s >= 5 ? 0 : Math.max(0, Math.min(5, sp || 0));
    return STAR_BASE[s] + STAR_STEP[s] * p;
  }

  // Skill level a hero can have: rule "skill level <= stars + 1"; user agreed 4★+ counts as max.
  function skillLevel(st) { return st >= 4 ? 5 : Math.max(1, Math.min(5, (st || 0) + 1)); }
  // Expedition skill slot k (1..3) unlocks at (k-1) stars; talents (slot 4) always on.
  function slotUnlocked(slot, st) { return slot >= 4 || (st || 0) >= slot - 1; }

  function swSkillValue(lv) { return lv >= 2 ? 2.5 * Math.floor(lv / 2) + 2.5 : 0; }

  function gearPiece(piece, p) {
    if (!p) return { leth: 0, hp: 0, atk: 0, def: 0 };
    const plus = num(p.p, 0);
    const lv = num(p.lv, 0);
    const q = p.q || 'L';
    let base = 0;
    if (q === 'L') base = 50 + 0.5 * plus;
    else if (q === 'M') base = 25 + 0.25 * plus;
    else if (q === 'E') base = 12.5 + 0.125 * plus;
    else base = 6 + 0.06 * plus;
    const mult = (q === 'L' || q === 'M') ? 1 + 0.1 * lv : 1;
    const v = base * mult;
    const out = { leth: 0, hp: 0, atk: 0, def: 0 };
    if (piece === 'goggles' || piece === 'boots') out.leth = v; else out.hp = v;
    if (q === 'L') {
      const atkFirst = piece === 'goggles' || piece === 'belt';
      const a = atkFirst ? 'atk' : 'def';
      const b = atkFirst ? 'def' : 'atk';
      if (plus >= 20) out[a] += 20;
      if (plus >= 60) out[b] += 30;
      if (plus >= 100) out[a] += 50;
    }
    return out;
  }

  function gearSet(set) {
    const t = { leth: 0, hp: 0, atk: 0, def: 0 };
    if (!set) return t;
    PIECES.forEach((pc, i) => {
      const g = gearPiece(pc, set[i]);
      t.leth += g.leth; t.hp += g.hp; t.atk += g.atk; t.def += g.def;
    });
    return t;
  }

  function troopBase(type, tier) {
    const rows = DB.troops[type];
    return rows[tier] || rows.T10 || Object.values(rows)[0];
  }

  /* ---------- effects ---------- */

  // A "unit" is a hero used in a formation: {h: dbHero, st, sp, sw, gear}
  function leaderEffects(units) {
    const eff = [];
    units.forEach((u) => {
      if (!u || !u.h) return;
      const lvl = skillLevel(u.st);
      u.h.sk.forEach((s) => {
        if (!slotUnlocked(s.s, u.st)) return;
        eff.push({ c: s.c, to: s.to, v: s.v[lvl - 1] * s.u, nm: s.nm, ch: s.ch || s.u < 1 });
        (s.ex || []).forEach((e) => eff.push({ c: e.c, to: e.to, v: e.v[lvl - 1] * s.u, nm: s.nm + '+', ch: false }));
      });
    });
    return eff;
  }

  function joinerEffects(names) {
    const eff = [];
    const seenChance = {};
    names.forEach((n) => {
      const h = hero(n);
      if (!h || !h.sk.length) return;
      const s = h.sk[0];
      const isChance = s.ch || s.u < 1;
      const isDebuff = ['eatk', 'edef', 'eleth', 'etaken'].indexOf(s.c) >= 0;
      if (isChance || isDebuff) {
        // chance skills roll once and the same debuff on the enemy doesn't stack: one copy per rally
        if (seenChance[s.nm]) return;
        seenChance[s.nm] = true;
      }
      eff.push({ c: s.c, to: s.to, v: s.v[4] * s.u, nm: s.nm, ch: isChance });
    });
    return eff;
  }

  /* ---------- side construction ---------- */

  /* opts: {
   *   account: {troops:{inf:{tier}}, bonus:{inf:{atk,def,leth,hp}}, gen},
   *   units: {inf: unit|null, lan: unit|null, mar: unit|null},
   *   joiners: [names], ratio: {inf,lan,mar} (percent), total: number, side: 'rally'|'def'|'solo'
   * } */
  function buildSide(o) {
    const acc = o.account;
    const gen = acc.gen || 1;
    const s = {};
    const n = {};
    const eff = leaderEffects(TYPES.map((t) => o.units[t])).concat(joinerEffects(o.joiners || []));
    const sum = (c, t) => eff.filter((e) => e.c === c && (e.to === 'all' || e.to === t)).reduce((a, e) => a + e.v, 0);
    const sumAll = (c) => eff.filter((e) => e.c === c).reduce((a, e) => a + e.v, 0);

    // special weapon (widget) skills: "Rally / Defender troops X +n%" for every troop type of the matching side.
    // They are special bonuses (multiply the bonus pool); a report's Stat Bonuses already contain them.
    const special = { atk: 0, def: 0, leth: 0, hp: 0 };
    if (!acc.bonusFull) {
      TYPES.forEach((t) => {
        const u = o.units[t];
        if (!u || !u.h || !u.h.sw || !u.h.sw.b) return;
        const b = u.h.sw.b;
        if ((b.side === 'rally' && o.side === 'rally') || (b.side === 'def' && o.side === 'def')) {
          if (special[b.c] !== undefined) special[b.c] += swSkillValue(num(u.sw, 0));
        }
      });
    }

    TYPES.forEach((t) => {
      const tr = (acc.troops && acc.troops[t]) || {};
      const base = troopBase(t, tr.tier || 'T10');
      const bon = (acc.bonus && acc.bonus[t]) || {};
      const pct = {
        atk: num(bon.atk, defaultBonus(gen)), def: num(bon.def, defaultBonus(gen)),
        leth: num(bon.leth, defaultBonus(gen)), hp: num(bon.hp, defaultBonus(gen)),
      };
      const u = o.units[t];
      if (u && u.h && !acc.bonusFull) {
        // the hero's expedition stats, hero gear and special weapon stats boost its own troop type
        const sf = starFactor(u.st, u.sp);
        pct.atk += HERO_W * (u.h.ea || 0) * sf;
        pct.def += HERO_W * (u.h.ed || 0) * sf;
        if (u.h.sw) {
          const lv = Math.min(10, num(u.sw, 0));
          pct.leth += (u.h.sw.l || 0) * lv / 10;
          pct.hp += (u.h.sw.h || 0) * lv / 10;
        }
        const g = gearSet(u.gear);
        pct.atk += g.atk; pct.def += g.def; pct.leth += g.leth; pct.hp += g.hp;
      }
      ['atk', 'def', 'leth', 'hp'].forEach((k) => { if (special[k]) pct[k] = pct[k] * (1 + special[k] / 100) + special[k]; });

      const tierNum = parseInt(String(tr.tier || 'T10').slice(1), 10) || 10;
      const fc = /FC(\d+)/.exec(String(tr.tier || '')) ? parseInt(/FC(\d+)/.exec(tr.tier)[1], 10) : 0;
      let troopDmg = 1;
      let troopRed = 0;
      if (t === 'mar' && tierNum >= 7) troopDmg *= 1.1;
      if (t === 'mar' && fc >= 5) troopDmg *= 1.15; else if (t === 'mar' && fc >= 3) troopDmg *= 1.1;
      if (t === 'lan' && fc >= 5) troopDmg *= 1.15; else if (t === 'lan' && fc >= 3) troopDmg *= 1.1;
      if (t === 'inf' && fc >= 5) troopRed += 0.07; else if (t === 'inf' && fc >= 3) troopRed += 0.05;
      if (t === 'lan' && fc >= 8) troopRed += 0.07;

      s[t] = {
        base: { atk: base[0], def: base[1], leth: base[2], hp: base[3] },
        pct,
        // hero skill buffs: one multiplier per stat category
        mul: { atk: 1 + sum('atk', t) / 100, def: 1 + sum('def', t) / 100, leth: 1 + sum('leth', t) / 100, hp: 1 + sum('hp', t) / 100 },
        dmg: (1 + sum('dmg', t) / 100) * troopDmg,
        red: Math.max(0.5, 1 - sum('red', t) / 100 - troopRed), // damage reduction capped at 50%
        ambush: t === 'lan' && tierNum >= 7,
      };
      n[t] = Math.max(0, (o.total || 0) * (num(o.ratio[t], 0) / 100));
    });
    return {
      s, n,
      // debuffs this side puts on the enemy: multipliers on the enemy's stat (1 - x)
      // capped like damage reduction: debuffs from different heroes add up, but not without limit
      debuff: { eatk: Math.min(50, sumAll('eatk')), edef: Math.min(50, sumAll('edef')), eleth: Math.min(50, sumAll('eleth')), etaken: Math.min(100, sumAll('etaken')) / 100 },
    };
  }

  /* ---------- battle ---------- */

  function stat(x, k, debuffPct) {
    return x.base[k] * Math.max(0.1, 1 + x.pct[k] / 100) * (x.mul ? x.mul[k] : 1) * Math.max(0.1, 1 - (debuffPct || 0) / 100);
  }

  function battle(A, B, maxRounds) {
    maxRounds = maxRounds || 120;
    const na = Object.assign({}, A.n);
    const nb = Object.assign({}, B.n);
    const NA = TYPES.reduce((x, t) => x + na[t], 0);
    const NB = TYPES.reduce((x, t) => x + nb[t], 0);
    const mods = (X, Y) => {
      const m = {};
      TYPES.forEach((g) => {
        m[g] = {};
        TYPES.forEach((t) => {
          const atk = stat(X.s[g], 'atk', Y.debuff.eatk);
          const leth = stat(X.s[g], 'leth', Y.debuff.eleth);
          const def = stat(Y.s[t], 'def', X.debuff.edef);
          const hp = stat(Y.s[t], 'hp', 0);
          const counter = BEATS[g] === t ? 1.1 : 1;
          m[g][t] = K * (atk * leth) / (def * hp) * counter * X.s[g].dmg * Y.s[t].red * (1 + X.debuff.etaken);
        });
      });
      return m;
    };
    const mAB = mods(A, B);
    const mBA = mods(B, A);
    const hit = (Xs, xn, yn, m) => {
      const loss = { inf: 0, lan: 0, mar: 0 };
      TYPES.forEach((g) => {
        if (xn[g] <= 0) return;
        const alive = TYPES.filter((t) => yn[t] > 0);
        if (!alive.length) return;
        const target = alive[0];
        // community model: kills scale with sqrt(troops) of each group (diminishing returns)
        const tot = TYPES.reduce((x, t) => x + xn[t], 0);
        const eff = Math.sqrt(xn[g] * tot);
        if (Xs.s[g].ambush && target === 'inf' && yn.mar > 0) {
          loss.inf += eff * m[g].inf * 0.8;
          loss.mar += eff * m[g].mar * 0.2;
        } else {
          loss[target] += eff * m[g][target];
        }
      });
      return loss;
    };
    let rounds = 0;
    for (; rounds < maxRounds; rounds++) {
      const sa = TYPES.reduce((x, t) => x + na[t], 0);
      const sb = TYPES.reduce((x, t) => x + nb[t], 0);
      if (sa <= 0.5 || sb <= 0.5) break;
      const lb = hit(A, na, nb, mAB);
      const la = hit(B, nb, na, mBA);
      TYPES.forEach((t) => { na[t] = Math.max(0, na[t] - la[t]); nb[t] = Math.max(0, nb[t] - lb[t]); });
    }
    const ra = TYPES.reduce((x, t) => x + na[t], 0);
    const rb = TYPES.reduce((x, t) => x + nb[t], 0);
    const fa = NA ? ra / NA : 0;
    const fb = NB ? rb / NB : 0;
    return { win: fa > fb, remA: fa, remB: fb, score: fa - fb, rounds, leftA: na, leftB: nb };
  }

  // Power index: damage efficiency at the first round vs a reference enemy (does not saturate like win/loss).
  function powerIndex(A, B) {
    const rate = (X, Y) => {
      let r = 0;
      TYPES.forEach((g) => {
        if (X.n[g] <= 0) return;
        const t = TYPES.find((x) => Y.n[x] > 0) || 'inf';
        const atk = stat(X.s[g], 'atk', Y.debuff.eatk);
        const leth = stat(X.s[g], 'leth', Y.debuff.eleth);
        const def = stat(Y.s[t], 'def', X.debuff.edef);
        const tot = TYPES.reduce((x, k) => x + X.n[k], 0);
        r += Math.sqrt(X.n[g] * tot) * K * atk * leth / (def * stat(Y.s[t], 'hp', 0)) * (BEATS[g] === t ? 1.1 : 1) * X.s[g].dmg * Y.s[t].red * (1 + X.debuff.etaken);
      });
      return r;
    };
    const off = rate(A, B);
    const taken = rate(B, A);
    return Math.sqrt(off / Math.max(1e-9, taken));
  }

  // Bear: PvE target that doesn't fight back; damage over a fixed number of rounds.
  function bearDamage(A) {
    let d = 0;
    TYPES.forEach((g) => {
      const x = A.s[g];
      // the Bear has a small fixed defense pool, so defense debuffs matter more here than in PvP
      d += A.n[g] * stat(x, 'atk', 0) * stat(x, 'leth', 0) * x.dmg * (1 + A.debuff.etaken) / Math.max(0.5, 1 - A.debuff.edef / 100);
    });
    return d;
  }

  /* ---------- ratio grids ---------- */

  function ratioGrid(minInf, minLan, minMar, step) {
    step = step || 5;
    const out = [];
    for (let i = minInf; i <= 100; i += step) {
      for (let l = minLan; l <= 100 - i; l += step) {
        const m = 100 - i - l;
        if (m >= minMar) out.push({ inf: i, lan: l, mar: m });
      }
    }
    return out;
  }
  function ratioText(r) { return `${r.inf}/${r.lan}/${r.mar}`; }

  /* ---------- unit / roster helpers ---------- */

  function rosterUnits(account, type) {
    const out = [];
    Object.keys(account.heroes || {}).forEach((name) => {
      const h = hero(name);
      if (!h || h.t !== type) return;
      const o = account.heroes[name];
      out.push({ h, st: num(o.st, 0), sp: num(o.sp, 0), sw: num(o.sw, 0) });
    });
    return out;
  }

  function withGear(unit, account, type, setKey) {
    if (!unit) return null;
    const g = account.gear && account.gear[type];
    return Object.assign({}, unit, { gear: g ? g[setKey] : null });
  }

  function combos(account, limitPerType) {
    const lists = TYPES.map((t) => {
      const l = rosterUnits(account, t).filter((u) => u.h.sk.length);
      l.sort((a, b) => unitStrength(b) - unitStrength(a));
      return l.length ? l.slice(0, limitPerType || 6) : [null];
    });
    const out = [];
    lists[0].forEach((a) => lists[1].forEach((b) => lists[2].forEach((c) => out.push({ inf: a, lan: b, mar: c }))));
    return out;
  }

  function unitStrength(u) {
    if (!u || !u.h) return 0;
    const sf = starFactor(u.st, u.sp);
    const lvl = skillLevel(u.st);
    const skills = u.h.sk.filter((s) => slotUnlocked(s.s, u.st)).reduce((a, s) => a + s.v[lvl - 1] * s.u, 0);
    return (u.h.ea || 0) * sf + (u.h.sw ? (u.h.sw.l + u.h.sw.h) * Math.min(10, u.sw) / 20 : 0) + skills * 8;
  }

  function gearUnits(combo, account, setKey) {
    const u = {};
    TYPES.forEach((t) => { u[t] = withGear(combo[t], account, t, setKey || 'A'); });
    return u;
  }

  /* ---------- typical opponent ---------- */

  function metaRoster(gen) {
    const heroes = {};
    DB.heroes.forEach((h) => {
      if (h.r === 'L' && h.g <= gen && h.sk.length) heroes[h.n] = { st: 5, sp: 0, sw: 10 };
      if (h.r === 'E' && h.sk.length) heroes[h.n] = { st: 5, sp: 0, sw: 0 };
    });
    return heroes;
  }
  function maxGear() {
    const set = PIECES.map(() => ({ q: 'L', p: 100, lv: 20 }));
    return { inf: { A: set, B: set }, lan: { A: set, B: set }, mar: { A: set, B: set } };
  }

  // maxed = the enemy of a meta comparison: same generation, every hero maxed like the meta account
  function genericEnemyUnits(gen, maxed) {
    const u = {};
    const mg = maxed ? maxGear() : null;
    TYPES.forEach((t) => {
      const best = DB.heroes.filter((h) => h.r === 'L' && h.t === t && h.g <= gen).sort((a, b) => b.g - a.g)[0];
      u[t] = best ? (maxed ? { h: best, st: 5, sp: 0, sw: 10, gear: mg[t].A } : { h: best, st: 4, sp: 0, sw: 5, gear: null }) : null;
    });
    return u;
  }

  function enemySide(account, enemy, side, total, fallbackRatio) {
    const gen = account.gen || 1;
    let units = genericEnemyUnits(gen, !!account.isMeta);
    let ratio = fallbackRatio;
    if (enemy && enemy.heroes && enemy.heroes.some((x) => x && x.n)) {
      units = { inf: null, lan: null, mar: null };
      enemy.heroes.forEach((x) => {
        const h = x && hero(x.n);
        if (h) units[h.t] = { h, st: num(x.st, 5), sp: 0, sw: num(x.sw, 10), gear: null };
      });
    }
    if (enemy && enemy.ratio && (num(enemy.ratio.inf, 0) + num(enemy.ratio.lan, 0) + num(enemy.ratio.mar, 0)) > 0) {
      const r = enemy.ratio;
      const tot = num(r.inf, 0) + num(r.lan, 0) + num(r.mar, 0);
      ratio = { inf: num(r.inf, 0) * 100 / tot, lan: num(r.lan, 0) * 100 / tot, mar: num(r.mar, 0) * 100 / tot };
    }
    const eb = enemy && enemy.bonus;
    const hasBonus = !!eb && TYPES.some((t) => eb[t] && ['atk', 'def', 'leth', 'hp'].some((k) => eb[t][k] !== '' && eb[t][k] != null));
    const enemyAcc = { gen, troops: account.troops, bonus: hasBonus ? eb : account.bonus, bonusFull: hasBonus };
    return buildSide({ account: enemyAcc, units, joiners: (enemy && enemy.joiners) || [], ratio, total: num(enemy && enemy.total, total), side });
  }

  /* ---------- optimizers ---------- */

  const OFFENSE = ['dmg', 'atk', 'leth', 'edef', 'etaken'];
  const DEFENSE = ['red', 'hp', 'def', 'eatk', 'eleth'];

  function joinerPool(gen, kind) {
    const cats = kind === 'def' ? DEFENSE : OFFENSE;
    return DB.heroes.filter((h) => h.sk.length && (h.r !== 'L' || h.g <= gen) && cats.indexOf(h.sk[0].c) >= 0)
      .map((h) => h.n);
  }

  function pickJoiners(evalFn, pool, count) {
    const chosen = [];
    for (let i = 0; i < count; i++) {
      let best = null;
      let bestScore = -Infinity;
      pool.forEach((n) => {
        if (chosen.filter((x) => x === n).length >= 2) return; // at most 2 copies of the same joiner
        const sc = evalFn(chosen.concat([n]));
        if (sc > bestScore + 1e-9) { bestScore = sc; best = n; }
      });
      if (!best) break;
      chosen.push(best);
    }
    const base = evalFn(chosen);
    const alts = pool.filter((n) => chosen.indexOf(n) < 0)
      .map((n) => ({ n, sc: evalFn(chosen.slice(0, count - 1).concat([n])) }))
      .sort((a, b) => b.sc - a.sc).slice(0, 2).map((x) => x.n);
    return { chosen, alts, score: base };
  }

  function capacity(account, kind) {
    if (kind === 'rally') return num(account.rally, 0) || defaultRally(account.gen);
    return num(account.march, 0) || defaultMarch(account.gen);
  }

  /* mode: 'attack' | 'defense'; kind: 'rally' | 'solo' */
  let GARRISON_FACTOR = 3;
  function optimizeBattle(account, opts) {
    const gen = account.gen || 1;
    const mode = opts.mode || 'attack';
    const kind = opts.kind || 'rally';
    // defending (garrison or your city against a solo march) gets the "defender" widget skills
    const side = mode === 'defense' ? 'def' : (kind === 'solo' ? 'solo' : 'rally');
    const total = capacity(account, kind);
    const enemyRatio = mode === 'attack' ? { inf: 60, lan: 20, mar: 20 } : { inf: 50, lan: 20, mar: 30 };
    // Without a given enemy, a garrison is typically much bigger than one rally (e.g. 623k vs 183k in a real
    // report): a default target that never dies keeps "max damage" meaningful instead of every lineup tying.
    const given = !!(opts.enemy && opts.enemy.heroes && opts.enemy.heroes.some((h) => h && h.n));
    const enemyTotal = mode === 'attack' && !given ? total * (kind === 'rally' ? GARRISON_FACTOR : 2) : total;
    const enemy = enemySide(account, opts.enemy, mode === 'attack' ? 'def' : 'rally', enemyTotal, enemyRatio);
    const run = (units, ratio, joiners) => {
      const me = buildSide({ account, units, joiners, ratio, total, side });
      if (mode !== 'attack') return invert(battle(enemy, me));
      const r = battle(me, enemy);
      r.score = (1 - r.remB) + 0.01 * r.remA; // max damage; own survival only breaks ties
      return r;
    };
    const baseRatio = mode === 'attack' ? { inf: 50, lan: 20, mar: 30 } : { inf: 60, lan: 20, mar: 20 };
    const setKey = opts.gearSet || 'A';
    // pre-rank each troop type's heroes by simulation (hero swapped into a reference lineup), keep the 8 best
    const lists = TYPES.map((t) => rosterUnits(account, t).filter((u) => u.h.sk.length));
    const refU = {};
    TYPES.forEach((t, i) => { refU[t] = lists[i].slice().sort((a, b) => unitStrength(b) - unitStrength(a))[0] || null; });
    const ranked = TYPES.map((t, i) => {
      if (!lists[i].length) return [null];
      const sc = lists[i].map((u) => { const c = Object.assign({}, refU, { [t]: u }); return { u, v: run(gearUnits(c, account, setKey), baseRatio, []).score }; });
      sc.sort((a, b) => b.v - a.v);
      return sc.slice(0, 8).map((x) => x.u);
    });
    const combosSim = [];
    ranked[0].forEach((a) => ranked[1].forEach((b) => ranked[2].forEach((c) => combosSim.push({ inf: a, lan: b, mar: c }))));
    const cs = combosSim.map((c) => ({ c, units: gearUnits(c, account, setKey) }));
    if (!cs.length) return null;
    cs.forEach((x) => { x.score = run(x.units, baseRatio, []).score; });
    cs.sort((a, b) => b.score - a.score);
    // community floors the model can't see (turrets/front line): garrisons >= 50% infantry, attacks >= 25%; lancers >= 10%
    const minInf = mode === 'defense' ? 50 : 25;
    const grid = opts.grid || ratioGrid(minInf, 10, 0, 5);
    // heroes and ratio interact (Sonya shines with many lancers, Mia with few): give the top hero
    // combos a coarse ratio search before picking the finalists, so no lineup is judged at one ratio only
    const coarse = opts.grid || ratioGrid(minInf, 10, 0, 10);
    // candidates: the 8 best lineups plus, for every hero, the best lineup that uses that hero
    const cand = cs.slice(0, 8);
    TYPES.forEach((t) => {
      const seen = {};
      cs.forEach((x) => {
        const n = x.c[t] && x.c[t].h ? x.c[t].h.n : '';
        if (seen[n]) return;
        seen[n] = true;
        if (cand.indexOf(x) < 0) cand.push(x);
      });
    });
    cand.forEach((x) => {
      x.coarse = -Infinity;
      coarse.forEach((r) => { const sc = run(x.units, r, []).score; if (sc > x.coarse) { x.coarse = sc; x.r0 = r; } });
    });
    const finalists = cand.sort((a, b) => b.coarse - a.coarse).slice(0, 3);
    // fine ratio for each finalist, then (rallies) its own best joiners: joiner buffs change which
    // lineup wins, e.g. defensive joiners favour Sonya over Mia in a garrison
    const pool = kind === 'rally' ? joinerPool(gen, mode === 'attack' ? 'att' : 'def') : null;
    let best = null;
    finalists.forEach((x) => {
      let fb = null;
      grid.filter((r) => Math.abs(r.inf - x.r0.inf) <= 10 && Math.abs(r.lan - x.r0.lan) <= 10).forEach((r) => {
        const res = run(x.units, r, []);
        if (!fb || res.score > fb.res.score) fb = { x, r, res };
      });
      if (pool) {
        fb.joiners = pickJoiners((list) => run(x.units, fb.r, list).score, pool, 4);
        fb.total = fb.joiners.score;
      } else fb.total = fb.res.score;
      if (!best || fb.total > best.total) best = fb;
    });
    // second best ratio for the same heroes, at least 10 points away
    const others = grid.filter((r) => Math.abs(r.inf - best.r.inf) + Math.abs(r.mar - best.r.mar) >= 10)
      .map((r) => ({ r, res: run(best.x.units, r, []) })).sort((a, b) => b.res.score - a.res.score);
    const second = others[0];
    const joiners = best.joiners || null;
    const final = run(best.x.units, best.r, joiners ? joiners.chosen : []);
    const meFinal = buildSide({ account, units: best.x.units, joiners: joiners ? joiners.chosen : [], ratio: best.r, total, side });
    // close alternatives: swap one hero at a time (same ratio and joiners); within 3% the model can't really tell them apart
    const closeAlts = [];
    const jl = joiners ? joiners.chosen : [];
    const ref = final.score;
    TYPES.forEach((t) => {
      const cur = best.x.c[t] && best.x.c[t].h ? best.x.c[t].h.n : '';
      rosterUnits(account, t).filter((u) => u.h.sk.length && u.h.n !== cur)
        .sort((x, y) => unitStrength(y) - unitStrength(x)).slice(0, 5).forEach((u) => {
          const c = Object.assign({}, best.x.c); c[t] = u;
          const units = gearUnits(c, account, setKey);
          let sc = run(units, best.r, jl).score;
          // a hero that needs a different ratio (e.g. Sonya with more lancers) gets its own ratio before judging
          if (ref !== 0 && (ref - sc) / Math.abs(ref) < 0.15) coarse.forEach((r) => { sc = Math.max(sc, run(units, r, jl).score); });
          const gap = ref !== 0 ? Math.max(0, (ref - sc) / Math.abs(ref)) * 100 : 0;
          if (gap <= 3) closeAlts.push({ t, n: u.h.n, gap: Math.round(gap * 10) / 10 });
        });
    });
    closeAlts.sort((x, y) => x.gap - y.gap);
    return {
      units: best.x.units, ratio: best.r, ratio2: second ? second.r : null, closeAlts: closeAlts.slice(0, 3),
      joiners, result: final, power: powerIndex(meFinal, enemy), enemyGiven: !!(opts.enemy && opts.enemy.heroes && opts.enemy.heroes.some((h) => h && h.n)),
    };
  }

  function invert(r) {
    return { win: !r.win, remA: r.remB, remB: r.remA, score: -r.score, rounds: r.rounds };
  }

  function optimizeBear(account) {
    const gen = account.gen || 1;
    const total = capacity(account, 'rally');
    const cs = combos(account, 8).map((c) => ({ c, units: gearUnits(c, account) }));
    if (!cs.length) return null;
    const dmg = (units, r, j) => bearDamage(buildSide({ account, units, joiners: j, ratio: r, total, side: 'rally' }));
    const base = { inf: 10, lan: 10, mar: 80 };
    cs.forEach((x) => { x.score = dmg(x.units, base, []); });
    cs.sort((a, b) => b.score - a.score);
    // community rule for the Bear: marksmen-heavy (>= 60%), with a small share of infantry and lancers (>= 5% each),
    // which beat 0/0/100 in community tests
    const grid = ratioGrid(5, 5, 60, 5);
    let best = null;
    cs.slice(0, 3).forEach((x) => grid.forEach((r) => {
      const d = dmg(x.units, r, []);
      if (!best || d > best.d) best = { x, r, d };
    }));
    const pool = joinerPool(gen, 'att');
    const joiners = pickJoiners((list) => dmg(best.x.units, best.r, list), pool, 4);
    const ranked = pool.map((n) => ({ n, d: dmg(best.x.units, best.r, [n]) })).sort((a, b) => b.d - a.d);
    const top = ranked.slice(0, 8).map((x, i) => ({ n: x.n, tier: i < 4 ? 'Top' : 'Good' }));
    const own = Object.keys(account.heroes || {}).filter((n) => pool.indexOf(n) >= 0)
      .sort((a, b) => dmg(best.x.units, best.r, [b]) - dmg(best.x.units, best.r, [a]))[0] || null;
    const alt = ratioGrid(5, 5, 60, 5).filter((r) => r.mar !== best.r.mar)
      .map((r) => ({ r, d: dmg(best.x.units, r, []) })).sort((a, b) => b.d - a.d)[0];
    return { units: best.x.units, ratio: best.r, ratio2: alt ? alt.r : null, joiners, top, ownJoin: own, damage: best.d };
  }

  // Joiner value by simulation: the hero's 1st skill alone added to a standard rally / garrison of this account
  function rankJoiners(account, kind) {
    const owned = Object.keys(account.heroes || {}).filter((n) => { const h = hero(n); return h && h.sk.length; });
    const pool = joinerPool(account.gen || 1, kind === 'def' ? 'def' : 'att');
    const cand = owned.filter((n) => pool.indexOf(n) >= 0);
    if (!cand.length) return [];
    const total = capacity(account, 'rally');
    const units = genericEnemyUnits(account.gen || 1, false);
    const ratio = kind === 'def' ? { inf: 60, lan: 30, mar: 10 } : { inf: 0, lan: 0, mar: 100 };
    const enemy = buildSide({ account, units, joiners: [], ratio: { inf: 50, lan: 20, mar: 30 }, total, side: kind === 'def' ? 'rally' : 'def' });
    const score = (j) => {
      const me = buildSide({ account, units, joiners: j, ratio, total, side: kind === 'def' ? 'def' : 'rally' });
      return kind === 'def' ? invert(battle(enemy, me)).score : powerIndex(me, enemy);
    };
    const base = score([]);
    return cand.map((n) => ({ n, v: score([n]) - base })).filter((x) => x.v > 0).sort((a, b) => b.v - a.v);
  }

  // Report Stat Bonuses -> base profile bonuses (inverse of buildSide):
  // report = (base + hero stats + gear + SW stats) * (1 + s/100) + s, s = widget squad skill + gem buff
  function reportToBase(account, heroNames, side, reportBonus, gem) {
    const out = {};
    const units = {};
    TYPES.forEach((t) => {
      const n = (heroNames || {})[t];
      const h = hero(n);
      units[t] = h && h.t === t ? withGear({ h, st: (account.heroes[n] || {}).st || 5, sp: (account.heroes[n] || {}).sp || 0, sw: (account.heroes[n] || {}).sw || 0 }, account, t, 'A') : null;
    });
    const special = { atk: 0, def: 0, leth: 0, hp: 0 };
    TYPES.forEach((t) => {
      const u = units[t];
      if (u && u.h.sw && u.h.sw.b && u.h.sw.b.side === side && special[u.h.sw.b.c] !== undefined) special[u.h.sw.b.c] += swSkillValue(num(u.sw, 0));
    });
    TYPES.forEach((t) => {
      out[t] = {};
      const u = units[t];
      ['atk', 'def', 'leth', 'hp'].forEach((k) => {
        const v = reportBonus[t] && reportBonus[t][k];
        if (v === '' || v == null) return;
        const sp = special[k] + num(gem && gem[k], 0);
        let base = (num(v, 0) - sp) / (1 + sp / 100);
        if (u) {
          const sf = starFactor(u.st, u.sp);
          if (k === 'atk') base -= HERO_W * (u.h.ea || 0) * sf;
          if (k === 'def') base -= HERO_W * (u.h.ed || 0) * sf;
          const lv = Math.min(10, num(u.sw, 0));
          if (u.h.sw && k === 'leth') base -= (u.h.sw.l || 0) * lv / 10;
          if (u.h.sw && k === 'hp') base -= (u.h.sw.h || 0) * lv / 10;
          base -= gearSet(u.gear)[k];
        }
        out[t][k] = Math.round(base * 10) / 10;
      });
    });
    return out;
  }

  function optimizeJoe(account, joeMode) {
    const defRank = rankJoiners(account, 'def');
    const offRank = rankJoiners(account, 'att');
    const reinforce = defRank.slice(0, 6).map((x) => x.n);
    const reinforceAlt = defRank.slice(6, 8).map((x) => x.n);
    const full = joeMode === 'full';
    const lead = optimizeBattle(account, { mode: full ? 'attack' : 'defense', kind: 'rally' });
    return {
      reinforce, reinforceAlt, cityRatio: { inf: 90, lan: 10, mar: 0 },
      hq: {
        units: lead ? lead.units : null,
        w10: full ? { inf: 0, lan: 0, mar: 100 } : { inf: 30, lan: 70, mar: 0 },
        w20: full ? { inf: 0, lan: 0, mar: 100 } : { inf: 60, lan: 40, mar: 0 },
        joinHero: full ? (offRank[0] ? offRank[0].n : 'Jessie') : (defRank[0] ? defRank[0].n : 'Sergey'),
        joinAlt: (full ? offRank : defRank).slice(1, 4).map((x) => x.n),
        joinRatio: full ? { inf: 0, lan: 0, mar: 100 } : { inf: 60, lan: 40, mar: 0 },
      },
      full,
    };
  }

  function optimizeCanyon(account) {
    const squads = [];
    const left = cloneAccount(account);
    ['A', 'B', null].forEach((set) => {
      const acc = cloneAccount(left);
      if (!set) acc.gear = {};
      const r = Object.keys(acc.heroes || {}).length ? optimizeBattle(acc, { mode: 'attack', kind: 'solo', gearSet: set || 'A' }) : null;
      const sq = TYPES.map((t) => {
        const u = r && r.units[t];
        if (!u || !u.h) return null;
        delete left.heroes[u.h.n];
        return Object.assign({}, u, { set });
      });
      squads.push(sq);
    });
    return squads;
  }

  function arenaScore(u) {
    const h = u.h;
    const sf = starFactor(u.st, u.sp);
    const swf = 1 + Math.min(10, u.sw) / 20;
    const a = (h.x && h.x.a) || (h.ea || 100) * 4;
    const d = (h.x && h.x.d) || (h.ed || 100) * 4;
    const hp = (h.x && h.x.h) || (h.ea || 100) * 60;
    return { tank: (hp + d * 15) * sf * swf, dmg: a * sf * swf };
  }

  function tankW(u) { return u.h.t === 'inf' ? 1.5 : (u.h.t === 'mar' ? 0.6 : 1); }

  function optimizeArena(account) {
    const all = [];
    TYPES.forEach((t) => rosterUnits(account, t).forEach((u) => all.push(Object.assign(u, { sc: arenaScore(u) }))));
    if (!all.length) return null;
    const front = all.slice().sort((a, b) => (b.sc.tank * tankW(b)) - (a.sc.tank * tankW(a))).slice(0, 2);
    const rest = all.filter((u) => front.indexOf(u) < 0).sort((a, b) => b.sc.dmg - a.sc.dmg);
    const back = rest.slice(0, 3);
    const bench = rest.slice(3, 5);
    const lineup = front.concat(back);
    const gearUsed = {};
    lineup.slice().sort((a, b) => (b.sc.tank + b.sc.dmg * 10) - (a.sc.tank + a.sc.dmg * 10)).forEach((u) => {
      const t = u.h.t;
      gearUsed[t] = gearUsed[t] || 0;
      u.set = gearUsed[t] === 0 ? 'A' : (gearUsed[t] === 1 ? 'B' : null);
      gearUsed[t] += 1;
    });
    return { front, back, bench };
  }

  /* ---------- scoring per activity (used by upgrade advisor) ---------- */

  function activityScores(account, roles) {
    const out = {};
    if (roles.indexOf('rallyAtk') >= 0 || roles.indexOf('solo') >= 0) {
      const r = optimizeBattle(account, { mode: 'attack', kind: roles.indexOf('rallyAtk') >= 0 ? 'rally' : 'solo' });
      out.attack = r ? r.power : 0;
    }
    if (roles.indexOf('garrison') >= 0 || roles.indexOf('joe') >= 0) {
      const r = optimizeBattle(account, { mode: 'defense', kind: 'rally' });
      out.defense = r ? r.power : 0;
    }
    if (roles.indexOf('bear') >= 0) {
      const r = optimizeBear(account);
      out.bear = r ? r.damage : 0;
    }
    if (roles.indexOf('arena') >= 0 || roles.indexOf('canyon') >= 0) {
      let s = 0;
      TYPES.forEach((t) => rosterUnits(account, t).sort((a, b) => unitStrength(b) - unitStrength(a)).slice(0, 2)
        .forEach((u) => { s += unitStrength(u); }));
      out.heroes = s;
    }
    return out;
  }

  function relGain(before, after) {
    let total = 0;
    let n = 0;
    Object.keys(before).forEach((k) => {
      const b = before[k];
      const a = after[k];
      total += b > 0 ? ((a - b) / b) * 100 : 0;
      n++;
    });
    return n ? total / n : 0;
  }

  function cloneAccount(a) { return JSON.parse(JSON.stringify(a)); }

  function lvl(st, sp) { return st >= 5 ? '5★' : (sp ? `${st}/${sp}` : (st ? `${st}★` : '0/0')); }

  function upgradeAdvice(account, roles) {
    roles = roles && roles.length ? roles : ['rallyAtk', 'bear'];
    const base = activityScores(account, roles);
    const items = [];
    const usedInBest = usedHeroes(account, roles);
    Object.keys(account.heroes || {}).forEach((name) => {
      const h = hero(name);
      if (!h || !h.sk.length) return;
      const cur = account.heroes[name];
      const st = num(cur.st, 0);
      const sp = num(cur.sp, 0);
      const sw = num(cur.sw, 0);
      const steps = [];
      if (st < 4) steps.push({ kind: 'stars', to: { st: 4, sp: 0 }, label: `${name} to 4★` });
      else if (st < 5) steps.push({ kind: 'stars', to: { st: 5, sp: 0 }, label: `${name} to 5★` });
      if (h.sw && h.r === 'L' && sw < 10) {
        const to = Math.min(10, sw + 2 - (sw % 2));
        steps.push({ kind: 'sw', to: { sw: to }, label: `${name} special weapon to Lv ${to}` });
      }
      steps.forEach((s) => {
        const acc = cloneAccount(account);
        Object.assign(acc.heroes[name], s.to);
        const g = relGain(base, activityScores(acc, roles));
        items.push({ hero: name, label: s.label, to: s.to, gain: g, kind: s.kind, inUse: usedInBest.indexOf(name) >= 0,
          now: `${lvl(st, sp)} · SW ${sw}` });
      });
    });
    // heroes the player doesn't own: worth unlocking? find the lowest level where they help
    const gen = account.gen || 1;
    const tiers = [{ st: 3, sp: 0, sw: 0 }, { st: 4, sp: 0, sw: 5 }, { st: 5, sp: 0, sw: 10 }];
    DB.heroes.filter((h) => h.r === 'L' && h.g <= gen && h.sk.length && !(account.heroes || {})[h.n]).forEach((h) => {
      const top = cloneAccount(account);
      top.heroes[h.n] = tiers[2];
      if (relGain(base, activityScores(top, roles)) <= 1) return;
      for (let i = 0; i < tiers.length; i++) {
        const acc = cloneAccount(account);
        acc.heroes[h.n] = tiers[i];
        const g = relGain(base, activityScores(acc, roles));
        if (g > 1) {
          const t = tiers[i];
          items.push({ hero: h.n, label: `Unlock ${h.n} → ${lvl(t.st, t.sp)}${t.sw ? ' + SW ' + t.sw : ''}`, to: t, gain: g, kind: 'unlock',
            inUse: false, now: 'Not owned' });
          break;
        }
      }
    });
    items.sort((a, b) => b.gain - a.gain);
    const invest = items.filter((x) => x.gain > 0.5).slice(0, 6);
    const avoid = Object.keys(account.heroes || {}).filter((n) => {
      const h = hero(n);
      return h && h.r === 'L' && usedInBest.indexOf(n) < 0 && !items.some((x) => x.hero === n && x.gain > 0.5);
    }).slice(0, 4);
    return { invest, avoid, used: usedInBest };
  }

  function usedHeroes(account, roles) {
    const used = {};
    const add = (u) => { if (u && u.h) used[u.h.n] = 1; };
    if (roles.indexOf('rallyAtk') >= 0 || roles.indexOf('solo') >= 0) {
      const r = optimizeBattle(account, { mode: 'attack', kind: 'rally' });
      if (r) TYPES.forEach((t) => add(r.units[t]));
    }
    if (roles.indexOf('garrison') >= 0 || roles.indexOf('joe') >= 0) {
      const r = optimizeBattle(account, { mode: 'defense', kind: 'rally' });
      if (r) TYPES.forEach((t) => add(r.units[t]));
    }
    if (roles.indexOf('bear') >= 0) {
      const r = optimizeBear(account);
      if (r) TYPES.forEach((t) => add(r.units[t]));
    }
    if (roles.indexOf('canyon') >= 0) optimizeCanyon(account).forEach((sq) => sq.forEach(add));
    if (roles.indexOf('arena') >= 0) {
      const a = optimizeArena(account);
      if (a) a.front.concat(a.back).forEach(add);
    }
    return Object.keys(used);
  }

  function nextGenAdvice(account, roles, spend) {
    const gen = account.gen || 1;
    const next = DB.heroes.filter((h) => h.r === 'L' && h.g === gen + 1);
    if (!next.length) return { gen: gen + 1, picks: [] };
    roles = roles && roles.length ? roles : ['rallyAtk', 'bear'];
    const base = activityScores(account, roles);
    const tiers = [{ st: 3, sp: 0, sw: 0 }, { st: 4, sp: 0, sw: 5 }, { st: 5, sp: 0, sw: 10 }];
    const picks = next.map((h) => {
      let target = null;
      let gainAtTarget = 0;
      let gainMax = 0;
      tiers.forEach((t, i) => {
        const acc = cloneAccount(account);
        acc.heroes[h.n] = t;
        const g = relGain(base, activityScores(acc, roles));
        if (i === tiers.length - 1) gainMax = g;
        if (!target && g > 1) { target = t; gainAtTarget = g; }
      });
      return { name: h.n, type: h.t, target, gain: gainAtTarget, gainMax };
    }).sort((a, b) => b.gainMax - a.gainMax);
    const budget = { f2p: 1, low: 1, mid: 2, whale: 3 }[spend || 'low'] || 1;
    picks.forEach((p, i) => {
      p.verdict = p.target && i < budget ? 'Invest' : (p.target ? 'Only if spare' : 'Skip');
    });
    return { gen: gen + 1, picks };
  }

  function metaAccount(account) {
    const a = cloneAccount(account);
    a.heroes = metaRoster(account.gen || 1);
    a.gear = maxGear();
    a.isMeta = true;
    return a;
  }

  // Prediction for a report: the report's two sides simulated with our model.
  // report: {type, role, myHeroes:[n], enemyHeroes:[n], myTotal, enTotal, myRatio, enRatio, myBonus, enBonus, myJoiners, enJoiners}
  function predict(account, report) {
    const myTotal = num(report.myTotal, 0);
    const enTotal = num(report.enTotal, 0);
    if (!myTotal || !enTotal) return null;
    const attacking = report.role !== 'defender';
    const kind = report.type === 'solo' ? 'solo' : 'rally';
    const normRatio = (r, fb) => {
      const tot = r ? TYPES.reduce((x, t) => x + num(r[t], 0), 0) : 0;
      if (!tot) return fb;
      const o = {}; TYPES.forEach((t) => { o[t] = num(r[t], 0) * 100 / tot; }); return o;
    };
    const units = {};
    TYPES.forEach((t) => { units[t] = null; });
    (report.myHeroes || []).forEach((n) => {
      const h = hero(n);
      if (!h) return;
      units[h.t] = { h, st: 5, sp: 0, sw: 10, gear: null };
    });
    const hasMy = report.myBonus && TYPES.some((t) => report.myBonus[t] && ['atk', 'def', 'leth', 'hp'].some((k) => report.myBonus[t][k] !== '' && report.myBonus[t][k] != null));
    const myAcc = { gen: account.gen, troops: account.troops, bonus: hasMy ? report.myBonus : account.bonus, bonusFull: hasMy };
    const mySide = !attacking ? 'def' : (kind === 'solo' ? 'solo' : 'rally');
    const myRatio = normRatio(report.myRatio, attacking ? { inf: 50, lan: 20, mar: 30 } : { inf: 60, lan: 20, mar: 20 });
    const enRatio = normRatio(report.enRatio, attacking ? { inf: 60, lan: 20, mar: 20 } : { inf: 50, lan: 20, mar: 30 });
    const me = buildSide({ account: myAcc, units, joiners: report.myJoiners || [], ratio: myRatio, total: myTotal, side: mySide });
    const en = enemySide(account, { heroes: (report.enemyHeroes || []).map((n) => ({ n })), ratio: enRatio, total: enTotal, bonus: report.enBonus, joiners: report.enJoiners || [] },
      attacking ? 'def' : (kind === 'solo' ? 'solo' : 'rally'), enTotal, enRatio);
    const r = attacking ? battle(me, en) : invert(battle(en, me));
    return { win: r.win, myLeft: Math.round(r.remA * 100), enemyLeft: Math.round(r.remB * 100) };
  }

  root.WOS = {
    TYPES, PIECES, setDB, hero, buildSide, battle, bearDamage, optimizeBattle, optimizeBear, optimizeJoe,
    optimizeCanyon, optimizeArena, upgradeAdvice, nextGenAdvice, metaAccount, predict, reportToBase, ratioText, gearSet,
    gearPiece, skillLevel, starFactor, unitStrength, activityScores, joinerPool, powerIndex,
    get db() { return DB; },
    setHeroW(w) { HERO_W = w; },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* WOS-TOP BIACHES — app UI (EN). Vanilla JS, no build step needed at runtime. */
(function () {
  'use strict';

  const CONFIG = { BACKEND_URL: 'https://script.google.com/macros/s/AKfycbx5ldeDHo3BHtTv7ZdCtem5PRNSCaNGuQZfDxO4bBXkLKsAsRkzRESI3Q1iZ5v9LFkU/exec' };
  const DEMO = !CONFIG.BACKEND_URL || CONFIG.BACKEND_URL.indexOf('__') === 0;
  const TYPES = WOS.TYPES;

  /* ---------- languages ---------- */
  // English text is the key; dictionaries live in src/i18n/<lang>.json. Missing keys fall back to English.
  const LANGS = [['en', 'EN'], ['it', 'IT'], ['de', 'DE'], ['fr', 'FR'], ['es', 'ES'], ['pl', 'PL'], ['id', 'ID']];
  const DICT = window.WOS_I18N || {};
  let LANG = 'en';
  try { const l = localStorage.getItem('wostop_lang'); if (l && LANGS.some((x) => x[0] === l)) LANG = l; } catch (e) { /* ignore */ }
  function tx(key, vars) {
    const d = DICT[LANG];
    let out = (d && d[key]) || key;
    if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
    return out;
  }
  const TYPE_NAME = new Proxy({ inf: 'Infantry', lan: 'Lancers', mar: 'Marksmen' }, { get: (o, k) => tx(o[k]) });
  const PIECE_NAME = new Proxy({ goggles: 'Goggles', gloves: 'Gloves', belt: 'Belt', boots: 'Boots' }, { get: (o, k) => tx(o[k]) });
  const CAT = new Proxy({
    dmg: 'Damage dealt +', atk: 'Attack +', leth: 'Lethality +', hp: 'Health +', def: 'Defense +',
    red: 'Damage taken −', eatk: 'Enemy attack −', edef: 'Enemy defense −', eleth: 'Enemy lethality −', etaken: 'Enemy dmg taken +',
  }, { get: (o, k) => (o[k] ? tx(o[k]) : undefined) });
  const ROLES = [
    ['rallyAtk', 'I open attack rallies'], ['bear', 'I open Bear rallies'], ['garrison', 'I lead garrisons'],
    ['joiner', 'Joiner only'], ['arena', 'Arena'], ['canyon', 'Canyon Clash'], ['joe', 'Crazy Joe'], ['solo', 'Solo marches'],
  ];
  const SPEND = [['f2p', 'F2P'], ['low', 'Low'], ['mid', 'Mid'], ['whale', 'Whale']];
