    let gen = 1;
    GEN_DAYS.forEach((d, i) => { if (day >= d) gen = i + 1; });
    return { gen, nextIn: GEN_DAYS[gen] != null ? GEN_DAYS[gen] - day : null, src: 'open', day };
  }
  function manualGen() { const m = S.profile.genManual; return m === '' || m == null ? null : num(m, null); }
  function currentGen() { const m = manualGen(); if (m) return m; const a = autoGen(); return a ? a.gen : num(S.profile.gen, 1); }
  function daysToNext() {
    const a = autoGen(); const m = manualGen();
    return a && (!m || m === a.gen) ? a.nextIn : NaN;
  }
  function tierRank(t) { const m = /T(\d+)(?: FC(\d+))?/.exec(t) || []; return num(m[1], 0) * 100 + num(m[2], 0); }
  function heroLabel(h) { return `${h.g ? 'G' + h.g : tx(h.r === 'E' ? 'Epic' : 'Rare')} - ${h.n}`; }
  function heroGroups(list, gen) {
    const sk = list.filter((h) => h.sk.length);
    const now = sk.filter((h) => h.g && h.g <= gen).sort((a, b) => (b.g - a.g) || a.n.localeCompare(b.n));
    const epic = sk.filter((h) => !h.g).sort((a, b) => (a.r === b.r ? a.n.localeCompare(b.n) : (a.r === 'E' ? -1 : 1)));
    const fut = sk.filter((h) => h.g && h.g > gen).sort((a, b) => (a.g - b.g) || a.n.localeCompare(b.n));
    return [[tx('Up to your Gen ({g})', { g: gen }), now], [tx('Epic'), epic], [tx('Future generations'), fut]].filter((x) => x[1].length);
  }
  // <select> of heroes; type = 'inf'|'lan'|'mar' or null for every type (joiners)
  function heroSelect(attr, type, value, placeholder) {
    const list = WOS.db.heroes.filter((h) => !type || h.t === type);
    const groups = heroGroups(list, currentGen());
    return `<select class="in" ${attr}><option value="">${esc(placeholder || '—')}</option>${groups.map(([label, hs]) => `<optgroup label="${esc(label)}">${hs.map((h) => `<option value="${esc(h.n)}"${value === h.n ? ' selected' : ''}>${esc(heroLabel(h))}</option>`).join('')}</optgroup>`).join('')}</select>`;
  }
  function bonusGrid(bindAttr, base, obj) {
    const head = `<div style="display:grid;grid-template-columns:66px repeat(4,minmax(0,1fr));gap:5px;font-size:10px;color:var(--muted);text-align:center"><div></div><div>${tx('Attack')}</div><div>${tx('Defense')}</div><div>${tx('Lethality')}</div><div>${tx('Health')}</div></div>`;
    return head + TYPES.map((t) => `<div style="display:grid;grid-template-columns:66px repeat(4,minmax(0,1fr));gap:5px;align-items:center"><div style="font-size:11px;font-weight:600;color:var(--${t})">${TYPE_NAME[t]}</div>${['atk', 'def', 'leth', 'hp'].map((k) => `<input class="in mini" ${bindAttr}="${base}.${t}.${k}" value="${esc(((obj || {})[t] || {})[k] || '')}" inputmode="decimal" aria-label="${TYPE_NAME[t]} ${k}">`).join('')}</div>`).join('');
  }
  function heroOptions(list) { return list.slice().sort((a, b) => (b.g - a.g) || a.n.localeCompare(b.n)).map((h) => [h.n, heroLabel(h)]); }

  function header() {
    const sub = S.session ? `${esc(S.session.user)}${S.session.state ? ' · ' + tx('State') + ' ' + esc(S.session.state) : ''}${S.session.alliance ? ' [' + esc(S.session.alliance) + ']' : ''}` : 'Formation Lab';
    return `<header class="top"><div class="brand"><div class="logo-sm">${logoSvg(36)}</div><div style="min-width:0"><div class="brand-name">WOS-TOP <span>BIACHES</span></div><div class="brand-sub">${sub}</div></div></div>
      <div class="row"><select class="chip lang-sel" data-lang aria-label="Language">${LANGS.map(([k, l]) => `<option value="${k}"${LANG === k ? ' selected' : ''}>${l}</option>`).join('')}</select>${S.session ? `<button class="chip chip-btn icon-btn" data-act="logout" title="${tx('Log out')}" aria-label="${tx('Log out')}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>` : ''}</div></header>`;
  }
  // Role column may hold R5, Super or both ("R5, Super")
  function leadRoles() {
    const toks = String((S.session && S.session.role) || '').toLowerCase().split(/[\s,;+/&]+/);
    return { r5: toks.indexOf('r5') >= 0, sup: toks.indexOf('super') >= 0 };
  }
  function leadRole() { const l = leadRoles(); return l.sup ? 'super' : (l.r5 ? 'r5' : ''); }
  function bottomNav() {
    const items = [['account', 'Account', ICON.account], ['form', 'Formations', ICON.form], ['up', 'Upgrades', ICON.up], ['gen', 'Next Gen', ICON.gen], ['report', 'Report', ICON.report]];
    if (leadRole()) items.push(['team', 'Leader', ICON.team]);
    return `<nav class="bottom${items.length > 5 ? ' six' : ''}" style="grid-template-columns:repeat(${items.length},minmax(0,1fr))" aria-label="Main">${items.map(([k, l, i]) => `<button class="${S.view === k ? 'on' : ''}" data-act="nav" data-v="${k}">${i}${tx(l)}</button>`).join('')}</nav>`;
  }

  /* ---------- login ---------- */

  function viewLogin(err) {
    return `${header()}<main class="login">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px">
        <div style="width:150px;height:150px;border-radius:50%;background:#0F1A30;border:4px solid var(--ice);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--ember);overflow:hidden;display:flex;align-items:center;justify-content:center">${logoSvg(140)}</div>
        <div class="h-font" style="font-size:36px;line-height:1">WOS-TOP</div>
        <div class="h-font" style="font-size:28px;line-height:1;color:var(--ember);letter-spacing:.24em">BIACHES</div>
        <div class="small">Formation Lab · ${tx('unofficial fan tool')}</div>
      </div>
      <form id="login-form" style="display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="lu">${tx('USERNAME')}</label><input id="lu" class="in big" autocomplete="username" required></div>
        <div class="field"><label for="lc">${tx('ACCESS CODE')}</label><input id="lc" class="in big" type="password" autocomplete="current-password" required></div>
        ${err ? `<div class="err" role="alert">${esc(tx(err))}</div>` : ''}
        <button class="btn" type="submit" id="login-btn">${tx('LOG IN')}</button>
        <div class="small" style="text-align:center">${tx('Invite only. Lost your code? Ask whoever gave you access.')}</div>
        ${DEMO ? `<div class="card blue"><div class="note">${tx('<b>Demo mode:</b> not connected to the shared sheet yet. Any username and code work, data stays in this browser.')}${storageOk() ? '' : ' <b>' + tx('This browser view blocks storage: your data is kept until you close or reload the page.') + '</b>'}</div></div>` : ''}
      </form>
      <div class="small" style="margin-top:auto">${tx('No real names, emails or personal data. Only game data is stored.')}</div>
    </main>`;
  }

  /* ---------- account ---------- */

  function viewAccount() {
    const tabs = [['profile', 'Profile'], ['heroes', 'Heroes'], ['gear', 'Gear']];
    const body = S.sub === 'heroes' ? accHeroes() : (S.sub === 'gear' ? accGear() : accProfile());
    const n = Object.keys(account().heroes).length;
    const start = n === 0 ? `<div class="card warm"><div class="note">${tx('<b>Start here:</b> check your Gen in Profile, then add your heroes in Heroes (stars, step, SW). Formations and upgrades use what you save here.')}</div></div>` : '';
    return `<div class="subnav"><div class="seg" style="grid-template-columns:repeat(3,1fr)">${tabs.map(([k, l]) => `<button class="${S.sub === k ? 'on' : ''}" data-act="sub" data-v="${k}">${tx(l)}</button>`).join('')}</div></div>
      ${start}${body}
      <div class="savebar"><div class="small" style="min-width:0"><div id="save-state">${esc(saveLabel())}</div><div>Gen ${currentGen()} · ${tx(n === 1 ? '{n} hero in use' : '{n} heroes in use', { n })}</div></div><button class="btn" style="padding:10px 18px;font-size:14px" data-act="save">${tx('SAVE')}</button></div>`;
  }

  function sel(bind, options, value, extra) {
    return `<select class="in ${extra || ''}" data-bind="${bind}">${options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  }
  function inp(bind, value, attrs) {
    return `<input class="in" data-bind="${bind}" value="${esc(value)}" ${attrs || 'inputmode="numeric"'}>`;
  }

  function accProfile() {
    const p = S.profile;
    const tiers = Object.keys(WOS.db.troops.inf).sort((a, b) => tierRank(b) - tierRank(a));
    const ag = autoGen();
    const gens = [['', ag ? `Auto · Gen ${ag.gen}` : tx('Choose your Gen')]].concat(Array.from({ length: MAX_GEN }, (_, i) => [MAX_GEN - i, 'Gen ' + (MAX_GEN - i)]));
    return `
    <section class="card"><div class="card-title">${tx('Player')}</div>
      <div class="field"><label>${tx('USERNAME')}</label><div class="in" style="opacity:.7">${esc(S.session.user)}</div></div>
      <div class="grid2"><div class="field"><label for="st-in">${tx('STATE')}</label><input id="st-in" class="in" data-sbind="state" value="${esc(S.session.state)}" inputmode="numeric"${leadRole() ? ' disabled' : ''}></div>
      <div class="field"><label for="al-in">${tx('ALLIANCE')}</label><input id="al-in" class="in" data-sbind="alliance" value="${esc(S.session.alliance)}" maxlength="12"${leadRole() ? ' disabled' : ''}></div></div>
      ${leadRole() ? `<div class="small">${tx('As {role}, your state and alliance are set by the admin.', { role: [leadRoles().r5 ? 'R5' : '', leadRoles().sup ? 'Super' : ''].filter(Boolean).join(' + ') })}</div>` : ''}
    </section>
    <section class="card"><div class="card-title">${tx('Generation')}</div>
      <div class="grid2"><div class="field"><label>${tx('CURRENT GEN')}</label>${sel('genManual', gens, p.genManual == null ? '' : p.genManual)}</div>
      <div class="field"><label>${tx('NEXT GEN IN')}</label><div class="in" style="opacity:.8">${Number.isFinite(daysToNext()) ? tx('{n} days', { n: daysToNext() }) : '—'}</div></div></div>
      <div class="small">${ag
        ? (ag.src === 'open' ? tx('Auto: calculated from the opening date of state {s}.', { s: esc(S.session.state) }) : tx(ag.src === 'table-near' ? 'Auto: estimated from the transfer schedule of the states closest to state {s}.' : 'Auto: estimated from the transfer schedule for state {s}.', { s: esc(S.session.state) })) + ' ' + tx('If it\'s wrong, pick your Gen by hand.')
        : (S.session.state ? tx('State {s} isn\'t in the schedule: pick your Gen by hand.', { s: esc(S.session.state) }) : tx('Enter your state above to get the Gen automatically, or pick it by hand.'))}${currentGen() > 17 ? ' ' + tx('Heroes after Gen 17 aren\'t in the database yet.') : ''}</div>
    </section>
    <section class="card"><div class="card-title">${tx('Spending')}</div>
      <div class="grid4">${SPEND.map(([k, l]) => `<button class="pill ${p.spend === k ? 'on' : ''}" data-act="spend" data-v="${k}">${tx(l)}</button>`).join('')}</div>
    </section>
    <section class="card"><div class="card-head"><div class="card-title">${tx('What you do in game')}</div><div class="small">${tx('Pick all that apply')}</div></div>
      <div class="pills">${ROLES.map(([k, l]) => `<button class="pill ${p.roles.indexOf(k) >= 0 ? 'on' : ''}" data-act="role" data-v="${k}">${tx(l)}</button>`).join('')}</div>
      <div class="small">${tx('Decides which heroes the upgrade advice focuses on.')}</div>
    </section>
    <section class="card"><div class="card-title">${tx('Troops')}</div>
      ${TYPES.map((t) => `<div style="display:grid;grid-template-columns:30px minmax(0,1fr) 96px 104px;gap:8px;align-items:center">${ticon(t)}<div style="font-size:14px;font-weight:500">${TYPE_NAME[t]}</div>
        ${sel(`troops.${t}.tier`, tiers.map((x) => [x, x]), p.troops[t].tier)}${inp(`troops.${t}.count`, p.troops[t].count, `inputmode="numeric" placeholder="${tx('count')}"`)}</div>`).join('')}
      <div class="grid2"><div class="field"><label>${tx('MARCH CAPACITY')}</label>${inp('march', p.march, `inputmode="numeric" placeholder="${tx('e.g. {n}', { n: 150000 })}"`)}</div>
      <div class="field"><label>${tx('RALLY CAPACITY')}</label>${inp('rally', p.rally, `inputmode="numeric" placeholder="${tx('e.g. {n}', { n: 900000 })}"`)}</div></div>
    </section>
    <section class="card"><div class="card-head"><div class="card-title">${tx('Bonus %')}</div><div class="small">${tx('optional · improves accuracy')}</div></div>
      <div style="display:grid;grid-template-columns:72px repeat(4,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center"><div></div><div>${tx('Attack')}</div><div>${tx('Defense')}</div><div>${tx('Lethality')}</div><div>${tx('Health')}</div></div>
      ${TYPES.map((t) => `<div style="display:grid;grid-template-columns:72px repeat(4,minmax(0,1fr));gap:6px;align-items:center"><div style="font-size:12px;font-weight:600;color:var(--${t})">${TYPE_NAME[t]}</div>
        ${['atk', 'def', 'leth', 'hp'].map((k) => `<input class="in mini" data-bind="bonus.${t}.${k}" value="${esc(p.bonus[t][k])}" inputmode="decimal" aria-label="${TYPE_NAME[t]} ${k}">`).join('')}</div>`).join('')}
      <div class="small">${tx('Copy them from the bonus details of one of your battle reports. Empty = average for your Gen.')}</div>
    </section>`;
  }

  function heroList() {
    const gen = currentGen();
    let list = WOS.db.heroes.filter((h) => (h.r !== 'L' || h.g <= gen));
    if (S.heroFilter !== 'all') list = list.filter((h) => (S.heroFilter === 'joiner' ? WOS.joinerPool(gen, 'att').concat(WOS.joinerPool(gen, 'def')).indexOf(h.n) >= 0 : h.t === S.heroFilter));
    if (S.heroSearch) list = list.filter((h) => h.n.toLowerCase().indexOf(S.heroSearch.toLowerCase()) >= 0);
    const owned = (h) => isOwned(S.profile.heroes[h.n]);
    return list.sort((a, b) => (owned(b) - owned(a)) || (b.g - a.g) || a.n.localeCompare(b.n));
  }
  function joinerTag(h) {
    if (!h.sk.length) return '';
    const c = h.sk[0].c;
    if (['dmg', 'atk', 'leth', 'edef', 'etaken'].indexOf(c) >= 0 && h.sk[0].to === 'all') return tx('ATTACK JOINER');
    if (['red', 'hp', 'def', 'eatk', 'eleth'].indexOf(c) >= 0 && h.sk[0].to === 'all') return tx('DEFENSE JOINER');
    return '';
  }
  function accHeroes() {
    const levels = [];
    for (let st = 5; st >= 0; st--) {
      for (let sp = (st === 5 ? 0 : 5); sp >= 0; sp--) levels.push([`${st}.${sp}`, levelLabel(st, sp)]);
    }
    const sws = Array.from({ length: 11 }, (_, i) => [10 - i, 'Lv ' + (10 - i)]);
    const rows = heroList().map((h) => {
      const v = S.profile.heroes[h.n];
      const own = isOwned(v);
      const tag = joinerTag(h);
      return `<div class="hero-row ${own ? 'owned' : 'not-owned'}"><div class="hero-name">${ticon(h.t)}<div style="min-width:0"><div class="row" style="gap:6px"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.n)}</div><span class="gen">${h.g ? 'G' + h.g : tx(h.r === 'E' ? 'Epic' : 'Rare')}</span></div>${tag ? `<div class="jtag">${tag}</div>` : ''}</div></div>
        <select class="in mini" data-hlevel="${esc(h.n)}" aria-label="${esc(h.n)} ${tx('stars')}">${levels.map(([val, l]) => `<option value="${val}"${levelValue(v) === val ? ' selected' : ''}>${l}</option>`).join('')}</select>
        ${h.sw && h.r === 'L' ? sel(`heroes.${h.n}.sw`, sws, (v && v.sw) || 0, 'mini') : '<div class="small" style="text-align:center">—</div>'}
        <label class="nocheck" title="${tx('Not owned')}"><input type="checkbox" data-hown="${esc(h.n)}"${own ? '' : ' checked'} aria-label="${esc(h.n)} ${tx('Not owned')}"></label></div>`;
    }).join('');
    const filters = [['all', 'All'], ['inf', 'Infantry'], ['lan', 'Lancers'], ['mar', 'Marksmen'], ['joiner', 'Joiners']];
    return `<div class="row"><input class="in" id="hero-search" placeholder="${tx('Search hero')}" value="${esc(S.heroSearch)}" aria-label="${tx('Search hero')}"></div>
      <div class="pills">${filters.map(([k, l]) => `<button class="pill ${S.heroFilter === k ? 'on' : ''}" data-act="hfilter" data-v="${k}">${tx(l)}</button>`).join('')}</div>
      <div class="card blue"><div class="note">${tx('For each hero: <b>stars</b> (left = stars, right = step, e.g. 3/4) and <b>special weapon</b> level. Tick <b>Not owned</b> for heroes you don\'t have: they\'re never used in formations, but can be suggested to unlock. Choosing stars or SW unticks it. From 4★ skills count as max; joiners always count as max.')}</div></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 70px 64px 52px;gap:6px;padding:0 8px" class="small"><div>${tx('HERO')}</div><div style="text-align:center">${tx('STARS')}</div><div style="text-align:center">SW</div><div style="text-align:center">${tx('NOT OWNED')}</div></div>
      ${rows || `<div class="loading">${tx('No heroes match.')}</div>`}`;
  }

  function accGear() {
    const q = [['L', 'Legend.'], ['M', 'Mythic'], ['E', 'Epic'], ['R', 'Rare']].map(([k, l]) => [k, tx(l)]);
    return `<div class="note">${tx('Enter your <b>2 best sets per troop type</b>: for each piece the quality, enhancement (+0–100) and mastery level (Lv 0–20) shown on its icon. <b>Who wears them is decided by the calculator</b> for each event. Legendary empowerment bonuses (+20/+60/+100) are applied automatically.')}</div>
      ${TYPES.map((t) => `<section class="card"><div class="row">${ticon(t)}<div class="card-title">${TYPE_NAME[t]}</div></div>
        <div class="gear-grid small" style="text-align:center"><div></div>${WOS.PIECES.map((pc) => `<div>${PIECE_NAME[pc]}</div>`).join('')}</div>
        ${['A', 'B'].map((k) => `<div class="gear-grid"><div style="display:flex;align-items:center;font-size:12px;font-weight:700;color:${k === 'A' ? 'var(--gold)' : 'var(--soft)'}">${tx('Set {k}', { k })}</div>
          ${S.profile.gear[t][k].map((pc, i) => `<div class="gear-cell q-${esc(pc.q)}">
            <select data-bind="gear.${t}.${k}.${i}.q" aria-label="${tx('quality')}">${q.map(([v, l]) => `<option value="${v}"${pc.q === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
            <input data-bind="gear.${t}.${k}.${i}.p" value="${esc(pc.p)}" placeholder="+" inputmode="numeric" aria-label="${tx('enhancement')}">
            <input data-bind="gear.${t}.${k}.${i}.lv" value="${esc(pc.lv)}" placeholder="Lv" inputmode="numeric" aria-label="${tx('mastery level')}"></div>`).join('')}</div>`).join('')}
      </section>`).join('')}`;
  }

  /* ---------- formations ---------- */

  function viewForm() {
    const tabs = [['rally', 'Rally'], ['solo', 'Solo'], ['bear', 'Bear'], ['joe', 'Joe'], ['canyon', 'Canyon'], ['arena', 'Arena']];
    const gen = currentGen();
    const battle = S.ftab === 'rally' || S.ftab === 'solo';
    const mode = S.ftab === 'rally' ? S.rallyMode : S.soloMode;
    return `<div class="subnav"><div class="tabs" style="grid-template-columns:repeat(6,1fr)">${tabs.map(([k, l]) => `<button class="${S.ftab === k ? 'on' : ''}" data-act="ftab" data-v="${k}">${tx(l)}</button>`).join('')}</div>
      <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${S.fmode === 'mine' ? 'on' : ''}" data-act="fmode" data-v="mine">${tx('My account')}</button><button class="${S.fmode === 'meta' ? 'on' : ''}" data-act="fmode" data-v="meta">${tx('Gen {g} meta', { g: gen })}</button></div>
      ${battle ? `<div class="seg warm" style="grid-template-columns:1fr 1fr"><button class="${mode === 'attack' ? 'on' : ''}" data-act="bmode" data-v="attack">${tx('ATTACK')}</button><button class="${mode === 'defense' ? 'on' : ''}" data-act="bmode" data-v="defense">${tx('DEFENSE')}</button></div>` : ''}</div>
      ${S.fmode === 'meta' ? `<div class="card warm"><div class="note">${tx('<b>This is not your account.</b> It\'s the Gen {g} meta: every hero available in Gen {g} at 5★ and SW 10, with max gear, using your troops and bonuses. Switch to <b>My account</b> for your own formation.', { g: gen })}</div></div>` : ''}
      <div id="form-body"><div class="loading">${tx('Calculating…')}</div></div>`;
  }

  function renderFormBody() {
    const el = $('#form-body');
    if (!el) return;
    setTimeout(() => {
      try { el.innerHTML = formBody(); } catch (e) { el.innerHTML = `<div class="card red"><div class="note">${tx('Calculation error:')} ${esc(e.message)}</div></div>`; }
    }, 20);
  }

  function noHeroes() {
    return `<div class="card"><div class="note">${tx('Add your heroes in <b>Account › Heroes</b> to get formations.')}</div></div>`;
  }

  function metaGap(kind) {
    if (S.fmode !== 'mine') return '';
    const mine = cached('gap-mine-' + kind, () => kind === 'bear' ? WOS.optimizeBear(account()) : WOS.optimizeBattle(account(), { mode: 'attack', kind: 'rally' }));
    const meta = cached('gap-meta-' + kind, () => kind === 'bear' ? WOS.optimizeBear(WOS.metaAccount(account())) : WOS.optimizeBattle(WOS.metaAccount(account()), { mode: 'attack', kind: 'rally' }));
    if (!mine || !meta) return '';
    const a = kind === 'bear' ? mine.damage : mine.power;
    const b = kind === 'bear' ? meta.damage : meta.power;
    const gap = a > 0 ? Math.round((b / a - 1) * 100) : 0;
    return gap > 0 ? `<div class="small">${tx('The Gen {g} meta would be about <b>+{p}%</b> stronger here.', { g: currentGen(), p: gap })} <a href="#" data-act="nav" data-v="up">${tx('What you\'re missing')}</a></div>` : '';
  }

  function enemyForm(key) {
    const e = S.enemy[key];
    if (!e.bonus) e.bonus = blankBonus();
    const hasBonus = TYPES.some((t) => ['atk', 'def', 'leth', 'hp'].some((k) => e.bonus[t] && e.bonus[t][k] !== '' && e.bonus[t][k] != null));
    return `<section class="card red" id="enemy-card"><div class="card-head"><div class="card-title" style="color:var(--bad)">${tx('Enemy')} <span class="small" style="text-transform:none">· ${tx('optional')}</span></div><button class="chip chip-btn" data-act="enemy-clear" data-v="${key}">${tx('Clear')}</button></div>
      ${TYPES.map((t, i) => `<div style="display:grid;grid-template-columns:6px minmax(0,1fr);gap:8px;align-items:center"><div style="width:6px;height:28px;border-radius:3px;background:var(--${t})"></div>
        ${heroSelect(`data-ebind="${key}.heroes.${i}.n"`, t, e.heroes[i].n, tx('{type} hero', { type: TYPE_NAME[t] }))}</div>`).join('')}
      <div style="display:grid;grid-template-columns:50px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small">${tx('Ratio %')}</div>
        ${TYPES.map((t) => `<input class="in mini" style="color:var(--${t})" data-ebind="${key}.ratio.${t}" value="${esc(e.ratio[t])}" placeholder="${t}" inputmode="numeric">`).join('')}</div>
      <details${hasBonus ? ' open' : ''}><summary class="small" style="cursor:pointer">${tx('Enemy bonus % (12 fields, optional)')}${hasBonus ? ' · ' + tx('filled') : ''}</summary><div style="display:flex;flex-direction:column;gap:5px;margin-top:8px">${bonusGrid('data-ebind', key + '.bonus', e.bonus)}</div></details>
      <div class="small">${tx('Enemy heroes count as 5★ with max skills. Add heroes and ratio to adapt the formation; leave empty for your best formation in general.')}</div>
      <button class="btn" data-act="recalc">${tx('CALCULATE')}</button></section>`;
  }

  function closeAltsHtml(list) {
    if (!list || !list.length) return '';
    return `<div class="small">${tx('Close alternatives:')} <span style="color:var(--soft)">${list.map((a) => `${esc(a.n)} (${a.gap > 0 ? '−' + a.gap + '%' : '≈'})`).join(' · ')}</span></div>`;
  }
  function battleCard(res, kind, mode, key) {
    if (!res) return noHeroes();
    const meta = S.fmode === 'meta';
    const enemyTxt = tx(res.enemyGiven ? (meta ? 'Meta vs this enemy' : 'Against this enemy') : (mode === 'attack' ? (meta ? 'Meta best attack' : 'Your best attack') : (meta ? 'Meta best defense' : 'Your best defense')));
    const out = res.result;
    const verdict = res.enemyGiven ? (out.win ? `<span class="badge-ok" style="color:var(--ok)">${tx('Likely win · {p}% left', { p: Math.round(out.remA * 100) })}</span>` : `<span class="badge-ok" style="color:var(--bad)">${tx('Likely loss')}</span>`) : '';
    return `<section class="card"><div class="card-head"><div class="card-title">${enemyTxt}</div>${verdict || `<button class="chip chip-btn" data-act="refine">${tx('Refine vs enemy ↓')}</button>`}</div>
      <div class="label">${tx(kind === 'rally' ? (mode === 'attack' ? 'Rally leader' : 'Garrison stats provider') : 'Your march')} · ${tx('3 heroes · gear')}</div>
      ${TYPES.map((ty) => unitRow(res.units[ty], res.units[ty] ? tx('Gear {k}', { k: 'A' }) : '', 'var(--gold)')).join('')}
      ${closeAltsHtml(res.closeAlts)}
      <div class="label">${tx('Troop ratio')}</div>
      ${ratioBar(tx('Best'), res.ratio, 'var(--ok)')}${res.ratio2 ? ratioBar(tx('Second'), res.ratio2, 'var(--muted)') : ''}${legend()}
      ${res.joiners ? `<div class="label">${tx('Ask for these 4 joiners')}</div>${joinerRows(res.joiners.chosen)}${altPills(res.joiners.alts)}` : ''}
      <div class="note" style="border-top:1px solid #1E2A44;padding-top:10px"><b>${tx('Why:')}</b> ${whyBattle(res, mode)}</div></section>`;
  }
  function whyBattle(res, mode) {
    const r = res.ratio;
    let main;
    if (mode === 'defense') main = 'In defense survival comes first, so infantry stays at 50% or more (community rule).';
    else if (r.mar >= 50) main = 'Your marksmen deal the most damage, so the ratio leans on them while infantry holds the front line.';
    else main = 'A solid front line protects your damage dealers.';
    return tx(main) + (res.joiners ? ' ' + tx('Joiner buffs of different types (damage, attack, lethality) multiply each other instead of just adding up.') : '');
  }

      const res = cached(`${tag}-${key}-${mode}-${JSON.stringify(enemy)}`, () => WOS.optimizeBattle(acc, { mode, kind: key, enemy }));

        ${TYPES.map((ty) => unitRow(b.units[ty], b.units[ty] ? tx('Gear {k}', { k: 'A' }) : '')).join('')}

        <section class="card"><div class="card-head"><div class="card-title">${tx('Bear joiners')}</div><div class="small">${tx('max {n}', { n: 8 })}</div></div>
        ${b.top.map((x) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:8px;align-items:center;border-top:1px solid #1E2A44;padding-top:7px"><div><div class="jname">${esc(x.n)}</div><div class="jeff">${esc(skillText(x.n))}</div></div><div class="badge-ok" style="text-align:center;color:${x.tier === 'Top' ? 'var(--ok)' : 'var(--gold)'}">${tx(x.tier)}</div></div>`).join('')}</section>

        ${j.reinforce.length ? j.reinforce.map((n, i) => `<div class="list-row"><div class="rank">${i + 1}</div><div><div class="jname">${esc(n)}</div><div class="jeff">${esc(skillText(n))}</div></div></div>`).join('') : `<div class="small">${tx('No defensive first-slot heroes in your roster: Sergey and Patrick are free options.')}</div>`}

        <div class="small">${tx('Switch to full marksmen when infantry can no longer clear wave 20.')}</div>

  /* ---------- upgrades / next gen ---------- */

  function viewUp() {
    return `<div><div class="h-font" style="font-size:24px">${tx('Where to invest')}</div><div class="small">${tx('Only heroes that improve the formations you actually use.')}</div></div>
      <section class="card"><div class="card-head"><div class="label">${tx('Based on what you do')}</div><a href="#" data-act="nav" data-v="account">${tx('Edit')}</a></div>
      <div class="pills">${(S.profile.roles.length ? S.profile.roles : ['rallyAtk', 'bear']).map((r) => `<span class="pill on" style="cursor:default">${esc(tx((ROLES.find((x) => x[0] === r) || [r, r])[1]))}</span>`).join('')}</div>
      ${S.profile.roles.length ? '' : `<div class="small">${tx('Nothing selected yet: using attack rallies and Bear as default.')}</div>`}</section>
      <div id="up-body"><div class="loading">${tx('Calculating…')}</div></div>`;
  }
  function upLabel(x) {
    const lv = (to) => levelLabel(num(to.st, 0), num(to.sp, 0));
    if (x.kind === 'unlock' && x.to) return tx('Unlock {name} → {lv}', { name: x.hero, lv: lv(x.to) + (x.to.sw ? ' + SW ' + x.to.sw : '') });
    if (x.kind === 'stars' && x.to) return tx('{name} to {lv}', { name: x.hero, lv: lv(x.to) });
    if (x.kind === 'sw' && x.to) return tx('{name} special weapon to Lv {n}', { name: x.hero, n: x.to.sw });
    return x.label;
  }
  function renderUpBody() {
    const el = $('#up-body');
    if (!el) return;
    setTimeout(() => {
      const acc = account();
      if (!Object.keys(acc.heroes).length) { el.innerHTML = noHeroes(); return; }
      const adv = cached('up', () => WOS.upgradeAdvice(acc, S.profile.roles));
      const items = adv.invest.map((x, i) => `<section class="card" style="${i === 0 ? 'border-color:#6B4A12' : ''}">
        <div class="row"><div class="rank" style="width:28px;height:28px;border-radius:8px;background:${i === 0 ? 'var(--ember)' : '#1B2A47'};color:${i === 0 ? '#1A1206' : 'var(--ice)'};display:flex;align-items:center;justify-content:center">${i + 1}</div>
        <div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(upLabel(x))}</div><div class="small">${tx('Now:')} ${esc(x.kind === 'unlock' ? tx('Not owned') : x.now)}</div></div><div class="h-font" style="color:var(--ok)">+${x.gain.toFixed(1)}%</div></div>
        <div class="note"><b>${tx('Why:')}</b> ${tx(x.kind === 'unlock' ? 'You don\'t own {name} yet: at this level it would enter your formations for what you do. Below it, your current heroes are better.' : (x.inUse ? '{name} is in your best formations, so this improves the events you play.' : 'With this upgrade {name} becomes better than the hero you use now.'), { name: esc(x.hero) })}</div></section>`).join('');
      const avoid = adv.avoid.length ? `<section class="card red"><div class="card-title" style="color:var(--bad)">${tx('Don\'t invest')}</div>
        <div class="note">${adv.avoid.map(esc).join(', ')}: ${tx('not used in your best formations for what you do, and one more upgrade doesn\'t change that.')}</div></section>` : '';
      const days = daysToNext();
      const soon = Number.isFinite(days) && days <= 30 && currentGen() < 17
        ? `<section class="card warm"><div class="note">${tx('<b>Next gen in {n} days.</b> Prefer upgrades that are cheap or that keep value (SW, joiner skills). Avoid pushing an old hero to 5★ now: check Next Gen first.', { n: days })}</div></section>` : '';
      el.innerHTML = soon + (items || `<div class="card"><div class="note">${tx('No upgrade gives a clear gain right now: your current heroes are already the best choice for what you do.')}</div></div>`) + avoid +
        `<div class="small">${tx('Estimated by the simulator. The more reports are sent, the more accurate it gets.')}</div>`;
    }, 20);
  }

  function viewGen() {
    const gen = currentGen();
    const days = daysToNext();
    return `<section class="card"><div class="label">${tx('Next generation')}</div>
      <div class="row" style="align-items:baseline"><div class="h-font" style="font-size:42px;color:var(--ember)">Gen ${gen + 1}</div>${Number.isFinite(days) ? `<div class="small">${tx('in {n} days', { n: days })}</div>` : ''}</div></section>
      <div id="gen-body"><div class="loading">${tx('Calculating…')}</div></div>`;
  }
  function renderGenBody() {
    const el = $('#gen-body');
    if (!el) return;
    setTimeout(() => {
      const acc = account();
      if (!Object.keys(acc.heroes).length) { el.innerHTML = noHeroes(); return; }
      const adv = cached('gen', () => WOS.nextGenAdvice(acc, S.profile.roles, S.profile.spend));
      if (!adv.picks.length) { el.innerHTML = `<div class="card"><div class="note">${tx('No newer generation is known yet.')}</div></div>`; return; }
      const days = daysToNext();
      const inv = adv.picks.filter((p) => p.verdict === 'Invest').map((p) => TYPE_NAME[p.type].toLowerCase());
      let timing = '';
      if (Number.isFinite(days) && inv.length) {
        timing = days <= 30
          ? `<section class="card warm"><div class="note"><b>${tx('Timing:')}</b> ${tx('Gen {g} arrives in {n} days. Save shards, SW materials and gear for your new {types} hero now: don\'t push your current {types} heroes to 5★, they\'ll be replaced soon.', { g: adv.gen, n: days, types: inv.join(' / ') })}</div></section>`
          : `<section class="card"><div class="note"><b>${tx('Timing:')}</b> ${tx('Gen {g} is {n} days away. You still get good use from upgrades on your current heroes; start saving about 30 days before.', { g: adv.gen, n: days })}</div></section>`;
      }
      el.innerHTML = timing + adv.picks.map((p, i) => {
        const color = p.verdict === 'Invest' ? 'var(--ok)' : (p.verdict === 'Skip' ? 'var(--muted)' : 'var(--gold)');
        const target = p.target ? `${p.target.st}★${p.target.sw ? ' + SW ' + p.target.sw : ''}` : '—';
        return `<section class="card ${p.verdict === 'Invest' && i === 0 ? 'warm' : ''}"><div class="row">${ticon(p.type)}<div style="flex:1"><div style="font-size:16px;font-weight:600">${esc(p.name)}</div><div class="small">Gen ${adv.gen} · ${TYPE_NAME[p.type]}</div></div><div class="badge-ok" style="color:${color}">${tx(p.verdict)}</div></div>
          <div class="grid2"><div class="card" style="padding:10px;gap:2px"><div class="label">${tx('Useful from')}</div><div class="h-font" style="font-size:18px">${target}</div></div><div class="card" style="padding:10px;gap:2px"><div class="label">${tx('Gain when maxed')}</div><div class="h-font" style="font-size:18px">${p.gainMax > 0 ? '+' + p.gainMax.toFixed(1) + '%' : '—'}</div></div></div>
          <div class="note"><b>${tx('Why:')}</b> ${p.target ? tx('From {lv} this hero makes your formations stronger for what you do.', { lv: target }) : tx('Even maxed, this hero doesn\'t beat the heroes you already use for what you do.')} ${p.verdict === 'Only if spare' ? tx('With your spending, put resources here only after the first pick.') : ''}</div></section>`;
      }).join('') + `<div class="small">${tx('Advice depends on your spending profile and on what you do in game (Account › Profile).')}</div>`;
    }, 20);
  }

  /* ---------- alliance (R5) / state (Super) ---------- */

  const STALE_DAYS = 30;
  const RULE_KEYS = ['cj10', 'cj20', 'bear1', 'bear2'];
  const RULE_TITLE = { cj10: 'Crazy Joe · Wave 10', cj20: 'Crazy Joe · Wave 20', bear1: 'Bear Trap 1', bear2: 'Bear Trap 2' };
  function playerGen(pl) {
    const p = pl.profile || {};
    if (p.genManual !== '' && p.genManual != null) return num(p.genManual, 1);
    const st = S.team && S.team.state;
    const a = autoGen(st);
    return a ? a.gen : num(p.gen, 1);
  }
  // Helios = T11 troops (T12 not counted for now)
  function isHelios(tier) { return /^T11\b/.test(String(tier || '')); }
  function squadOf(res, acc) {
    if (!res) return null;
    return {
      heroes: TYPES.map((t) => {
        const u = res.units[t];
        if (!u || !u.h) return null;
        return { t, n: u.h.n, meta: `${u.h.g ? 'G' + u.h.g : tx(u.h.r === 'E' ? 'Epic' : 'Rare')} · ${levelLabel(u.st, u.sp || 0)}${u.h.sw ? ' · SW ' + u.sw : ''}` };
      }).filter(Boolean),
      ratio: res.ratio, ratio2: res.ratio2,
      joiners: res.joiners ? res.joiners.chosen : [], alts: res.joiners ? res.joiners.alts : [], closeAlts: res.closeAlts || [],
    };
  }
  function calcPlayer(pl) {
    const prof = mergeProfile(pl.profile);
    const gen = playerGen(pl);
    const acc = account(prof, gen);
    const out = { user: pl.user, alliance: pl.alliance, gen, heroes: Object.keys(acc.heroes).length,
      age: pl.updated ? Math.floor((Date.now() - new Date(pl.updated).getTime()) / 86400000) : null,
      helios: {}, rally: 0, atk: null, def: null, acc };
    TYPES.forEach((ty) => { out.helios[ty] = isHelios(prof.troops[ty].tier); });
    if (!out.heroes) return out;
    try {
      const r = WOS.optimizeBattle(acc, { mode: 'attack', kind: 'rally' });
      out.rally = r ? r.power : 0;
      out.atk = squadOf(r, acc);
    } catch (e) { /* keep zeros */ }
    return out;
  }
  function defenseOf(x) {
    if (!x.def && x.heroes) {
      try { x.def = squadOf(WOS.optimizeBattle(x.acc, { mode: 'defense', kind: 'rally' }), x.acc); } catch (e) { x.def = null; }
    }
    return x.def;
  }
  async function loadTeam() {
    const el = $('#team-body');
    if (!el) return;
    if (S.team && S.team.calc) { paintTeam(); return; }
    if (!S.team || !S.team.players) {
      el.innerHTML = `<div class="loading">${tx('Loading players…')}</div>`;
      try {
        const r = await api('overview', { user: S.session.user, code: S.session.code });
        if (!r.ok) throw new Error(r.error || 'error');
        S.team = { players: r.players || [], scope: r.scope, state: r.state, alliance: r.alliance, rules: r.rules || {}, at: new Date() };
      } catch (e) { el.innerHTML = `<div class="card red"><div class="note">${tx('Not loaded:')} ${esc(tx(e.message))}</div></div>`; return; }
    }
    const list = S.team.players;
    const calc = [];
    for (let i = 0; i < list.length; i++) {
      if (S.view !== 'team') return;
      const cur = $('#team-body');
      if (cur && i % 3 === 0) cur.innerHTML = `<div class="loading">${tx('Calculating {i}/{n} players…', { i: i + 1, n: list.length })}</div>`;
      await new Promise((res) => setTimeout(res, 0));
      calc.push(calcPlayer(list[i]));
    }
    S.team.calc = calc;
    paintTeam();
  }
  function rel(v, max) { return max > 0 ? Math.round((v / max) * 100) : 0; }

  function squadHtml(sq) {

  function captainsCard(rows, showAlly, title) {

      const head = `<button type="button" data-act="cap-open" data-v="${esc(x.user)}" style="display:grid;grid-template-columns:22px minmax(0,1fr)${showAlly ? ' 48px' : ''} 36px 14px;gap:6px;align-items:center;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer"><div class="rank">${page * 5 + i + 1}</div><div style="min-width:0"><div class="jname" style="font-size:13px;overflow:hidden;text-overflow:ellipsis">${esc(x.user)}</div><div class="jeff">Gen ${x.gen}${x.atk ? ' · ' + esc(x.atk.heroes.map((h) => h.n).join(' / ')) : ''}${x.age == null || x.age > STALE_DAYS ? ` · <span style="color:var(--bad)">${tx('old data')}</span>` : ''}</div></div>${showAlly ? `<div class="small">[${esc(x.alliance)}]</div>` : ''}<div class="num">${rel(x.rally, maxR)}</div><div class="small">${open ? '▴' : '▾'}</div></button>`;

        <div class="seg warm" style="grid-template-columns:1fr 1fr"><button class="${mode === 'attack' ? 'on' : ''}" data-act="cap-mode" data-v="attack">${tx('Attack')}</button><button class="${mode === 'defense' ? 'on' : ''}" data-act="cap-mode" data-v="defense">${tx('Defense')}</button></div>
        ${squadHtml(sq)}</div>`;
    };
    return `<section class="card"><div class="card-head"><div class="card-title">${title}</div>${showAlly ? `<button class="chip chip-btn" data-act="team-csv">${tx('Export')}</button>` : `<div class="small">${tx('Strength')}</div>`}</div>
      <div id="cap-list" style="display:flex;flex-direction:column;gap:8px;touch-action:pan-y">${shown.length ? shown.map(item).join('') : `<div class="small">${tx('Nobody has entered heroes yet.')}</div>`}</div>
      ${pages > 1 ? `<div class="row" style="justify-content:center;gap:14px"><button class="chip chip-btn" data-act="cap-page" data-v="0" aria-label="${tx('Previous page')}" style="${page === 0 ? 'opacity:.4' : ''}">‹</button>
        <div class="row" style="gap:6px"><span style="width:${page === 0 ? 18 : 6}px;height:6px;border-radius:3px;background:${page === 0 ? 'var(--ember)' : '#3B5687'}"></span><span style="width:${page === 1 ? 18 : 6}px;height:6px;border-radius:3px;background:${page === 1 ? 'var(--ember)' : '#3B5687'}"></span></div>
        <button class="chip chip-btn" data-act="cap-page" data-v="1" aria-label="${tx('Next page')}" style="${page === 1 ? 'opacity:.4' : ''}">›</button></div>
        <div class="small" style="text-align:center">${tx('{a}–{b} of {n} · swipe left or right for the others', { a: page * 5 + 1, b: Math.min(page * 5 + 5, ranked.length), n: ranked.length })}</div>` : ''}
      <div class="small">${tx('Tap a player to see the attack and defense squads. Strength: 100 = strongest.')}</div></section>`;

  /* alliance rules: Crazy Joe waves and Bear traps */
  function blankRules() { const o = {}; RULE_KEYS.forEach((k) => { o[k] = { joiners: [], ratio: { inf: '', lan: '', mar: '' }, max: '', every: '' }; }); return o; }
  function rulesFor(allyKey) {
    const r = (S.team && S.team.rules && S.team.rules[allyKey]) || (allyKey === String(S.session.alliance || '').toLowerCase() ? S.session.rules : null);
    return r || null;
  }
  function hasRule(r) { return r && ((r.joiners && r.joiners.length) || r.max || r.every || (r.ratio && (r.ratio.inf || r.ratio.lan || r.ratio.mar))); }
  function maxText(r) { return r.max ? tx('max {n} troops', { n: Number(r.max).toLocaleString() }) : tx('Full troops'); }
  function ruleSummary(k, r) {
    const j = (r.joiners || []).map((n, i) => `${i + 1} ${esc(n)}`).join(' · ') || '—';
    const ratio = r.ratio && (r.ratio.inf || r.ratio.lan || r.ratio.mar) ? `${r.ratio.inf || 0}/${r.ratio.lan || 0}/${r.ratio.mar || 0}` : '';
    return `<div style="border-top:1px solid #5A4A1A;padding-top:7px;display:flex;flex-direction:column;gap:3px"><div class="row" style="justify-content:space-between"><b style="color:${k.indexOf('cj') === 0 ? '#FECACA' : 'var(--gold)'};font-size:13px">${RULE_TITLE[k]}</b><span class="small" style="color:#E8D9B8">${k.indexOf('bear') === 0 && r.every ? tx('a wave every {n} s', { n: esc(r.every) }) + ' · ' : ''}${maxText(r)}</span></div>
      <div class="small" style="color:#E8D9B8">${tx('Joiners')}: <span style="color:var(--text)">${j}</span>${ratio ? ` · ${tx('Ratio')} <span style="color:var(--text)">${ratio}</span>` : ''}</div></div>`;
  }
  function rulesBanner(kind) {
    const rules = S.session && S.session.rules;
    if (!rules) return '';
    const keys = kind === 'joe' ? ['cj10', 'cj20'] : ['bear1', 'bear2'];
    const shown = keys.filter((k) => hasRule(rules[k]));
    if (!shown.length) return '';
    return `<section class="card warm" style="border-color:var(--ember)"><div class="row" style="justify-content:space-between"><b style="color:var(--gold);font-size:13px">${tx('Alliance rules [{a}]', { a: esc(S.session.alliance) })}</b><span class="small" style="color:#E8D9B8">${rules.updatedAt ? new Date(rules.updatedAt).toLocaleDateString() : ''}</span></div>
      ${shown.map((k) => ruleSummary(k, rules[k])).join('')}
      ${kind === 'joe' ? `<div class="small" style="color:#E8D9B8">${tx('Your alliance rules come first when they differ from the advice below.')}</div>` : ''}</section>`;
  }
  function rulesCard(allyKey, allyLabel, editable) {
    const saved = rulesFor(allyKey);
    if (!editable) {
      const shown = saved ? RULE_KEYS.filter((k) => hasRule(saved[k])) : [];
      return `<section class="card warm"><div class="card-title" style="color:var(--gold)">${tx('Alliance rules')}</div>
        ${shown.length ? shown.map((k) => ruleSummary(k, saved[k])).join('') : `<div class="small" style="color:#E8D9B8">${tx('No rules set by the R5s of [{a}] yet.', { a: esc(allyLabel) })}</div>`}
        ${saved && saved.updatedBy ? `<div class="small" style="color:#E8D9B8">${tx('Last change: {who} · {when}', { who: esc(saved.updatedBy), when: saved.updatedAt ? new Date(saved.updatedAt).toLocaleString() : '' })}</div>` : ''}</section>`;
    }
    if (!S.rulesDraft) {
      S.rulesDraft = blankRules();
      if (saved) RULE_KEYS.forEach((k) => { if (saved[k]) S.rulesDraft[k] = Object.assign(blankRules()[k], JSON.parse(JSON.stringify(saved[k]))); if (!S.rulesDraft[k].ratio) S.rulesDraft[k].ratio = { inf: '', lan: '', mar: '' }; });
    }
    const d = S.rulesDraft;
    const block = (k) => {
      const r = d[k];
      const cj = k.indexOf('cj') === 0;
      return `<div style="background:var(--bg2);border:1px solid #5A4A1A;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px">
        <b style="font-size:13px;color:${cj ? '#FECACA' : 'var(--gold)'}">${RULE_TITLE[k]}</b>
        <div class="small" style="color:#E8D9B8">${tx('Joiners (up to 8, in order)')}</div>
        <div class="pills">${r.joiners.map((n, i) => `<button class="pill" style="color:var(--gold);border-color:#5A4A1A" data-act="rule-rm" data-v="${k}.${i}" aria-label="${tx('Remove')} ${esc(n)}">${i + 1} ${esc(n)} ×</button>`).join('')}</div>
        ${r.joiners.length < 8 ? heroSelect(`data-rule-add="${k}"`, null, '', '+ ' + tx('Add joiner')) : ''}
        ${cj ? `<div style="display:grid;grid-template-columns:80px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small" style="color:#E8D9B8">${tx('Ratio %')}</div>${TYPES.map((t) => `<input class="in mini" style="color:var(--${t})" data-rule="${k}.ratio.${t}" value="${esc(r.ratio[t])}" placeholder="${t}" inputmode="numeric">`).join('')}</div>` : ''}
        <div style="display:grid;grid-template-columns:80px minmax(0,1fr);gap:6px;align-items:center"><div class="small" style="color:#E8D9B8">${tx('Max troops')}</div><input class="in" data-rule="${k}.max" value="${esc(r.max)}" inputmode="numeric" placeholder="${tx('empty = Full troops')}"></div>
        ${cj ? '' : `<div class="row small" style="color:#E8D9B8;gap:8px">${tx('A rally wave every')}<input class="in" style="width:64px;text-align:center" data-rule="${k}.every" value="${esc(r.every)}" inputmode="numeric">${tx('seconds')}</div>`}
      </div>`;

      <div class="small" style="color:#E8D9B8">${tx('All [{a}] players see them at the top of the Crazy Joe and Bear tabs. Any R5 of the alliance can change them: the last saved version counts. Empty max troops = "Full troops".', { a: esc(allyLabel) })}</div>
      ${RULE_KEYS.map(block).join('')}
      <button class="btn" data-act="rules-save">${tx('SAVE RULES')}</button>
      ${saved && saved.updatedBy ? `<div class="small" style="color:#E8D9B8">${tx('Last change: {who} · {when}', { who: esc(saved.updatedBy), when: saved.updatedAt ? new Date(saved.updatedAt).toLocaleString() : '' })}</div>` : ''}</section>`;
  }
  async function saveRules(btn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = tx('SENDING…');
    try {
      const r = await api('saveRules', { user: S.session.user, code: S.session.code, rules: S.rulesDraft });
      if (!r.ok) throw new Error(r.error || 'error');
      S.session.rules = r.rules || null;
      if (S.team) { S.team.rules = S.team.rules || {}; S.team.rules[String(S.session.alliance || '').toLowerCase()] = r.rules; }
      S.rulesDraft = null;
      toast(tx('Rules saved: your alliance sees them now'));
      paintTeam();
    } catch (e) {
      btn.disabled = false; btn.textContent = label;
      toast(tx('Not sent:') + ' ' + tx(e.message));
    }
  }

  function allianceView(rows, allyLabel) {
    const own = String(S.session.alliance || '').toLowerCase();
    const key = String(allyLabel || '').toLowerCase();
    const editable = leadRoles().r5 && key === own;
    return registeredCard(rows) + heliosCard(rows) + captainsCard(rows, false, tx('Top 10 rally captains')) + rulesCard(key, allyLabel, editable);
  }
  function paintTeam() {
    const el = $('#team-body');
    if (!el || !S.team || !S.team.calc) return;
    const all = S.team.calc;
    const sup = teamMode() === 'state';
    const tags = Array.from(new Set(all.map((x) => x.alliance).filter(Boolean))).sort();
    const own = String(S.session.alliance || '').toLowerCase();
    const ally = sup ? (S.teamAlly || '') : S.session.alliance;
    const rows = ally ? all.filter((x) => x.alliance.toLowerCase() === String(ally).toLowerCase()) : all;
    const stamp = `<div class="row" style="justify-content:space-between"><div class="small">${tx('{n} players · updated {time}', { n: rows.length, time: S.team.at.toTimeString().slice(0, 5) })}</div><button class="chip chip-btn" data-act="team-refresh">${tx('Refresh')}</button></div>`;
    let html = stamp;
    if (sup) html += `<div class="pills"><button class="pill ${!ally ? 'on' : ''}" data-act="team-ally" data-v="">${tx('All alliances')}</button>${tags.map((tg) => `<button class="pill ${ally === tg ? 'on' : ''}" data-act="team-ally" data-v="${esc(tg)}">[${esc(tg)}]</button>`).join('')}</div>`;
    if (!rows.length && !sup) html += `<div class="card"><div class="note">${tx('No players found in your scope yet.')}</div></div>` + rulesCard(own, S.session.alliance, leadRoles().r5);
    else if (sup && !ally) html += heliosCard(all) + captainsCard(all, true, tx('Top 10 rally leaders')) + `<div class="small">${tx('Strength = simulated damage of the same standard rally for every player (100 = strongest in the state), not the in-game Power. Profiles not updated for over {n} days are marked in red.', { n: STALE_DAYS })}</div>`;
    else html += allianceView(rows, ally);
    el.innerHTML = html;
    const list = $('#cap-list');
    if (list) {
      let x0 = null; let y0 = null;
      list.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      list.addEventListener('touchend', (e) => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0; const dy = e.changedTouches[0].clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { S.capPage = S.capPage ? 0 : 1; S.capOpen = null; paintTeam(); }
      });
    }
  }
  function exportTeam() {
    if (!S.team || !S.team.calc) return;
    const all = S.team.calc;
    const maxR = Math.max(0, ...all.map((x) => x.rally));
    const head = ['player', 'alliance', 'gen', 'heroes', 'rally_strength', 'attack_heroes', 'attack_ratio', 'attack_joiners', 'helios_inf', 'helios_lan', 'helios_mar', 'days_since_update'];
    const q = (v) => { const x = String(v == null ? '' : v); return /[",;\n]/.test(x) || /^[=+\-@]/.test(x) ? '"' + x.replace(/^([=+\-@])/, "'$1").replace(/"/g, '""') + '"' : x; };
    const lines = [head.join(',')].concat(all.map((x) => [x.user, x.alliance, x.gen, x.heroes, rel(x.rally, maxR), x.atk ? x.atk.heroes.map((h) => h.n).join(' / ') : '', x.atk ? WOS.ratioText(x.atk.ratio) : '', x.atk ? x.atk.joiners.join(' / ') : '', x.helios.inf ? 1 : 0, x.helios.lan ? 1 : 0, x.helios.mar ? 1 : 0, x.age == null ? '' : x.age].map(q).join(',')));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wos-top-state-${S.team.state || 'x'}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  // 'alliance' or 'state': R5 only → alliance, Super only → state, both → the player's choice
  function teamMode() {

    return l.sup ? 'state' : 'alliance';
  }

      <div id="team-body"><div class="loading">${tx('Loading players…')}</div></div>`;
  }

  /* ---------- report ---------- */

      <section class="card"><div class="card-title">1 · ${tx('Battle')}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${types.map(([k, l]) => `<button class="pill ${r.type === k ? 'on' : ''}" style="padding:9px 1px;font-size:11px;overflow:hidden;text-overflow:ellipsis" data-act="rtype" data-v="${k}">${tx(l)}</button>`).join('')}</div>
        <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${r.role === 'attacker' ? 'on' : ''}" data-act="rrole" data-v="attacker">${tx('I attacked')}</button><button class="${r.role === 'defender' ? 'on' : ''}" data-act="rrole" data-v="defender">${tx(rally ? 'I defended (garrison)' : 'I defended')}</button></div>
        ${pvp ? `<div class="grid2"><button class="pill ${r.result === 'win' ? 'on' : ''}" data-act="rres" data-v="win">${tx('VICTORY')}</button><button class="pill ${r.result === 'loss' ? 'on' : ''}" data-act="rres" data-v="loss">${tx('DEFEAT')}</button></div>` : ''}
        <label class="row small" style="gap:8px;cursor:pointer"><input type="checkbox" data-rcheck="mine"${r.mine ? ' checked' : ''} style="width:18px;height:18px;accent-color:#F59E0B">${tx('This is my report (my side is me)')}</label>
      </section>
      <section class="card"><div class="card-title">2 · ${tx('Heroes')}</div>
        ${pvp ? headTE : ''}
        ${TYPES.map((t) => `<div style="display:grid;grid-template-columns:6px minmax(0,1fr)${pvp ? ' minmax(0,1fr)' : ''};gap:6px;align-items:center"><div style="width:6px;height:28px;border-radius:3px;background:var(--${t})"></div>${heroSelect(`data-rbind="my.${t}"`, t, r.my[t], TYPE_NAME[t])}${pvp ? heroSelect(`data-rbind="en.${t}"`, t, r.en[t], TYPE_NAME[t]) : ''}</div>`).join('')}
        <div class="small">${tx('Each menu only lists heroes of that type. Heroes count as 5★ with max skills.')}</div>
      </section>
      ${pvp ? `<section class="card"><div class="card-title">3 · ${tx('Troops')}</div>${headTE}
        ${col2("Troops", numIn("myTotal"), numIn("enTotal"))}${col2("Survivors", numIn("mySurv"), numIn("enSurv"))}
        <div class="small" style="border-top:1px solid #1E2A44;padding-top:8px">${tx('Troops per type (from "Troop Power Comparison") · optional')}</div>
        ${[['myRatio', tx('You')], ['enRatio', tx('Enemy')]].map(([b, l]) => `<div style="display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small" style="color:var(--soft)">${l}</div>${TYPES.map((t) => `<input class="in mini" style="color:var(--${t})" data-rbind="${b}.${t}" value="${esc(r[b][t])}" placeholder="${t}" inputmode="numeric">`).join('')}</div>`).join('')}
      </section>` : ''}
      ${rally ? `<section class="card warm"><div class="card-title" style="color:var(--gold)">${tx('First 4 joiners activated')}</div>
        ${rally ? headTE : ''}
        ${[0, 1, 2, 3].map((i) => `<div style="display:grid;grid-template-columns:20px minmax(0,1fr)${rally ? ' minmax(0,1fr)' : ''};gap:6px;align-items:center"><div class="rank">${i + 1}</div>${heroSelect(`data-rbind="myJoiners.${i}"`, null, r.myJoiners[i], '—')}${rally ? heroSelect(`data-rbind="enJoiners.${i}"`, null, r.enJoiners[i], '—') : ''}</div>`).join('')}
        <div class="small">${tx('Only the hero in the 1st slot of each joiner. The same hero can be picked more than once.')}</div></section>` : ''}
      <section class="card"><div class="card-title">${pvp ? '4' : '3'} · Stat Bonuses</div>
        <div class="small">${tx('Same order as the table at the bottom of the report.')}</div>
        ${pvp ? headTE.replace('84px', '96px').replace('84px', '96px') : ''}
        ${bonusRows.map(([t, k]) => `<div style="display:grid;grid-template-columns:96px minmax(0,1fr)${pvp ? ' minmax(0,1fr)' : ''};gap:6px;align-items:center"><div style="font-size:11px;font-weight:600;color:var(--${t})">${TYPE_NAME[t]} ${tx(statName[k]).toLowerCase()}</div><input class="in mini" data-rbind="myBonus.${t}.${k}" value="${esc(r.myBonus[t][k])}" inputmode="decimal" aria-label="${tx('You')} ${TYPE_NAME[t]} ${k}">${pvp ? `<input class="in mini" data-rbind="enBonus.${t}.${k}" value="${esc(r.enBonus[t][k])}" inputmode="decimal" aria-label="${tx('Enemy')} ${TYPE_NAME[t]} ${k}">` : ''}</div>`).join('')}
      </section>
      <section class="card"><div class="card-title">${pvp ? '5' : '4'} · ${tx('Active bonuses')}</div>
        <div class="small">${tx('From "Notes on Special Bonuses" (tap the ! next to Stat Bonuses). Bonuses bought with gems: 0, 10 or 20%.')}</div>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 96px${pvp ? ' 96px' : ''};gap:6px;font-size:10px;color:var(--muted)"><div></div><div style="text-align:center">${tx('YOU')}</div>${pvp ? `<div style="text-align:center">${tx('ENEMY')}</div>` : ''}</div>
        ${BUFFS.map((k) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 96px${pvp ? ' 96px' : ''};gap:6px;align-items:center;border-top:1px solid #1E2A44;padding-top:6px"><div class="small" style="color:var(--soft)">${tx(buffLabels[k])}</div>${seg('my', k)}${pvp ? seg('en', k) : ''}</div>`).join('')}
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 96px${pvp ? ' 96px' : ''};gap:6px;align-items:center;border-top:1px solid #1E2A44;padding-top:6px"><div class="small" style="color:var(--soft)">${tx('Pet skills active')}</div><label class="nocheck"><input type="checkbox" data-rcheck="pets.my"${r.pets.my ? ' checked' : ''} aria-label="${tx('Pet skills active')} ${tx('You')}"></label>${pvp ? `<label class="nocheck"><input type="checkbox" data-rcheck="pets.en"${r.pets.en ? ' checked' : ''} aria-label="${tx('Pet skills active')} ${tx('Enemy')}"></label>` : ''}</div>
      </section>
      <section class="card">
        <div class="field"><label>${tx('NOTES')} · ${tx('optional')}</label><input class="in" data-rbind="notes" value="${esc(r.notes)}" maxlength="300"></div></section>
      <div style="display:grid;grid-template-columns:${pvp ? '1fr 1.4fr' : '1fr'};gap:8px">
        <button class="btn ghost" style="font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:.1em;font-size:15px" data-act="send-report" data-v="save">${tx('SAVE')}</button>
        ${pvp ? `<button class="btn" data-act="send-report" data-v="use">${tx('SAVE AND USE')}</button>` : ''}
      </div>
      <div class="small"><b>${tx('Save:')}</b> ${tx('sends the report to the shared sheet.')}${pvp ? ` <b>${tx('Save and use:')}</b> ${tx('also updates your profile bonuses (without the bonuses bought with gems) and prepares the formation against this enemy.')}` : ''}</div>
      ${S.lastPrediction ? `<section class="card blue"><div class="note">${esc(S.lastPrediction)}</div></section>` : ''}`;
  }

  /* ---------- render & events ---------- */

  function render() {
    const app = $('#app');
    if (!S.session) { app.innerHTML = viewLogin(S.loginError); return; }
    let body = '';
    if (S.view === 'account') body = viewAccount();
    else if (S.view === 'form') body = viewForm();
    else if (S.view === 'up') body = viewUp();
    else if (S.view === 'gen') body = viewGen();
    else if (S.view === 'team' && leadRole()) body = viewTeam();
    else body = viewReport();
    app.innerHTML = `${header()}<main>${body}</main>${bottomNav()}`;
    const hd = document.querySelector('header.top');
    if (hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');
    if (S.view === 'form') renderFormBody();
    if (S.view === 'up') renderUpBody();
    if (S.view === 'gen') renderGenBody();
    if (S.view === 'team' && leadRole()) loadTeam();
  }

  async function doLogin(user, code) {
    const btn = $('#login-btn');
    if (btn) { btn.disabled = true; btn.textContent = tx('CHECKING…'); }
    try {
      const r = await api('login', { user, code });
      if (!r.ok) { S.loginError = r.error || 'Invalid username or code'; render(); return; }
      S.session = { user, code, state: r.state || '', alliance: r.alliance || '', role: r.role || 'user', stateOpen: r.stateOpen || '', rules: r.rules || null };
      S.profile = mergeProfile(r.profile);
      S.loginError = '';
      try { sessionStorage.setItem('wostop_session', JSON.stringify({ user, code })); } catch (e) { /* ignore */ }
      render();
    } catch (e) {
      S.loginError = 'Connection error, try again.'; render();
    }
  }

  document.addEventListener('submit', (ev) => {
    if (ev.target.id === 'login-form') {
      ev.preventDefault();
      doLogin($('#lu').value.trim(), $('#lc').value.trim());
    }
  });

  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const v = el.dataset.v;
    if (el.tagName === 'A') ev.preventDefault();
    if (act === 'nav') { S.view = v; window.scrollTo(0, 0); render(); }
    else if (act === 'sub') { S.sub = v; render(); }
    else if (act === 'logout') {
      clearTimeout(S.saveTimer); await saveNow();
      S.session = null; S.profile = null; S.cache = {}; S.team = null; S.teamAlly = ''; S.rulesDraft = null; S.capOpen = null; S.capPage = 0; S.view = 'account'; S.sub = 'profile';
      try { sessionStorage.removeItem('wostop_session'); } catch (e) { /* ignore */ }
      render();
    } else if (act === 'spend') { S.profile.spend = v; scheduleSave(); render(); }
    else if (act === 'role') {
      const i = S.profile.roles.indexOf(v);
      if (i >= 0) S.profile.roles.splice(i, 1); else S.profile.roles.push(v);
      scheduleSave(); render();
    } else if (act === 'hfilter') { S.heroFilter = v; render(); }
    else if (act === 'ftab') { S.ftab = v; render(); }
    else if (act === 'fmode') { S.fmode = v; render(); }
    else if (act === 'bmode') { if (S.ftab === 'rally') S.rallyMode = v; else S.soloMode = v; render(); }
    else if (act === 'joe') { S.joeMode = v; render(); }
    else if (act === 'enemy-clear') { S.enemy[v] = blankEnemy(); render(); }
    else if (act === 'recalc') { render(); }
    else if (act === 'refine') { const c = $('#enemy-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (act === 'rtype') { S.report.type = v; render(); }
    else if (act === 'rrole') { S.report.role = v; render(); }
    else if (act === 'rres') { S.report.result = v; render(); }
    else if (act === 'send-report') { sendReport(el, v === 'use'); }
    else if (act === 'rbuff') { const [sd, k, val] = v.split('.'); S.report.buffs[sd][k] = num(val, 0); render(); }
    else if (act === 'team-refresh') { S.team = null; S.rulesDraft = null; render(); }
    else if (act === 'team-ally') { S.teamAlly = v; S.capPage = 0; S.capOpen = null; paintTeam(); }
    else if (act === 'team-scope') { S.teamScope = v; S.capPage = 0; S.capOpen = null; render(); }
    else if (act === 'helios-toggle') { S.heliosOpen = !S.heliosOpen; paintTeam(); }
    else if (act === 'cap-page') { S.capPage = num(v, 0); S.capOpen = null; paintTeam(); }
    else if (act === 'cap-open') { S.capOpen = S.capOpen === v ? null : v; paintTeam(); }
    else if (act === 'cap-mode') { S.capMode = v; paintTeam(); }
    else if (act === 'rule-rm') { const [k, i] = v.split('.'); S.rulesDraft[k].joiners.splice(num(i, 0), 1); paintTeam(); }
    else if (act === 'rules-save') { saveRules(el); }
    else if (act === 'team-csv') { exportTeam(); }
    else if (act === 'save') { clearTimeout(S.saveTimer); await saveNow(); toast(S.saveState === 'Saved' ? tx('Saved: formations and upgrades now use these data') : saveLabel()); }
  });

  document.addEventListener('change', (ev) => {
    if (ev.target.dataset && 'lang' in ev.target.dataset) {
      LANG = ev.target.value;
      try { localStorage.setItem('wostop_lang', LANG); } catch (e) { /* ignore */ }
      document.documentElement.lang = LANG;
      render();
      return;
    }
    const t = ev.target;
    if (t.dataset.ruleAdd) {
      if (t.value && S.rulesDraft) S.rulesDraft[t.dataset.ruleAdd].joiners.push(t.value);
      paintTeam();
      return;
    }
    if (t.dataset.rule) { if (S.rulesDraft) setPath(S.rulesDraft, t.dataset.rule, t.value.replace(/[^0-9]/g, '')); return; }
    if (t.dataset.sbind) {
      S.session[t.dataset.sbind] = t.value.trim().slice(0, t.dataset.sbind === 'alliance' ? 12 : 10);
      scheduleSave();
      const hdr = document.querySelector('header.top');
      if (hdr) hdr.outerHTML = header();
      if (t.dataset.sbind === 'state') { clearTimeout(S.stTimer); S.stTimer = setTimeout(() => { S.cache = {}; render(); const el = $('#st-in'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 700); }
      return;
    }
    if (t.dataset.hlevel || t.dataset.hown) {
      const name = t.dataset.hlevel || t.dataset.hown;
      const h = S.profile.heroes[name] || (S.profile.heroes[name] = { st: 0, sp: 0, sw: 0 });
      if (t.dataset.hlevel) {
        const parts = t.value.split('.');
        h.st = num(parts[0], 0); h.sp = num(parts[1], 0); h.own = true;
      } else {
        h.own = !t.checked;
        if (h.st === '' || h.st == null) { h.st = 0; h.sp = 0; }
      }
      if (h.sw == null) h.sw = 0;
      render(); scheduleSave();
      return;
    }
    if (t.dataset.bind) {
      setPath(S.profile, t.dataset.bind, t.value);
      if (/^heroes\./.test(t.dataset.bind)) {
        const h = S.profile.heroes[t.dataset.bind.split('.')[1]];
        if (h) {
          // setting the SW means the player owns the hero
          if (h.st === '' || h.st == null) { h.st = 0; h.sp = 0; }
          h.own = true;
        }
        render();
      }
      if (/^gear\..*\.q$/.test(t.dataset.bind)) t.parentNode.className = 'gear-cell q-' + t.value;
      if (t.dataset.bind === 'genManual') { S.cache = {}; render(); }
      scheduleSave();
    } else if (t.dataset.ebind) {
      setPath(S.enemy, t.dataset.ebind, t.value);
    } else if (t.dataset.rbind) {
      setPath(S.report, t.dataset.rbind, t.value);
    } else if (t.dataset.rcheck) {
      setPath(S.report, t.dataset.rcheck, t.checked);
    }
  });

  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'hero-search') {
      S.heroSearch = ev.target.value;
      clearTimeout(S.searchTimer);
      S.searchTimer = setTimeout(() => {
        render();
        const s = $('#hero-search');
        if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
      }, 250);
    }
  });

  // Report bonuses include the heroes' gear and special weapon stats: remove them to get the player's base bonuses.
  function filledBonus(b) { return TYPES.some((t) => ['atk', 'def', 'leth', 'hp'].some((k) => b[t][k] !== '' && b[t][k] != null)); }
  function predictInput(r) {
    const list = (o) => TYPES.map((t) => o[t]).filter(Boolean);
    return {
      type: r.type === 'solo' ? 'solo' : 'rally', role: r.role,
      myHeroes: list(r.my), enemyHeroes: list(r.en), myTotal: r.myTotal, enTotal: r.enTotal, myRatio: r.myRatio, enRatio: r.enRatio,
      myBonus: filledBonus(r.myBonus) ? r.myBonus : null, enBonus: filledBonus(r.enBonus) ? r.enBonus : null,
      myJoiners: r.myJoiners.filter(Boolean), enJoiners: r.enJoiners.filter(Boolean),
    };
  }
  function pctRatio(o) {
    const tot = TYPES.reduce((a, t) => a + num(o[t], 0), 0);
    const out = { inf: '', lan: '', mar: '' };
    if (tot > 0) TYPES.forEach((t) => { out[t] = String(Math.round(num(o[t], 0) * 100 / tot)); });
    return out;
  }
  function useReport(r) {
    // 1) my base bonuses (only for my own report)
    if (r.mine && filledBonus(r.myBonus)) {
      const side = r.role === 'defender' ? 'def' : (r.type === 'solo' ? 'solo' : 'rally');
      const base = WOS.reportToBase(account(), r.my, side, r.myBonus, r.buffs.my);
      TYPES.forEach((t) => Object.keys(base[t]).forEach((k) => { S.profile.bonus[t][k] = String(base[t][k]); }));
    }
    // 2) the enemy, as seen in the report, goes into the matching formation
    const key = r.type === 'solo' ? 'solo' : 'rally';
    const defending = r.role === 'defender';
    S.enemy[key] = {
      heroes: TYPES.map((t) => ({ n: r.en[t] || '' })), ratio: pctRatio(r.enRatio),
      bonus: JSON.parse(JSON.stringify(r.enBonus)), joiners: r.enJoiners.filter(Boolean),
    };
    if (key === 'rally') S.rallyMode = defending ? 'defense' : 'attack'; else S.soloMode = defending ? 'defense' : 'attack';
    S.ftab = key; S.fmode = 'mine'; S.view = 'form'; S.cache = {};
    if (r.mine && filledBonus(r.myBonus)) scheduleSave();
  }
  async function sendReport(btn, use) {
    const r = S.report;
    const pvp = true;
    if (pvp && !r.result) { toast(tx('Choose victory or defeat first')); return; }
    let prediction = null;
    if (pvp) { try { prediction = WOS.predict(account(), predictInput(r)); } catch (e) { prediction = null; } }
    const actual = pvp && num(r.myTotal, 0) && num(r.enTotal, 0)
      ? { myLeft: Math.round(num(r.mySurv, 0) * 100 / num(r.myTotal, 1)), enemyLeft: Math.round(num(r.enSurv, 0) * 100 / num(r.enTotal, 1)) } : null;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = tx('SENDING…');
    try {
      const payload = Object.assign({}, r, { role: r.role, garrison: r.type === 'rally' && r.role === 'defender', prediction, actual, profileGen: currentGen(), sentAt: new Date().toISOString() });
      const res = await api('report', { user: S.session.user, code: S.session.code, report: payload });
      if (!res.ok) throw new Error(res.error || 'error');
      S.lastPrediction = prediction
        ? tx('Report sent. The calculator expected you with {me}% of troops left and the enemy with {en}% (real: {rme}% and {ren}%).', { me: prediction.myLeft, en: prediction.enemyLeft, rme: actual ? actual.myLeft : '?', ren: actual ? actual.enemyLeft : '?' })
        : tx('Report sent. Thanks!');
      if (use && pvp) { useReport(r); S.report = blankReport(); render(); window.scrollTo(0, 0); toast(r.mine && filledBonus(r.myBonus) ? tx('Saved: your bonuses are updated and the enemy is loaded') : tx('Saved: the enemy is loaded')); return; }
      S.report = blankReport();
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = label;
      toast(tx('Not sent:') + ' ' + tx(e.message));
    }
  }

  /* ---------- boot ---------- */

  WOS.setDB(window.WOS_DB);
  document.documentElement.lang = LANG;
  render();
  try {
    const saved = JSON.parse(sessionStorage.getItem('wostop_session') || 'null');
    if (saved && saved.user) doLogin(saved.user, saved.code);
  } catch (e) { /* ignore */ }
  window.addEventListener('beforeunload', () => { if (S.saveState === 'Unsaved changes') saveNow(); });
})();

</script>
</body>
</html>
