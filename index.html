        ${col2("Troops", numIn("myTotal"), numIn("enTotal"))}${col2("Survivors", numIn("mySurv"), numIn("enSurv"))}
        <div class="small" style="border-top:1px solid #1E2A44;padding-top:8px">${tx(rally ? 'Troop level (rally average) · optional' : 'Troop level · optional')}</div>
        ${[['myTier', tx('You')], ['enTier', tx('Enemy')]].map(([b, l]) => `<div style="display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small" style="color:var(--soft)">${l}</div>${TYPES.map((t) => `<select class="in mini" style="color:var(--${t});padding-left:4px;padding-right:2px" data-rbind="${b}.${t}" aria-label="${l} ${TYPE_NAME[t]}"><option value="">${TYPE_NAME[t]}</option>${tierList().map((x) => `<option value="${x}"${r[b][t] === x ? ' selected' : ''}>${x}</option>`).join('')}</select>`).join('')}</div>`).join('')}
        <div class="small" style="border-top:1px solid #1E2A44;padding-top:8px">${tx('Troops per type (from "Troop Power Comparison") · optional')}</div>
        ${[['myRatio', tx('You')], ['enRatio', tx('Enemy')]].map(([b, l]) => `<div style="display:grid;grid-template-columns:84px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small" style="color:var(--soft)">${l}</div>${TYPES.map((t) => `<input class="in mini" style="color:var(--${t})" data-rbind="${b}.${t}" value="${esc(r[b][t])}" placeholder="${t}" inputmode="numeric">`).join('')}</div>`).join('')}
      </section>` : ''}
      ${rally ? `<section class="card warm"><div class="card-title" style="color:var(--gold)">${tx('First 4 joiners activated')}</div>
        ${rally ? headTE : ''}
        ${[0, 1, 2, 3].map((i) => `<div style="display:grid;grid-template-columns:20px minmax(0,1fr)${rally ? ' minmax(0,1fr)' : ''};gap:6px;align-items:center"><div class="rank">${i + 1}</div>${heroSelect(`data-rbind="myJoiners.${i}"`, null, r.myJoiners[i], '—')}${rally ? heroSelect(`data-rbind="enJoiners.${i}"`, null, r.enJoiners[i], '—') : ''}</div>`).join('')}
        <div class="small">${tx('Only the hero in the 1st slot of each joiner. The same hero can be picked more than once.')}</div></section>` : ''}
      <section class="card"><div class="card-title">${pvp ? '4' : '3'} · Stat Bonuses</div>
        <div class="small">${tx('Same order as the table at the bottom of the report.')}</div>
        ${pvp ? headTE.replace('84px', '96px').replace('84px', '96px') : ''}
        ${bonusRows.map(([t, k]) => `<div style="display:grid;grid-template-columns:96px minmax(0,1fr)${pvp ? ' minmax(0,1fr)' : ''};gap:6px;align-items:center"><div style="font-size:11px;font-weight:600;color:var(--${t})">${TYPE_NAME[t]} ${tx(statName[k]).toLowerCase()}</div><input class="in mini" data-rbind="myBonus.${t}.${k}" value="${esc(r.myBonus[t][k])}" inputmode="decimal" aria-label="${tx('You')} ${TYPE_NAME[t]} ${k}">${pvp ? `<input class="in mini" data-rbind="enBonus.${t}.${k}" value="${esc(r.enBonus[t][k])}" inputmode="decimal" aria-label="${tx('Enemy')} ${TYPE_NAME[t]} ${k}">` : ''}</div>`).join('')}
      </section>
      <section class="card"><div class="card-title">${pvp ? '5' : '4'} · ${tx('Active bonuses')}</div>
        <div class="small">${tx('From "Notes on Special Bonuses" (tap the ! next to Stat Bonuses). Bonuses bought with gems: 0, 10 or 20%.')}</div>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 96px${pvp ? ' 96px' : ''};gap:6px;font-size:10px;color:var(--muted)"><div></div><div style="text-align:center">${tx('YOU')}</div>${pvp ? `<div style="text-align:center">${tx('ENEMY')}</div>` : ''}</div>
        ${BUFFS.map((k) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 96px${pvp ? ' 96px' : ''};gap:6px;align-items:center;border-top:1px solid #1E2A44;padding-top:6px"><div class="small" style="color:var(--soft)">${tx(buffLabels[k])}</div>${seg('my', k)}${pvp ? seg('en', k) : ''}</div>`).join('')}
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 96px${pvp ? ' 96px' : ''};gap:6px;align-items:center;border-top:1px solid #1E2A44;padding-top:6px"><div class="small" style="color:var(--soft)">${tx('Pet skills active')}<br><span style="font-size:10px;color:var(--muted)">${tx('For "Save and use", prefer reports without pets')}</span></div><label class="nocheck"><input type="checkbox" data-rcheck="pets.my"${r.pets.my ? ' checked' : ''} aria-label="${tx('Pet skills active')} ${tx('You')}"></label>${pvp ? `<label class="nocheck"><input type="checkbox" data-rcheck="pets.en"${r.pets.en ? ' checked' : ''} aria-label="${tx('Pet skills active')} ${tx('Enemy')}"></label>` : ''}</div>
      </section>
      <section class="card">
        <div class="field"><label>${tx('NOTES')} · ${tx('optional')}</label><input class="in" data-rbind="notes" value="${esc(r.notes)}" maxlength="300"></div></section>
      <div style="display:grid;grid-template-columns:${pvp ? '1fr 1.4fr' : '1fr'};gap:8px">
        <button class="btn ghost" style="font-family:Rajdhani,sans-serif;font-weight:700;letter-spacing:.1em;font-size:15px" data-act="send-report" data-v="save">${tx('SAVE')}</button>
        ${pvp ? `<button class="btn" data-act="send-report" data-v="use">${tx('SAVE AND USE')}</button>` : ''}
      </div>
      <div class="small"><b>${tx('Save:')}</b> ${tx('sends the report to the shared sheet.')}${pvp ? ` <b>${tx('Save and use:')}</b> ${tx('also updates your profile bonuses (without the bonuses bought with gems) and prepares the formation against this enemy.')}` : ''}</div>
      ${S.lastPrediction ? `<section class="card blue"><div class="note">${esc(S.lastPrediction)}</div></section>` : ''}`;
  }

  /* ---------- render & events ---------- */

  // red strip on every screen for players with the base role (R5 and Super don't see it)
  function devBanner() {
    return leadRole() ? '' : `<div class="devbar" role="note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5"/><path d="M12 18h.01"/></svg><div>${tx('App in development: the suggestions you see may not be correct')}</div></div>`;
  }
  function render() {
    const app = $('#app');
    const prevModal = $('#modal');
    const modalTop = prevModal ? prevModal.scrollTop : 0;
    if (!S.session) { app.innerHTML = viewLogin(S.loginError); document.body.style.overflow = ''; return; }
    if (S.view === 'report' && !leadRole()) S.view = 'account';
    if (S.view === 'team' && !leadRole()) S.view = 'account';
    let body = '';
    if (S.view === 'account') body = viewAccount();
    else if (S.view === 'form') body = viewForm();
    else if (S.view === 'up') body = viewUp();
    else if (S.view === 'gen') body = viewGen();
    else if (S.view === 'team') body = viewTeam();
    else body = viewReport();
    app.innerHTML = `${devBanner()}${header()}<main>${body}</main>${bottomNav()}${S.modal === 'svs' ? svsModal() : ''}`;
    document.body.style.overflow = S.modal ? 'hidden' : '';
    const md = $('#modal');
    if (md && prevModal) md.scrollTop = modalTop;
    const hd = document.querySelector('header.top');
    if (hd) document.documentElement.style.setProperty('--hh', hd.offsetHeight + 'px');
    if (S.view === 'form') renderFormBody();
    if (S.view === 'up') renderUpBody();
    if (S.view === 'gen') renderGenBody();
    if (S.view === 'team') {
      const tab = S.leadTab || 'players';
      if (tab === 'players') loadTeam();
      else if (tab === 'requests' && !S.reqs && !S.reqLoading) { S.reqLoading = true; loadRequests().then(() => { S.reqLoading = false; }); }
      else if (tab === 'svs' && !S.svsAdm && !S.svsAdmLoading) { S.svsAdmLoading = true; loadSvsAdmin().then(() => { S.svsAdmLoading = false; }); }
    }
    if (S.modal === 'svs' && !S.svs && !S.svsLoading) { S.svsLoading = true; loadSvs().then(() => { S.svsLoading = false; }); }
  }

  async function doLogin(user, code) {
    const btn = $('#login-btn');
    if (btn) { btn.disabled = true; btn.textContent = tx('CHECKING…'); }
    try {
      const r = await api('login', { user, code });
      S.loginReason = '';
      if (r.pending) {
        const again = !!S.pending;
        S.pending = Object.assign({}, r.info || {}, { code, user: (r.info && r.info.user) || user });
        S.pendingNote = again ? 'Not accepted yet. Try again later.' : '';
        S.loginError = '';
        try { sessionStorage.removeItem('wostop_session'); } catch (e) { /* ignore */ }
        render(); return;
      }
      if (r.rejected) { S.pending = null; S.loginError = 'Your request was rejected. You can send it again from Create profile, with the same name and ID.'; S.loginReason = r.reason || ''; render(); return; }
      if (!r.ok) { S.loginError = r.error || 'Invalid username or code'; render(); return; }
      S.pending = null;
      S.session = { user, code, state: r.state || '', alliance: r.alliance || '', role: r.role || 'user', stateOpen: r.stateOpen || '', rules: r.rules || null,
        playerId: r.playerId || '', requests: r.requests || 0, svs: r.svs || null };
      S.profile = mergeProfile(r.profile);
      S.loginError = '';
      try { sessionStorage.setItem('wostop_session', JSON.stringify({ user, code })); } catch (e) { /* ignore */ }
      render();
    } catch (e) {
      S.loginError = 'Connection error, try again.'; render();
    }
  }

  document.addEventListener('submit', (ev) => {
    if (ev.target.id === 'login-form') {
      ev.preventDefault();
      doLogin($('#lu').value.trim(), $('#lc').value.trim());
    } else if (ev.target.id === 'reg-form') {
      ev.preventDefault();
      sendRegister();
    } else if (ev.target.id === 'wl-form') {
      ev.preventDefault();
      sendWaitlist();
    }
  });

  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const v = el.dataset.v;
    if (el.tagName === 'A') ev.preventDefault();
    if (act === 'nav') { S.view = v; window.scrollTo(0, 0); render(); }
    else if (act === 'auth-tab') { S.authTab = v; S.loginError = ''; S.loginReason = ''; S.regError = ''; render(); }
    else if (act === 'reg-back') { S.regNotBeta = false; S.wlDone = false; S.regError = ''; render(); }
    else if (act === 'pending-retry') { const p = S.pending; if (p) doLogin(p.user, p.code); }
    else if (act === 'pending-back') { S.pending = null; S.pendingNote = ''; S.authTab = 'login'; render(); }
    else if (act === 'svs-open') { S.modal = 'svs'; S.svs = null; S.svsEdit = false; S.svsError = ''; render(); }
    else if (act === 'modal-close') { S.modal = null; render(); }
    else if (act === 'svs-edit') { S.svsEdit = true; render(); }
    else if (act === 'svs-edit-close') { S.svsEdit = false; S.svsForm = blankSvsForm(S.svs && S.svs.mine); render(); }
    else if (act === 'svs-day') { const d = S.svsForm[v]; d.on = !d.on; S.svsError = ''; render(); }
    else if (act === 'svs-slot') {
      const [d, sl] = v.split('.'); const list = S.svsForm[d].slots; const i = list.indexOf(num(sl, -1));
      if (i >= 0) list.splice(i, 1); else list.push(num(sl, -1));
      S.svsError = ''; render();
    } else if (act === 'svs-all') { const [d, on] = v.split('.'); S.svsForm[d].slots = on === '1' ? Array.from({ length: 48 }, (_, i) => i) : []; render(); }
    else if (act === 'svs-save') { saveSvs(el); }
    else if (act === 'svs-tday') { const [g, d] = v.split('.'); S.svsDay[g] = d; render(); }
    else if (act === 'svs-group') {
      const [g, d, n] = v.split('.'); const set = S.svsGroups[g + '.' + d] || (S.svsGroups[g + '.' + d] = new Set());
      if (set.has(num(n, 0))) set.delete(num(n, 0)); else set.add(num(n, 0));
      render();
    } else if (act === 'lead-tab') { S.leadTab = v; if (v === 'requests') S.reqs = null; window.scrollTo(0, 0); render(); }
    else if (act === 'req-refresh') { S.reqs = null; render(); }
    else if (act === 'req-decide') { decideRequest(el); }
    else if (act === 'svs-list') { S.svsListOpen = !S.svsListOpen; render(); }
    else if (act === 'svs-settings') {
      const val = (id) => (($('#' + id) || {}).value || '').trim();
      svsAdminCall('svsSettings', { settings: { svs: val('sv-svs'), construction: val('sv-construction'), tech: val('sv-tech'), troops: val('sv-troops'), open: val('sv-open') === '1' } }, tx('Settings saved'), el);
    } else if (act === 'svs-generate') { S.svsPins = blankPins(); svsGenerate(); S.svsGroups = {}; render(); }
    else if (act === 'svs-reload') { if (!S.svsPins) S.svsPins = blankPins(); svsGenerate(); render(); flash(true, tx('Table recalculated')); }
    else if (act === 'svs-unout') { const o = S.svsPins[v].out; const i = o.indexOf(el.dataset.u); if (i >= 0) o.splice(i, 1); svsGenerate(); render(); }
    else if (act === 'svs-publish') { if (S.svsGen) svsAdminCall('svsPublish', { table: genTable() }, tx('Table published'), el); }
    else if (act === 'sub') { S.sub = v; render(); }
    else if (act === 'logout') {
      clearTimeout(S.saveTimer); await saveNow();
      S.session = null; S.profile = null; S.cache = {}; S.team = null; S.teamAlly = ''; S.rulesDraft = null; S.capOpen = null; S.capPage = 0; S.view = 'account'; S.sub = 'profile';
      S.modal = null; S.svs = null; S.svsAdm = null; S.svsGen = null; S.svsPins = null; S.reqs = null; S.leadTab = 'players'; S.authTab = 'login'; S.loginError = '';
      try { sessionStorage.removeItem('wostop_session'); } catch (e) { /* ignore */ }
      render();
    } else if (act === 'spend') { S.profile.spend = v; scheduleSave(); render(); }
    else if (act === 'role') {
      const i = S.profile.roles.indexOf(v);
      if (i >= 0) S.profile.roles.splice(i, 1); else S.profile.roles.push(v);
      scheduleSave(); render();
    } else if (act === 'hfilter') { S.heroFilter = v; render(); }
    else if (act === 'ftab') { S.ftab = v; render(); }
    else if (act === 'fmode') { S.fmode = v; render(); }
    else if (act === 'bmode') { if (S.ftab === 'rally') S.rallyMode = v; else S.soloMode = v; render(); }
    else if (act === 'joe') { S.joeMode = v; render(); }
    else if (act === 'enemy-clear') { S.enemy[v] = blankEnemy(); render(); }
    else if (act === 'recalc') { render(); }
    else if (act === 'refine') { const c = $('#enemy-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (act === 'rtype') { S.report.type = v; prefillTiers(true); render(); }
    else if (act === 'rrole') { S.report.role = v; render(); }
    else if (act === 'rres') { S.report.result = v; render(); }
    else if (act === 'send-report') { sendReport(el, v === 'use'); }
    else if (act === 'rbuff') { const [sd, k, val] = v.split('.'); S.report.buffs[sd][k] = num(val, 0); render(); }
    else if (act === 'team-refresh') { S.team = null; S.rulesDraft = null; render(); }
    else if (act === 'team-ally') { S.teamAlly = v; S.capPage = 0; S.capOpen = null; paintTeam(); }
    else if (act === 'team-scope') { S.teamScope = v; S.capPage = 0; S.capOpen = null; render(); }
    else if (act === 'helios-toggle') { S.heliosOpen = !S.heliosOpen; paintTeam(); }
    else if (act === 'cap-page') { S.capPage = num(v, 0); S.capOpen = null; paintTeam(); }
    else if (act === 'cap-open') { S.capOpen = S.capOpen === v ? null : v; paintTeam(); }
    else if (act === 'cap-mode') { S.capMode = v; paintTeam(); }
    else if (act === 'rule-rm') { const [k, i] = v.split('.'); S.rulesDraft[k].joiners.splice(num(i, 0), 1); paintTeam(); }
    else if (act === 'rules-save') { saveRules(el); }
    else if (act === 'team-csv') { exportTeam(); }
    else if (act === 'save') { clearTimeout(S.saveTimer); await saveNow(); toast(S.saveState === 'Saved' ? tx('Saved: formations and upgrades now use these data') : saveLabel()); }
  });

  document.addEventListener('change', (ev) => {
    if (ev.target.dataset && 'lang' in ev.target.dataset) {
      LANG = ev.target.value;
      try { localStorage.setItem('wostop_lang', LANG); } catch (e) { /* ignore */ }
      document.documentElement.lang = LANG;
      render();
      return;
    }
    const t = ev.target;
    if (t.dataset.svsf) { const [d, k] = t.dataset.svsf.split('.'); S.svsForm[d][k] = t.value.replace(/[^0-9]/g, ''); return; }
    if (t.dataset.svspin) {
      const [d, sl] = t.dataset.svspin.split('.'); const pins = S.svsPins[d];
      Object.keys(pins.slots).forEach((k) => { if (t.value && pins.slots[k] === t.value) delete pins.slots[k]; });
      pins.slots[sl] = t.value;
      const oi = pins.out.indexOf(t.value); if (oi >= 0) pins.out.splice(oi, 1);
      return;
    }
    if (t.dataset.svsmove) {
      const d = t.dataset.svsmove; const u = t.dataset.u; const pins = S.svsPins[d];
      Object.keys(pins.slots).forEach((k) => { if (pins.slots[k] === u) delete pins.slots[k]; });
      const oi = pins.out.indexOf(u); if (oi >= 0) pins.out.splice(oi, 1);
      if (t.value === 'out') pins.out.push(u); else if (t.value !== '') pins.slots[t.value] = u;
      return;
    }
    if (t.dataset.ruleAdd) {
      if (t.value && S.rulesDraft) S.rulesDraft[t.dataset.ruleAdd].joiners.push(t.value);
      paintTeam();
      return;
    }
    if (t.dataset.rule) { if (S.rulesDraft) setPath(S.rulesDraft, t.dataset.rule, t.value.replace(/[^0-9]/g, '')); return; }
    if (t.dataset.sbind) {
      S.session[t.dataset.sbind] = t.value.trim().slice(0, t.dataset.sbind === 'alliance' ? 12 : 10);
      scheduleSave();
      const hdr = document.querySelector('header.top');
      if (hdr) hdr.outerHTML = header();
      if (t.dataset.sbind === 'state') { clearTimeout(S.stTimer); S.stTimer = setTimeout(() => { S.cache = {}; render(); const el = $('#st-in'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 700); }
      return;
    }
    if (t.dataset.hlevel || t.dataset.hown) {
      const name = t.dataset.hlevel || t.dataset.hown;
      const h = S.profile.heroes[name] || (S.profile.heroes[name] = { st: 0, sp: 0, sw: 0 });
      if (t.dataset.hlevel) {
        const parts = t.value.split('.');
        h.st = num(parts[0], 0); h.sp = num(parts[1], 0); h.own = true;
      } else {
        h.own = !t.checked;
        if (h.st === '' || h.st == null) { h.st = 0; h.sp = 0; }
      }
      if (h.sw == null) h.sw = 0;
      render(); scheduleSave();
      return;
    }
    if (t.dataset.bind) {
      setPath(S.profile, t.dataset.bind, t.value);
      if (/^heroes\./.test(t.dataset.bind)) {
        const h = S.profile.heroes[t.dataset.bind.split('.')[1]];
        if (h) {
          // setting the SW means the player owns the hero
          if (h.st === '' || h.st == null) { h.st = 0; h.sp = 0; }
          h.own = true;
        }
        render();
      }
      if (/^gear\..*\.q$/.test(t.dataset.bind)) t.parentNode.className = 'gear-cell q-' + t.value;
      if (t.dataset.bind === 'genManual') { S.cache = {}; render(); }
      scheduleSave();
    } else if (t.dataset.ebind) {
      setPath(S.enemy, t.dataset.ebind, t.value);
    } else if (t.dataset.rbind) {
      setPath(S.report, t.dataset.rbind, t.value);
    } else if (t.dataset.rcheck) {
      setPath(S.report, t.dataset.rcheck, t.checked);
    }
  });

  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && S.modal) { S.modal = null; render(); } });

  document.addEventListener('input', (ev) => {
    if (ev.target.dataset && ev.target.dataset.reg) { S.reg[ev.target.dataset.reg] = ev.target.value; return; }
    if (ev.target.dataset && ev.target.dataset.svsf) { const [d, k] = ev.target.dataset.svsf.split('.'); S.svsForm[d][k] = ev.target.value.replace(/[^0-9]/g, ''); return; }
    if (ev.target.id === 'hero-search') {
      S.heroSearch = ev.target.value;
      clearTimeout(S.searchTimer);
      S.searchTimer = setTimeout(() => {
        render();
        const s = $('#hero-search');
        if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
      }, 250);
    }
  });

  // Report bonuses include the heroes' gear and special weapon stats: remove them to get the player's base bonuses.
  function filledBonus(b) { return TYPES.some((t) => ['atk', 'def', 'leth', 'hp'].some((k) => b[t][k] !== '' && b[t][k] != null)); }
  function predictInput(r) {
    const list = (o) => TYPES.map((t) => o[t]).filter(Boolean);
    return {
      type: r.type === 'solo' ? 'solo' : 'rally', role: r.role,
      myHeroes: list(r.my), enemyHeroes: list(r.en), myTotal: r.myTotal, enTotal: r.enTotal, myRatio: r.myRatio, enRatio: r.enRatio,
      myBonus: filledBonus(r.myBonus) ? r.myBonus : null, enBonus: filledBonus(r.enBonus) ? r.enBonus : null,
      myJoiners: r.myJoiners.filter(Boolean), enJoiners: r.enJoiners.filter(Boolean),
      myTier: r.myTier, enTier: r.enTier,
    };
  }
  function pctRatio(o) {
    const tot = TYPES.reduce((a, t) => a + num(o[t], 0), 0);
    const out = { inf: '', lan: '', mar: '' };
    if (tot > 0) TYPES.forEach((t) => { out[t] = String(Math.round(num(o[t], 0) * 100 / tot)); });
    return out;
  }
  function useReport(r) {
    // 1) my base bonuses (only for my own report)
    if (r.mine && filledBonus(r.myBonus)) {
      const side = r.role === 'defender' ? (r.type === 'solo' ? 'soloDef' : 'def') : (r.type === 'solo' ? 'solo' : 'rally');
      const base = WOS.reportToBase(account(), r.my, side, r.myBonus, r.buffs.my);
      TYPES.forEach((t) => Object.keys(base[t]).forEach((k) => { S.profile.bonus[t][k] = String(base[t][k]); }));
    }
    // 2) the enemy, as seen in the report, goes into the matching formation
    const key = r.type === 'solo' ? 'solo' : 'rally';
    const defending = r.role === 'defender';
    S.enemy[key] = {
      heroes: TYPES.map((t) => ({ n: r.en[t] || '' })), ratio: pctRatio(r.enRatio),
      bonus: JSON.parse(JSON.stringify(r.enBonus)), joiners: r.enJoiners.filter(Boolean),
    };
    if (key === 'rally') S.rallyMode = defending ? 'defense' : 'attack'; else S.soloMode = defending ? 'defense' : 'attack';
    S.ftab = key; S.fmode = 'mine'; S.view = 'form'; S.cache = {};
    if (r.mine && filledBonus(r.myBonus)) scheduleSave();
  }
  async function sendReport(btn, use) {
    const r = S.report;
    const pvp = true;
    if (pvp && !r.result) {
      flash(false, tx('Choose victory or defeat first'));
      const el = document.getElementById('r-result');
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('need'); setTimeout(() => el.classList.remove('need'), 2500); }
      return;
    }
    let prediction = null;
    if (pvp) { try { prediction = WOS.predict(account(), predictInput(r)); } catch (e) { prediction = null; } }
    const actual = pvp && num(r.myTotal, 0) && num(r.enTotal, 0)
      ? { myLeft: Math.round(num(r.mySurv, 0) * 100 / num(r.myTotal, 1)), enemyLeft: Math.round(num(r.enSurv, 0) * 100 / num(r.enTotal, 1)) } : null;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = tx('SENDING…');
    try {
      const payload = Object.assign({}, r, { role: r.role, garrison: r.type === 'rally' && r.role === 'defender', prediction, actual, profileGen: currentGen(), sentAt: new Date().toISOString() });
      const res = await api('report', { user: S.session.user, code: S.session.code, report: payload });
      if (!res.ok) throw new Error(res.error || 'error');
      S.lastPrediction = prediction
        ? tx('Report sent. The calculator expected you with {me}% of troops left and the enemy with {en}% (real: {rme}% and {ren}%).', { me: prediction.myLeft, en: prediction.enemyLeft, rme: actual ? actual.myLeft : '?', ren: actual ? actual.enemyLeft : '?' })
        : tx('Report sent. Thanks!');
      // keep the form filled for the next report in the same conditions; only the outcome is cleared
      r.result = ''; r.mySurv = ''; r.enSurv = '';
      if (use && pvp) { useReport(r); render(); window.scrollTo(0, 0); flash(true, r.mine && filledBonus(r.myBonus) ? tx('Saved: your bonuses are updated and the enemy is loaded') : tx('Saved: the enemy is loaded')); return; }
      // keep the form filled: the next report in the same conditions only needs the changed fields
      btn.disabled = false; btn.textContent = label;
      render();
      flash(true, tx('Saved. Result and survivors are cleared, the rest stays for the next report.'));
    } catch (e) {
      btn.disabled = false; btn.textContent = label;
      flash(false, tx('Not sent:') + ' ' + tx(e.message));
    }
  }

  /* ---------- registration ---------- */

  function deviceToken() {
    try {
      let t = localStorage.getItem('wostop_dev');
      if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('wostop_dev', t); }

  function authTabs(on) {

  function registerForm() {

      return `<form id="wl-form" style="display:flex;flex-direction:column;gap:12px">

        <div class="field"><label for="wl-mail">EMAIL</label><input id="wl-mail" class="in big" type="email" autocomplete="email" data-reg="email" value="${esc(S.reg.email || '')}" required></div>
        <input id="wl-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-5000px;width:1px;height:1px;opacity:0">
        ${S.regError ? `<div class="err" role="alert">${esc(tx(S.regError))}</div>` : ''}
        <button class="btn" type="submit" id="wl-btn">${tx('SEND')}</button>
        <div class="small">${tx('We use your email only to tell you when the app opens to your state. Nobody else sees it.')}</div>
        <button class="btn ghost" type="button" data-act="reg-back">${tx('Back')}</button>

    }
    return `<form id="reg-form" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <div class="note">${tx('Create your profile. You can log in as soon as an R5 of your alliance or the admin accepts it.')}</div>
      ${regField('rn', 'name', 'NAME (AS IN GAME)', 'autocomplete="username" maxlength="30" placeholder="' + esc(tx('e.g. Teo')) + '"', 'It becomes your username to log in.')}
      ${regField('ri', 'playerId', 'PLAYER ID', 'inputmode="numeric" maxlength="12" placeholder="' + esc(tx('Chief profile › ID')) + '"')}
      <div class="grid2">${regField('rs', 'state', 'STATE', 'inputmode="numeric" maxlength="6" placeholder="2598"')}${regField('ra', 'alliance', 'ALLIANCE', 'maxlength="4" placeholder="TMA" style="text-transform:uppercase"')}</div>
      <div class="grid2">${regField('rc1', 'code', 'ACCESS CODE', 'masked autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" placeholder="' + esc(tx('min. 8 characters')) + '"')}${regField('rc2', 'code2', 'REPEAT CODE', 'masked autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60"')}</div>
      <input id="reg-hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-5000px;width:1px;height:1px;opacity:0">
      <div class="small">${tx('Choose a code only you know, not one you use elsewhere. Nobody can recover it: if you lose it, the admin gives you a new one.')}</div>
      ${S.regError ? `<div class="err" role="alert">${esc(tx(S.regError))}</div>` : ''}
      <button class="btn" type="submit" id="reg-btn">${tx('SEND REQUEST')}</button>
    </form>`;
  }
  function viewPending() {
    const p = S.pending;
    const rows = [['Name', p.user], ['Player ID', p.playerId], ['State', p.state], ['Alliance', p.alliance ? '[' + p.alliance + ']' : '']]
      .map(([k, v]) => `<div class="row" style="justify-content:space-between;border-top:1px solid #1E2A44;padding-top:8px;font-size:14px"><span style="color:var(--muted)">${tx(k)}</span><b>${esc(v)}</b></div>`).join('');
    return `${header()}<main class="login">
      <div class="card warm" style="align-items:center;text-align:center;padding:20px 16px">
        <div style="width:64px;height:64px;border-radius:50%;background:#2A1B0A;border:2px solid var(--ember);display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FCD34D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
        <div class="h-font" style="font-size:24px">${tx('PROFILE WAITING')}</div>

      </div>
      <div class="card"><div class="card-title">${tx('Your data')}</div>${rows}
        <div class="row" style="justify-content:space-between;border-top:1px solid #1E2A44;padding-top:8px;font-size:14px"><span style="color:var(--muted)">${tx('Request')}</span><b style="color:var(--gold)">${tx('Waiting')}</b></div></div>
      ${S.pendingNote ? `<div class="small" role="status">${esc(tx(S.pendingNote))}</div>` : ''}
      <button class="btn" data-act="pending-retry" style="background:var(--card);color:var(--text);border:1px solid var(--line2);font-family:Inter,sans-serif;font-size:15px;letter-spacing:0">${tx('Try to log in again')}</button>
      <button class="btn ghost" data-act="pending-back">${tx('Back')}</button>
    </main>`;
  }
  async function sendRegister() {
    const g = S.reg;
    S.regError = '';
    if (String($('#reg-hp') && $('#reg-hp').value || '')) { S.regError = ''; }
    const name = String(g.name || '').trim();
    if (name.length < 2) S.regError = 'Write your in-game name';
    else if (!/^\d{6,12}$/.test(String(g.playerId || '').trim())) S.regError = 'Player ID must be 6 to 12 digits';
    else if (!/^\d{1,6}$/.test(String(g.state || '').trim())) S.regError = 'Write your state';
    else if (!/^[A-Za-z0-9]{2,4}$/.test(String(g.alliance || '').trim())) S.regError = 'Alliance tag: 2 to 4 letters or numbers';
    else if (String(g.code || '').trim().length < 8) S.regError = 'Access code: at least 8 characters';
    else if (String(g.code || '').trim() !== String(g.code2 || '').trim()) S.regError = 'The two codes are different';
    if (S.regError) { render(); return; }
    const btn = $('#reg-btn');
    if (btn) { btn.disabled = true; btn.textContent = tx('SENDING…'); }
    try {
      const r = await api('register', { name, playerId: String(g.playerId).trim(), state: String(g.state).trim(), alliance: String(g.alliance).trim().toUpperCase(),
        code: String(g.code).trim(), hp: ($('#reg-hp') || {}).value || '', dev: deviceToken() });
      if (r.notBeta) { S.regNotBeta = true; S.wlDone = false; }
      else if (r.ok && r.pending) { S.pending = Object.assign({}, r.info || { user: name, playerId: g.playerId, state: g.state, alliance: g.alliance }, { code: String(g.code).trim() }); S.pendingNote = ''; S.reg = {}; }
      else S.regError = r.error || 'error';
    } catch (e) { S.regError = 'Connection error, try again.'; }
    render();
  }
  async function sendWaitlist() {
    const g = S.reg;
    S.regError = '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(g.email || '').trim())) { S.regError = 'Write a valid email'; render(); return; }
    const btn = $('#wl-btn');
    if (btn) { btn.disabled = true; btn.textContent = tx('SENDING…'); }
    try {
      const r = await api('waitlist', { email: String(g.email).trim(), name: String(g.name || '').trim(), playerId: String(g.playerId || '').trim(),
        state: String(g.state || '').trim(), alliance: String(g.alliance || '').trim().toUpperCase(), hp: ($('#wl-hp') || {}).value || '' });
      if (r.ok) S.wlDone = true; else S.regError = r.error || 'error';
    } catch (e) { S.regError = 'Connection error, try again.'; }
    render();
  }

  /* ---------- SvS prep ---------- */

  const SVS_DAYS = [['construction', 'Construction'], ['tech', 'Tech'], ['troops', 'Troops']];
  const SVS_FIELDS = {
    construction: [['fc', 'Fire Crystal'], ['rfc', 'Refined Fire Crystal'], ['speed', 'Speedup days']],
    tech: [['fcs', 'Fire Crystal Shards'], ['speed', 'Speedup days']],
    troops: [['speed', 'Speedup days']],
  };
  const slotT = (i) => `${String(Math.floor(i / 2)).padStart(2, '0')}:${i % 2 ? '30' : '00'}`;
  function dayLabel(d) {
    if (!d) return '—';
    const t = new Date(d + 'T00:00:00Z');
    if (isNaN(t)) return d;
    try { return t.toLocaleDateString(LANG, { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }); } catch (e) { return d; }
  }
  function localTime(day, s) {
    if (!day) return '';
    const t = new Date(day + 'T00:00:00Z');
    if (isNaN(t)) return '';
    t.setUTCMinutes(s * 30);
    try { return t.toLocaleTimeString(LANG, { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  }
  // 12:00–14:00, 19:30 (end = start of the last slot + 30 minutes)
  function slotRanges(slots) {
    const s = Array.from(new Set(slots)).sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < s.length; i++) {
      let j = i;
      while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
      out.push(j === i ? slotT(s[i]) : `${slotT(s[i])}–${s[j] + 1 === 48 ? '24:00' : slotT(s[j] + 1)}`);
      i = j;
    }
    return out.join(', ');
  }
  function svsSettings() { return (S.svs && S.svs.settings) || (S.session && S.session.svs) || null; }
  function svsCard() {
    const st = svsSettings();
    const pub = st && st.published;
    const badge = !st || !st.svs ? '' : (pub ? `<span class="badge-ok" style="color:var(--ice)">${tx('TABLE')}</span>` : (st.open ? `<span class="badge-ok" style="color:var(--ok)">${tx('OPEN')}</span>` : `<span class="badge-ok" style="color:var(--muted)">${tx('CLOSED')}</span>`));
    const sub = !st || !st.svs ? tx('No date yet: the Super of your state sets it')
      : (pub ? tx('Table published · SvS {d}', { d: dayLabel(st.svs) }) : (st.open ? tx('Sign up for the preparation days · SvS {d}', { d: dayLabel(st.svs) }) : tx('Registrations closed · SvS {d}', { d: dayLabel(st.svs) })));
    return `<button class="card warm" data-act="svs-open" style="flex-direction:row;align-items:center;gap:12px;text-align:left;cursor:pointer;border-color:var(--ember);color:var(--text);width:100%">
      <div style="width:44px;height:44px;border-radius:12px;background:var(--ember);display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1206" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg></div>
      <div style="flex:1;min-width:0"><div class="h-font" style="font-size:19px;color:var(--gold)">SVS PREP</div><div class="small" style="color:var(--soft)">${sub}</div></div>${badge}</button>`;
  }
  function blankSvsForm(mine) {
    const f = {};
    SVS_DAYS.forEach(([d]) => {
      const m = (mine || {})[d];
      f[d] = { on: !!(m && m.slots && m.slots.length), slots: m ? m.slots.slice() : [], fc: m ? m.fc : '', rfc: m ? m.rfc : '', fcs: m ? m.fcs : '', speed: m ? m.speed : '' };
    });
    return f;
  }
  async function loadSvs() {
    try {
      const r = await api('svs', { user: S.session.user, code: S.session.code });
      if (!r.ok) throw new Error(r.error || 'error');
      S.svs = r; S.svsForm = blankSvsForm(r.mine);
      if (r.settings) S.session.svs = r.settings;
    } catch (e) { S.svs = { error: e.message }; }
    if (S.modal === 'svs') render();
  }
  function svsTableHtml(table, settings, dayKey, me, groupsKey) {
    const rows = ((table && table.days) || {})[dayKey] || [];
    const by = {};
    rows.forEach((x) => { by[x.s] = x; });
    const meLow = String(me || '').toLowerCase();
    const mine = rows.find((x) => String(x.n).toLowerCase() === meLow);
    const dayDate = settings ? settings[dayKey] : '';
    let html = `<div class="seg" style="grid-template-columns:repeat(3,1fr)">${SVS_DAYS.map(([k, l]) => `<button class="${dayKey === k ? 'on' : ''}" data-act="svs-tday" data-v="${groupsKey}.${k}" style="line-height:1.25">${l}<br><span style="font-size:10px;font-weight:500">${esc(dayLabel(settings ? settings[k] : ''))}</span></button>`).join('')}</div>`;
    if (mine) html += `<div class="card warm" style="padding:10px 12px"><div class="note" style="color:var(--gold);font-weight:600">${tx('Your turn: {t} UTC ({l} your time)', { t: slotT(mine.s), l: localTime(dayDate, mine.s) })}</div></div>`;
    if (!rows.length) html += `<div class="card"><div class="note">${tx('Nobody in this day.')}</div></div>`;
    const openSet = S.svsGroups[groupsKey + '.' + dayKey] || (S.svsGroups[groupsKey + '.' + dayKey] = new Set([mine ? Math.floor(mine.s / 12) : (rows.length ? Math.floor(Math.min(...rows.map((x) => x.s)) / 12) : 0)]));
    for (let g = 0; g < 4 && rows.length; g++) {
      const open = openSet.has(g);
      const filled = rows.filter((x) => x.s >= g * 12 && x.s < g * 12 + 12).length;
      let body = '';
      if (open) {
        for (let s = g * 12; s < g * 12 + 12; s++) {
          const x = by[s];
          const isMe = x && String(x.n).toLowerCase() === meLow;
          body += `<div class="list-row" style="grid-template-columns:52px 52px minmax(0,1fr);${isMe ? 'background:#2A1B0A;border-color:var(--ember)' : ''}"><div class="num" style="text-align:left;color:${isMe ? 'var(--gold)' : 'var(--ice)'}">${slotT(s)}</div><div class="small">${x && x.a ? '[' + esc(x.a) + ']' : ''}</div><div style="font-size:14px;font-weight:600">${x ? esc(x.n) + (isMe ? ` <span class="tag" style="color:var(--gold);margin-left:4px">${tx('YOU')}</span>` : '') : `<span style="color:#4A5B7C">${tx('free')}</span>`}</div></div>`;
        }
      }
      html += `<div class="card${open ? ' blue' : ''}" style="gap:6px"><button class="card-head" data-act="svs-group" data-v="${groupsKey}.${dayKey}.${g}" aria-expanded="${open}" style="width:100%;background:none;border:0;padding:0;cursor:pointer;color:var(--text)"><span class="card-title">${slotT(g * 12)} – ${slotT(g * 12 + 11)}</span><span class="row"><span class="small">${tx('{n}/12 assigned', { n: filled })}</span><span style="color:var(--ice);font-size:16px">${open ? '▾' : '▸'}</span></span></button>${body}</div>`;
    }
    return html;
  }
  function svsFormHtml(st, closed) {
    const f = S.svsForm;
    const pill = (k, l) => {
      const on = f[k].on;
      return `<button class="pill${on ? ' on' : ''}" data-act="svs-day" data-v="${k}" aria-pressed="${on}" ${closed ? 'disabled' : ''} style="display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;padding:10px 4px;${on ? 'border-color:var(--ember);background:#2A1B0A;color:var(--gold)' : ''}"><span class="h-font" style="font-size:15px">${on ? '✓ ' : ''}${l}</span><span style="font-size:10px;color:var(--muted)">${esc(dayLabel(st[k]))}</span></button>`;
    };
    let html = `<div class="label">${tx('Which days do you need to sign up for?')}</div><div class="grid3">${SVS_DAYS.map(([k, l]) => pill(k, l)).join('')}</div>`;
    SVS_DAYS.forEach(([k, l]) => {
      const d = f[k];
      if (!d.on) return;
      const fields = SVS_FIELDS[k].map(([fk, fl]) => `<div class="field"><label for="svf-${k}-${fk}">${tx(fl).toUpperCase()}</label><input id="svf-${k}-${fk}" class="in" inputmode="numeric" data-svsf="${k}.${fk}" value="${esc(d[fk] || '')}" ${closed ? 'disabled' : ''}></div>`).join('');
      let grid = '';
      for (let g = 0; g < 4; g++) {
        let cells = '';
        for (let s = g * 12; s < g * 12 + 12; s++) {
          const on = d.slots.indexOf(s) >= 0;
          cells += `<button class="slot${on ? ' on' : ''}" data-act="svs-slot" data-v="${k}.${s}" aria-pressed="${on}" ${closed ? 'disabled' : ''}>${slotT(s)}</button>`;
        }
        grid += `<div class="label" style="margin-top:2px">${slotT(g * 12)} – ${slotT(g * 12 + 11)}</div><div class="slots">${cells}</div>`;
      }
      html += `<div class="card"><div class="card-head"><div class="card-title" style="color:var(--gold)">${l}</div><div class="small">${esc(dayLabel(st[k]))} · UTC</div></div>
        <div class="grid2">${fields}</div>
        <div class="card-head"><div class="label">${tx('Available times (UTC)')}</div><div style="font-size:12px;font-weight:600;color:var(--ice)">${tx('{n} selected', { n: d.slots.length })}</div></div>
        ${grid}
        ${closed ? '' : `<div class="grid2"><button class="pill" data-act="svs-all" data-v="${k}.1">${tx('All')}</button><button class="pill" data-act="svs-all" data-v="${k}.0">${tx('None')}</button></div>`}</div>`;
    });
    if (!closed) html += `${S.svsError ? `<div class="err" role="alert">${esc(tx(S.svsError))}</div>` : ''}<button class="btn" data-act="svs-save" id="svs-save">${tx('SAVE REGISTRATION')}</button><div class="small" style="text-align:center">${tx('You can change it while registrations are open.')}</div>`;
    return html;
  }
  function svsModal() {
    let body;
    const s = S.svs;
    if (!s) body = `<div class="loading">${tx('Loading…')}</div>`;
    else if (s.error) body = `<div class="card red"><div class="note">${tx('Not loaded:')} ${esc(tx(s.error))}</div></div>`;
    else if (!s.settings || !s.settings.svs) body = `<div class="card"><div class="note">${tx('No SvS prep yet. The Super of your state sets the dates.')}</div></div>`;
    else {
      const st = s.settings;
      const info = `<div class="card blue" style="display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px">
        <span style="color:var(--muted)">${tx('Next SvS')}</span><b>${esc(dayLabel(st.svs))}</b>
        ${SVS_DAYS.map(([k, l]) => `<span style="color:var(--muted)">${l}</span><b>${esc(dayLabel(st[k]))}</b>`).join('')}
        <div class="small" style="grid-column:1/-1;border-top:1px solid #23406B;padding-top:6px">${tx('Times are game time (UTC). The more times you choose, the easier it is to find you a place.')}</div></div>`;
      if (s.table && !S.svsEdit) {
        body = svsTableHtml(s.table, st, S.svsDay.player || 'construction', S.session.user, 'player')
          + (st.open ? `<button class="btn ghost" data-act="svs-edit">${tx('Change my registration')}</button>` : '');
      } else if (!st.open) {
        const has = Object.keys(s.mine || {}).length;
        body = info + `<div class="card"><div class="note">${tx('Registrations are closed.')}${has ? ' ' + tx('This is what you sent:') : ''}</div></div>` + (has ? svsFormHtml(st, true) : '');
      } else {
        body = info + (Object.keys(s.mine || {}).length ? `<div class="card" style="padding:10px 12px;border-color:#2F6B46"><div class="note" style="color:var(--ok)">${tx('Registration saved. You can still change it.')}</div></div>` : '') + svsFormHtml(st, false)
          + (s.table ? `<button class="btn ghost" data-act="svs-edit-close">${tx('Back to the table')}</button>` : '');
      }
    }
    return `<div class="modal-wrap" id="modal" role="dialog" aria-modal="true" aria-label="SVS PREP"><div class="modal">
      <div class="card-head"><div><div class="h-font" style="font-size:24px;color:var(--ember)">SVS PREP</div>${s && s.table && !S.svsEdit ? `<div class="small">${tx('Published table · times UTC')}</div>` : ''}</div><button class="chip chip-btn icon-btn" data-act="modal-close" aria-label="${tx('Close')}" style="width:40px;height:40px;font-size:18px">✕</button></div>
      ${body}</div></div>`;
  }
  async function saveSvs(btn) {
    const f = S.svsForm;
    const days = {};
    S.svsError = '';
    const on = SVS_DAYS.filter(([k]) => f[k].on);
    if (!on.length) S.svsError = 'Choose at least one day';
    else if (on.some(([k]) => !f[k].slots.length)) S.svsError = 'Choose at least one time for each day';
    if (S.svsError) { render(); return; }
    SVS_DAYS.forEach(([k]) => { if (f[k].on) days[k] = { slots: f[k].slots.slice().sort((a, b) => a - b), fc: f[k].fc, rfc: f[k].rfc, fcs: f[k].fcs, speed: f[k].speed }; });
    if (btn) { btn.disabled = true; btn.textContent = tx('SAVING…'); }
    try {
      const r = await api('svsSignup', { user: S.session.user, code: S.session.code, days });
      if (!r.ok) throw new Error(r.error || 'error');
      S.svs = r; S.svsForm = blankSvsForm(r.mine); S.svsEdit = false;
      render(); flash(true, tx('Registration saved'));
    } catch (e) { render(); flash(false, tx('Not saved:') + ' ' + tx(e.message)); }
  }

  /* ---------- Leader: requests and SvS (Super) ---------- */

  function leadTabs() {
    const l = leadRoles();
    const n = S.session.requests || 0;
    const tabs = [['players', tx('Players')], ['requests', tx('Requests') + (n ? ` <b style="color:var(--ember)">${n}</b>` : '')]];
    if (l.sup) tabs.push(['svs', 'SVS PREP']);
    return `<div class="tabs" style="grid-template-columns:repeat(${tabs.length},1fr)">${tabs.map(([k, lb]) => `<button class="${(S.leadTab || 'players') === k ? 'on' : ''}" data-act="lead-tab" data-v="${k}">${lb}</button>`).join('')}</div>`;
  }
  function viewRequests() {
    const l = leadRoles();
    const intro = `<div><div class="h-font" style="font-size:24px">${tx('Access requests')}</div><div class="small">${l.sup ? tx('Requests of your whole state.') : tx('Requests with alliance [{a}].', { a: esc(S.session.alliance) })}</div></div>
      <div class="note">${tx('Check in game that name and ID match before accepting. Whoever you accept joins as User.')}</div>`;
    if (!S.reqs) return intro + `<div id="req-body"><div class="loading">${tx('Loading…')}</div></div>`;
    if (S.reqs.error) return intro + `<div class="card red"><div class="note">${tx('Not loaded:')} ${esc(tx(S.reqs.error))}</div></div>`;
    const list = S.reqs.list;
    const cards = list.map((q, i) => `<div class="card"><div class="card-head"><div class="h-font" style="font-size:18px">[${esc(q.alliance)}] ${esc(q.user)}</div><div class="small">${q.at ? esc(new Date(q.at).toLocaleString(LANG, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) : ''}</div></div>
      <div class="small" style="color:var(--soft)">${tx('ID {id} · State {s}', { id: esc(q.playerId), s: esc(q.state) })}</div>
      ${q.again ? `<div class="card warm" style="padding:7px 10px"><div class="small" style="color:var(--gold)">${tx('Sent again after a rejection')}</div></div>` : ''}
      <input class="in" id="rr-${i}" maxlength="200" placeholder="${esc(tx('Reason if you reject (optional)'))}">
      <div class="grid2"><button class="btn" data-act="req-decide" data-v="no" data-i="${i}" style="background:transparent;color:var(--bad);border:1px solid #5A2A33;font-family:Inter,sans-serif;font-size:14px;letter-spacing:0">${tx('Reject')}</button><button class="btn" data-act="req-decide" data-v="yes" data-i="${i}" style="background:#16A34A;color:#fff;font-family:Inter,sans-serif;font-size:14px;letter-spacing:0">${tx('Accept')}</button></div></div>`).join('');
    return intro + (cards || `<div class="card"><div class="note">${tx('No requests waiting.')}</div></div>`) + `<button class="chip chip-btn" data-act="req-refresh" style="align-self:flex-end">${tx('Refresh')}</button>`;
  }
  async function loadRequests() {
    try {
      const r = await api('requests', { user: S.session.user, code: S.session.code });
      if (!r.ok) throw new Error(r.error || 'error');
      S.reqs = { list: r.requests || [] }; S.session.requests = S.reqs.list.length;
    } catch (e) { S.reqs = { error: e.message }; }
    if (S.view === 'team' && S.leadTab === 'requests') render();
  }
  async function decideRequest(el) {
    const q = S.reqs && S.reqs.list[num(el.dataset.i, -1)];
    if (!q) return;
    const accept = el.dataset.v === 'yes';
    const reason = (($('#rr-' + el.dataset.i) || {}).value || '').trim();
    el.disabled = true;
    try {
      const r = await api('decide', { user: S.session.user, code: S.session.code, target: q.user, accept, reason });
      if (r.requests) { S.reqs = { list: r.requests }; S.session.requests = r.requests.length; }
      if (!r.ok) throw new Error(r.error || 'error');
      render(); flash(true, accept ? tx('{u} accepted', { u: q.user }) : tx('{u} rejected', { u: q.user }));
    } catch (e) { render(); flash(false, tx(e.message)); }
  }

  function svsScore(x) { return num(x.speed, 0) + (num(x.fc, 0) + num(x.rfc, 0) * 10 + num(x.fcs, 0) / 10) / 1e7; }
  function svsResText(x, day) {
    const parts = [];
    if (day === 'construction') { if (x.fc) parts.push('FC ' + Number(x.fc).toLocaleString(LANG)); if (x.rfc) parts.push('RFC ' + Number(x.rfc).toLocaleString(LANG)); }
    if (day === 'tech' && x.fcs) parts.push('FCS ' + Number(x.fcs).toLocaleString(LANG));
    parts.push(tx('{n} days', { n: x.speed || 0 }));
    return parts.join(' · ');
  }
  function blankPins() { const o = {}; SVS_DAYS.forEach(([d]) => { o[d] = { slots: {}, out: [] }; }); return o; }
  function svsGenerate() {
    const ups = (S.svsAdm && S.svsAdm.signups) || [];
    const res = {};
    SVS_DAYS.forEach(([d]) => {
      const ps = ups.filter((x) => x.day === d).map((x) => ({ id: x.user, slots: x.slots, score: svsScore(x), a: x.alliance, x }));
      const r = WOS.svsAssign(ps, S.svsPins[d]);
      res[d] = { players: ps, bySlot: r.bySlot, out: r.out, forced: (S.svsPins[d].out || []).slice() };
    });
    S.svsGen = res;
  }
  function genTable() {
    const days = {}; const out = {};
    SVS_DAYS.forEach(([d]) => {
      const g = S.svsGen[d];
      const byId = {}; g.players.forEach((p) => { byId[p.id] = p; });
      days[d] = []; g.bySlot.forEach((id, s) => { if (id) days[d].push({ s, n: id, a: (byId[id] || {}).a || '' }); });
      out[d] = g.out.slice();
    });
    return { days, out };
  }
  function conflictCards() {
    let html = '';
    SVS_DAYS.forEach(([d, l]) => {
      const g = S.svsGen[d];
      const byId = {}; g.players.forEach((p) => { byId[p.id] = p; });
      const slotOpts = (cur) => `<option value="">${tx('— not assigned —')}</option>` + Array.from({ length: 48 }, (_, s) => `<option value="${s}"${cur === s ? ' selected' : ''}>${slotT(s)}${g.bySlot[s] ? ' · ' + esc(g.bySlot[s]) : ''}</option>`).join('') + `<option value="out">${tx('Leave out')}</option>`;
      g.out.filter((id) => g.forced.indexOf(id) < 0).forEach((id) => {
        const p = byId[id];
        const rows = p.slots.slice(0, 8).map((s) => {
          const cands = g.players.filter((q) => q.slots.indexOf(s) >= 0).map((q) => q.id);
          const cur = g.bySlot[s] || '';
          return `<div class="row" style="gap:8px"><div class="num" style="width:52px;text-align:left;color:var(--ice)">${slotT(s)}</div><select class="in" data-svspin="${d}.${s}" aria-label="${slotT(s)}"><option value=""${cur ? '' : ' selected'}>${tx('free')}</option>${cands.map((c) => `<option value="${esc(c)}"${c === cur ? ' selected' : ''}>[${esc((byId[c] || {}).a || '')}] ${esc(c)} · ${esc(svsResText(byId[c].x, d))}</option>`).join('')}</select></div>`;
        }).join('');
        html += `<div class="card red"><div class="card-head"><div class="card-title" style="color:var(--bad)">${l} · ${esc(id)}</div><span class="tag" style="color:var(--bad)">${tx('CONFLICT')}</span></div>
          <div style="background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px">
            <div class="card-head"><div class="jname">[${esc(p.a)}] ${esc(id)}</div><div class="small">${esc(svsResText(p.x, d))}</div></div>
            <div class="small" style="color:var(--soft)">${tx('Available:')} <b style="color:var(--ice)">${esc(slotRanges(p.slots))}</b></div>
            <select class="in" data-svsmove="${d}" data-u="${esc(id)}" aria-label="${tx('Time for {u}', { u: esc(id) })}">${slotOpts(-1)}</select></div>
          <div class="small">${tx('Who is in the times {u} chose:', { u: esc(id) })}</div>${rows}</div>`;
      });
    });
    return html;
  }
  function viewSvsAdmin() {
    const a = S.svsAdm;
    const intro = `<div><div class="h-font" style="font-size:24px">SVS PREP</div><div class="small">${tx('Only you (Super) see this page. It applies to the whole state.')}</div></div>`;
    if (!a) return intro + `<div class="loading">${tx('Loading…')}</div>`;
    if (a.error) return intro + `<div class="card red"><div class="note">${tx('Not loaded:')} ${esc(tx(a.error))}</div></div>`;
    const st = a.settings || {};
    const dateIn = (id, label, v) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="in" type="date" value="${esc(v || '')}" style="color-scheme:dark"></div>`;
    let html = intro + `<div class="card"><div class="card-title">1 · ${tx('Settings')}</div>
      ${dateIn('sv-svs', tx('NEXT SVS DATE'), st.svs)}
      <div class="grid2">${dateIn('sv-construction', 'CONSTRUCTION', st.construction)}${dateIn('sv-tech', 'TECH', st.tech)}${dateIn('sv-troops', 'TROOPS', st.troops)}
        <div class="field"><label for="sv-open">${tx('REGISTRATIONS')}</label><select id="sv-open" class="in"><option value="1"${st.open ? ' selected' : ''}>${tx('Open')}</option><option value="0"${st.open ? '' : ' selected'}>${tx('Closed')}</option></select></div></div>
      <button class="btn ghost" data-act="svs-settings">${tx('Save settings')}</button>
      <div class="small">${tx('These dates appear in everyone\'s SVS PREP popup. A new SvS date starts a new list of registrations.')}${st.publishedAt ? ' ' + tx('Table published on {d}.', { d: esc(new Date(st.publishedAt).toLocaleString(LANG, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) }) : ''}</div></div>`;
    if (!st.svs) return html;
    const ups = a.signups || [];
    const count = (d) => new Set(ups.filter((x) => x.day === d).map((x) => x.user)).size;
    const stat = (n, l, c) => `<div style="background:var(--bg2);border:1px solid #1E2A44;border-radius:10px;padding:10px;text-align:center"><div class="h-font" style="font-size:24px;color:${c || 'var(--text)'}">${n}</div><div class="small">${l}</div></div>`;
    let list = '';
    if (S.svsListOpen) {
      SVS_DAYS.forEach(([d, l]) => {
        const rows = ups.filter((x) => x.day === d).sort((x, y) => x.user.localeCompare(y.user));
        if (!rows.length) return;
        list += `<div class="label" style="margin-top:4px">${l}</div>` + rows.map((x) => `<div style="background:var(--bg2);border:1px solid #1E2A44;border-radius:10px;padding:8px 10px"><div class="card-head"><span class="jname">[${esc(x.alliance)}] ${esc(x.user)}</span><span class="small">${esc(svsResText(x, d))}</span></div><div class="small" style="color:var(--ice)">${esc(slotRanges(x.slots))}</div></div>`).join('');
      });
    }
    html += `<div class="card"><div class="card-title">2 · ${tx('Registrations')}</div>
      <div class="grid3">${SVS_DAYS.map(([d, l]) => stat(count(d), l)).join('')}</div>
      <button class="chip chip-btn" data-act="svs-list" style="align-self:flex-start">${S.svsListOpen ? tx('Hide list') : tx('Show list with resources and times')}</button>${list}
      <button class="btn" data-act="svs-generate">${tx('GENERATE TABLE')}</button>
      <div class="small">${tx('One player per 30-minute slot. Players with fewer free times go first; with the same times, whoever brings more speedups.')}</div></div>`;
    if (S.svsGen) {
      let placed = 0; let conf = 0; let forced = 0;
      SVS_DAYS.forEach(([d]) => { const g = S.svsGen[d]; placed += g.bySlot.filter(Boolean).length; forced += g.forced.length; conf += g.out.length - g.forced.length; });
      const outList = SVS_DAYS.map(([d, l]) => S.svsGen[d].forced.map((id) => `<div class="row" style="justify-content:space-between"><span class="small">${l} · ${esc(id)}</span><button class="chip chip-btn" data-act="svs-unout" data-v="${d}" data-u="${esc(id)}">${tx('Put back')}</button></div>`).join('')).join('');
      html += `<div class="card"><div class="card-title">3 · ${tx('Result')}</div>
        <div class="grid3">${stat(placed, tx('Assigned'), 'var(--ok)')}${stat(conf, tx('Conflicts'), 'var(--bad)')}${stat(forced, tx('Left out'), 'var(--gold)')}</div>
        <div class="note">${conf ? tx('Change name or time in the conflicts, then <b>Reload</b> to recalculate.') : tx('Everyone has a place.')}</div>${outList}</div>
        ${conflictCards()}
        <div class="grid2"><button class="btn" data-act="svs-reload" style="background:var(--card);color:var(--text);border:1px solid var(--line2)">${tx('RELOAD')}</button><button class="btn" data-act="svs-publish" style="background:#16A34A;color:#fff">${tx('PUBLISH')}</button></div>
        <div class="small">${tx('You can publish with open conflicts too: whoever is left out does not appear in the table.')}</div>
        <div class="card-title" style="margin-top:6px">${tx('Preview')}</div>
        ${svsTableHtml(genTable(), st, S.svsDay.admin || 'construction', '', 'admin')}`;
    } else if (a.table) {
      html += `<div class="card-title" style="margin-top:6px">${tx('Published table')}</div>${svsTableHtml(a.table, st, S.svsDay.pub || 'construction', '', 'pub')}`;
    }
    return html;
  }
  async function loadSvsAdmin() {
    try {
      const r = await api('svsAll', { user: S.session.user, code: S.session.code });
      if (!r.ok) throw new Error(r.error || 'error');
      S.svsAdm = r; if (r.settings) S.session.svs = r.settings;
    } catch (e) { S.svsAdm = { error: e.message }; }
    if (S.view === 'team' && S.leadTab === 'svs') render();
  }
  async function svsAdminCall(action, payload, okMsg, btn) {
    if (btn) btn.disabled = true;
    try {
      const r = await api(action, Object.assign({ user: S.session.user, code: S.session.code }, payload));
      if (!r.ok) throw new Error(r.error || 'error');
      S.svsAdm = r; if (r.settings) S.session.svs = r.settings;
      S.svs = null;
      render(); flash(true, okMsg);
    } catch (e) { if (btn) btn.disabled = false; flash(false, tx('Not saved:') + ' ' + tx(e.message)); }
  }

  /* ---------- boot ---------- */

  WOS.setDB(window.WOS_DB);
  document.documentElement.lang = LANG;
  render();
  try {
    const saved = JSON.parse(sessionStorage.getItem('wostop_session') || 'null');
    if (saved && saved.user) doLogin(saved.user, saved.code);
  } catch (e) { /* ignore */ }
  window.addEventListener('beforeunload', () => { if (S.saveState === 'Unsaved changes') saveNow(); });
})();

</script>
</body>
</html>
