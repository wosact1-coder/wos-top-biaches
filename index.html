    return a && (!m || m === a.gen) ? a.nextIn : NaN;
  }
  function tierRank(t) { const m = /T(\d+)(?: FC(\d+))?/.exec(t) || []; return num(m[1], 0) * 100 + num(m[2], 0); }
  function heroLabel(h) { return `${h.g ? 'G' + h.g : (h.r === 'E' ? 'Epic' : 'Rare')} - ${h.n}`; }
  function heroOptions(list) { return list.slice().sort((a, b) => (b.g - a.g) || a.n.localeCompare(b.n)).map((h) => [h.n, heroLabel(h)]); }

  function header() {
    const sub = S.session ? `${esc(S.session.user)}${S.session.state ? ' · State ' + esc(S.session.state) : ''}${S.session.alliance ? ' [' + esc(S.session.alliance) + ']' : ''}` : 'Formation Lab';
    return `<header class="top"><div class="brand"><div class="logo-sm">${logoSvg(36)}</div><div style="min-width:0"><div class="brand-name">WOS-TOP <span>BIACHES</span></div><div class="brand-sub">${sub}</div></div></div>
      <div class="row"><span class="chip">EN</span>${S.session ? '<button class="chip chip-btn" data-act="logout">Log out</button>' : ''}</div></header>`;
  }
  function bottomNav() {
    const items = [['account', 'Account', ICON.account], ['form', 'Formations', ICON.form], ['up', 'Upgrades', ICON.up], ['gen', 'Next Gen', ICON.gen], ['report', 'Report', ICON.report]];
    return `<nav class="bottom" aria-label="Main">${items.map(([k, l, i]) => `<button class="${S.view === k ? 'on' : ''}" data-act="nav" data-v="${k}">${i}${l}</button>`).join('')}</nav>`;
  }

  /* ---------- login ---------- */

  function viewLogin(err) {
    return `${header()}<main class="login">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px">
        <div style="width:150px;height:150px;border-radius:50%;background:#0F1A30;border:4px solid var(--ice);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--ember);overflow:hidden;display:flex;align-items:center;justify-content:center">${logoSvg(140)}</div>
        <div class="h-font" style="font-size:36px;line-height:1">WOS-TOP</div>
        <div class="h-font" style="font-size:28px;line-height:1;color:var(--ember);letter-spacing:.24em">BIACHES</div>
        <div class="small">Formation Lab · unofficial fan tool</div>
      </div>
      <form id="login-form" style="display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="lu">USERNAME</label><input id="lu" class="in big" autocomplete="username" required></div>
        <div class="field"><label for="lc">ACCESS CODE</label><input id="lc" class="in big" type="password" autocomplete="current-password" required></div>
        ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ''}
        <button class="btn" type="submit" id="login-btn">LOG IN</button>
        <div class="small" style="text-align:center">Invite only. Lost your code? Ask whoever gave you access.</div>
        ${DEMO ? `<div class="card blue"><div class="note"><b>Demo mode:</b> not connected to the shared sheet yet. Any username and code work, data stays in this browser.${storageOk() ? '' : ' <b>This browser view blocks storage: your data is kept until you close or reload the page.</b>'}</div></div>` : ''}
      </form>
      <div class="small" style="margin-top:auto">No real names, emails or personal data. Only game data is stored.</div>
    </main>`;
  }

  /* ---------- account ---------- */

  function viewAccount() {
    const tabs = [['profile', 'Profile'], ['heroes', 'Heroes'], ['gear', 'Gear']];
    const body = S.sub === 'heroes' ? accHeroes() : (S.sub === 'gear' ? accGear() : accProfile());
    const n = Object.keys(account().heroes).length;
    const start = n === 0 ? `<div class="card warm"><div class="note"><b>Start here:</b> set your current Gen in Profile, then add your heroes in Heroes (stars, step, SW). Formations and upgrades use what you save here.</div></div>` : '';
    return `<div class="seg" style="grid-template-columns:repeat(3,1fr)">${tabs.map(([k, l]) => `<button class="${S.sub === k ? 'on' : ''}" data-act="sub" data-v="${k}">${l}</button>`).join('')}</div>
      ${start}${body}
      <div class="savebar"><div class="small" style="min-width:0"><div id="save-state">${esc(S.saveState || 'All changes are saved automatically')}</div><div>Gen ${currentGen()} · ${n} hero${n === 1 ? '' : 'es'} in use</div></div><button class="btn" style="padding:10px 18px;font-size:14px" data-act="save">SAVE</button></div>`;
  }

  function sel(bind, options, value, extra) {
    return `<select class="in ${extra || ''}" data-bind="${bind}">${options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(value) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  }
  function inp(bind, value, attrs) {
    return `<input class="in" data-bind="${bind}" value="${esc(value)}" ${attrs || 'inputmode="numeric"'}>`;
  }

  function accProfile() {
    const p = S.profile;
    const tiers = Object.keys(WOS.db.troops.inf).sort((a, b) => tierRank(b) - tierRank(a));
    const ag = autoGen();
    const gens = [['', ag ? `Auto · Gen ${ag.gen}` : 'Choose your Gen']].concat(Array.from({ length: MAX_GEN }, (_, i) => [MAX_GEN - i, 'Gen ' + (MAX_GEN - i)]));
    return `
    <section class="card"><div class="card-title">Player</div>
      <div class="field"><label>USERNAME</label><div class="in" style="opacity:.7">${esc(S.session.user)}</div></div>
      <div class="grid2"><div class="field"><label for="st-in">STATE</label><input id="st-in" class="in" data-sbind="state" value="${esc(S.session.state)}" inputmode="numeric"></div>
      <div class="field"><label for="al-in">ALLIANCE</label><input id="al-in" class="in" data-sbind="alliance" value="${esc(S.session.alliance)}" maxlength="12"></div></div>
    </section>
    <section class="card"><div class="card-title">Generation</div>
      <div class="grid2"><div class="field"><label>CURRENT GEN</label>${sel('genManual', gens, p.genManual == null ? '' : p.genManual)}</div>
      <div class="field"><label>NEXT GEN IN</label><div class="in" style="opacity:.8">${Number.isFinite(daysToNext()) ? daysToNext() + ' days' : '—'}</div></div></div>
      <div class="small">${ag
        ? (ag.src === 'open' ? `Auto: calculated from the opening date of state ${esc(S.session.state)}.` : `Auto: estimated from the transfer schedule for state ${esc(S.session.state)}${ag.src === 'table-near' ? ' (state not listed: taken from the nearest states)' : ''}.`) + ' If it\'s wrong, pick your Gen by hand.'
        : (S.session.state ? `State ${esc(S.session.state)} isn't in the schedule: pick your Gen by hand.` : 'Enter your state above to get the Gen automatically, or pick it by hand.')}${currentGen() > 17 ? ' Heroes after Gen 17 aren\'t in the database yet.' : ''}</div>
    </section>
    <section class="card"><div class="card-title">Spending</div>
      <div class="grid4">${SPEND.map(([k, l]) => `<button class="pill ${p.spend === k ? 'on' : ''}" data-act="spend" data-v="${k}">${l}</button>`).join('')}</div>
    </section>
    <section class="card"><div class="card-head"><div class="card-title">What you do in game</div><div class="small">Pick all that apply</div></div>
      <div class="pills">${ROLES.map(([k, l]) => `<button class="pill ${p.roles.indexOf(k) >= 0 ? 'on' : ''}" data-act="role" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="small">Decides which heroes the upgrade advice focuses on.</div>
    </section>
    <section class="card"><div class="card-title">Troops</div>
      ${TYPES.map((t) => `<div style="display:grid;grid-template-columns:30px minmax(0,1fr) 96px 104px;gap:8px;align-items:center">${ticon(t)}<div style="font-size:14px;font-weight:500">${TYPE_NAME[t]}</div>
        ${sel(`troops.${t}.tier`, tiers.map((x) => [x, x]), p.troops[t].tier)}${inp(`troops.${t}.count`, p.troops[t].count, 'inputmode="numeric" placeholder="count"')}</div>`).join('')}
      <div class="grid2"><div class="field"><label>MARCH CAPACITY</label>${inp('march', p.march, 'inputmode="numeric" placeholder="e.g. 150000"')}</div>
      <div class="field"><label>RALLY CAPACITY</label>${inp('rally', p.rally, 'inputmode="numeric" placeholder="e.g. 900000"')}</div></div>
    </section>
    <section class="card"><div class="card-head"><div class="card-title">Bonus %</div><div class="small">optional · improves accuracy</div></div>
      <div style="display:grid;grid-template-columns:72px repeat(4,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center"><div></div><div>Attack</div><div>Defense</div><div>Lethality</div><div>Health</div></div>
      ${TYPES.map((t) => `<div style="display:grid;grid-template-columns:72px repeat(4,minmax(0,1fr));gap:6px;align-items:center"><div style="font-size:12px;font-weight:600;color:var(--${t})">${TYPE_NAME[t]}</div>
        ${['atk', 'def', 'leth', 'hp'].map((k) => `<input class="in mini" data-bind="bonus.${t}.${k}" value="${esc(p.bonus[t][k])}" inputmode="decimal" aria-label="${TYPE_NAME[t]} ${k}">`).join('')}</div>`).join('')}
      <div class="small">Copy them from the bonus details of one of your battle reports. Empty = average for your Gen.</div>
    </section>`;
  }

  function heroList() {
    const gen = currentGen();
    let list = WOS.db.heroes.filter((h) => (h.r !== 'L' || h.g <= gen));
    if (S.heroFilter !== 'all') list = list.filter((h) => (S.heroFilter === 'joiner' ? WOS.joinerPool(gen, 'att').concat(WOS.joinerPool(gen, 'def')).indexOf(h.n) >= 0 : h.t === S.heroFilter));
    if (S.heroSearch) list = list.filter((h) => h.n.toLowerCase().indexOf(S.heroSearch.toLowerCase()) >= 0);
    const owned = (h) => isOwned(S.profile.heroes[h.n]);
    return list.sort((a, b) => (owned(b) - owned(a)) || (b.g - a.g) || a.n.localeCompare(b.n));
  }
  function joinerTag(h) {
    if (!h.sk.length) return '';
    const c = h.sk[0].c;
    if (['dmg', 'atk', 'leth', 'edef', 'etaken'].indexOf(c) >= 0 && h.sk[0].to === 'all') return 'ATTACK JOINER';
    if (['red', 'hp', 'def', 'eatk', 'eleth'].indexOf(c) >= 0 && h.sk[0].to === 'all') return 'DEFENSE JOINER';
    return '';
  }
  function accHeroes() {
    const levels = [];
    for (let st = 5; st >= 0; st--) {
      for (let sp = (st === 5 ? 0 : 5); sp >= 0; sp--) levels.push([`${st}.${sp}`, levelLabel(st, sp)]);
    }
    const sws = Array.from({ length: 11 }, (_, i) => [10 - i, 'Lv ' + (10 - i)]);
    const rows = heroList().map((h) => {
      const v = S.profile.heroes[h.n];
      const own = isOwned(v);
      const tag = joinerTag(h);
      return `<div class="hero-row ${own ? 'owned' : 'not-owned'}"><div class="hero-name">${ticon(h.t)}<div style="min-width:0"><div class="row" style="gap:6px"><div style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.n)}</div><span class="gen">${h.g ? 'G' + h.g : (h.r === 'E' ? 'Epic' : 'Rare')}</span></div>${tag ? `<div class="jtag">${tag}</div>` : ''}</div></div>
        <select class="in mini" data-hlevel="${esc(h.n)}" aria-label="${esc(h.n)} stars">${levels.map(([val, l]) => `<option value="${val}"${levelValue(v) === val ? ' selected' : ''}>${l}</option>`).join('')}</select>
        ${h.sw && h.r === 'L' ? sel(`heroes.${h.n}.sw`, sws, (v && v.sw) || 0, 'mini') : '<div class="small" style="text-align:center">—</div>'}
        <label class="nocheck" title="Not owned"><input type="checkbox" data-hown="${esc(h.n)}"${own ? '' : ' checked'} aria-label="${esc(h.n)} not owned"></label></div>`;
    }).join('');
    const filters = [['all', 'All'], ['inf', 'Infantry'], ['lan', 'Lancers'], ['mar', 'Marksmen'], ['joiner', 'Joiners']];
    return `<div class="row"><input class="in" id="hero-search" placeholder="Search hero" value="${esc(S.heroSearch)}" aria-label="Search hero"></div>
      <div class="pills">${filters.map(([k, l]) => `<button class="pill ${S.heroFilter === k ? 'on' : ''}" data-act="hfilter" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="card blue"><div class="note">For each hero: <b>stars</b> (left = stars, right = step, e.g. 3/4) and <b>special weapon</b> level. Tick <b>Not owned</b> for heroes you don't have: they're never used in formations, but can be suggested to unlock. Choosing stars or SW unticks it. From 4★ skills count as max; joiners always count as max.</div></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 70px 64px 52px;gap:6px;padding:0 8px" class="small"><div>HERO</div><div style="text-align:center">STARS</div><div style="text-align:center">SW</div><div style="text-align:center">NOT OWNED</div></div>
      ${rows || '<div class="loading">No heroes match.</div>'}`;
  }

  function accGear() {
    const q = [['L', 'Legend.'], ['M', 'Mythic'], ['E', 'Epic'], ['R', 'Rare']];
    return `<div class="note">Enter your <b>2 best sets per troop type</b>: for each piece the quality, enhancement (+0–100) and mastery level (Lv 0–20) shown on its icon. <b>Who wears them is decided by the calculator</b> for each event. Legendary empowerment bonuses (+20/+60/+100) are applied automatically.</div>
      ${TYPES.map((t) => `<section class="card"><div class="row">${ticon(t)}<div class="card-title">${TYPE_NAME[t]}</div></div>
        <div class="gear-grid small" style="text-align:center"><div></div>${WOS.PIECES.map((pc) => `<div>${PIECE_NAME[pc]}</div>`).join('')}</div>
        ${['A', 'B'].map((k) => `<div class="gear-grid"><div style="display:flex;align-items:center;font-size:12px;font-weight:700;color:${k === 'A' ? 'var(--gold)' : 'var(--soft)'}">Set ${k}</div>
          ${S.profile.gear[t][k].map((pc, i) => `<div class="gear-cell q-${esc(pc.q)}">
            <select data-bind="gear.${t}.${k}.${i}.q" aria-label="quality">${q.map(([v, l]) => `<option value="${v}"${pc.q === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
            <input data-bind="gear.${t}.${k}.${i}.p" value="${esc(pc.p)}" placeholder="+" inputmode="numeric" aria-label="enhancement">
            <input data-bind="gear.${t}.${k}.${i}.lv" value="${esc(pc.lv)}" placeholder="Lv" inputmode="numeric" aria-label="mastery level"></div>`).join('')}</div>`).join('')}
      </section>`).join('')}`;
  }

  /* ---------- formations ---------- */

  function viewForm() {
    const tabs = [['rally', 'Rally'], ['solo', 'Solo'], ['bear', 'Bear'], ['joe', 'Joe'], ['canyon', 'Canyon'], ['arena', 'Arena']];
    const gen = currentGen();
    return `<div class="tabs" style="grid-template-columns:repeat(6,1fr)">${tabs.map(([k, l]) => `<button class="${S.ftab === k ? 'on' : ''}" data-act="ftab" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${S.fmode === 'mine' ? 'on' : ''}" data-act="fmode" data-v="mine">My account</button><button class="${S.fmode === 'meta' ? 'on' : ''}" data-act="fmode" data-v="meta">Gen ${gen} meta</button></div>
      ${S.fmode === 'meta' ? `<div class="card warm"><div class="note"><b>This is not your account.</b> It's the Gen ${gen} meta: every hero available in Gen ${gen} at 5★ and SW 10, with max gear, using your troops and bonuses. Switch to <b>My account</b> for your own formation.</div></div>` : ''}
      <div id="form-body"><div class="loading">Calculating…</div></div>`;
  }

  function renderFormBody() {
    const el = $('#form-body');
    if (!el) return;
    setTimeout(() => {
      try { el.innerHTML = formBody(); } catch (e) { el.innerHTML = `<div class="card red"><div class="note">Calculation error: ${esc(e.message)}</div></div>`; }
    }, 20);
  }

  function noHeroes() {
    return '<div class="card"><div class="note">Add your heroes in <b>Account › Heroes</b> to get formations.</div></div>';
  }

  function metaGap(kind) {
    if (S.fmode !== 'mine') return '';
    const mine = cached('gap-mine-' + kind, () => kind === 'bear' ? WOS.optimizeBear(account()) : WOS.optimizeBattle(account(), { mode: 'attack', kind: 'rally' }));
    const meta = cached('gap-meta-' + kind, () => kind === 'bear' ? WOS.optimizeBear(WOS.metaAccount(account())) : WOS.optimizeBattle(WOS.metaAccount(account()), { mode: 'attack', kind: 'rally' }));
    if (!mine || !meta) return '';
    const a = kind === 'bear' ? mine.damage : mine.power;
    const b = kind === 'bear' ? meta.damage : meta.power;
    const gap = a > 0 ? Math.round((b / a - 1) * 100) : 0;
    return gap > 0 ? `<div class="small">The Gen ${currentGen()} meta would be about <b>+${gap}%</b> stronger here. <a href="#" data-act="nav" data-v="up">What you're missing</a></div>` : '';
  }

  function enemyForm(key) {
    const e = S.enemy[key];
    const opts = (t) => [['', `${TYPE_NAME[t]} hero`]].concat(heroOptions(WOS.db.heroes.filter((h) => h.t === t && h.sk.length)));
    const st = [5, 4, 3, 2, 1, 0].map((x) => [x, x + '★']);
    return `<section class="card red" id="enemy-card"><div class="card-head"><div class="card-title" style="color:var(--bad)">Enemy <span class="small" style="text-transform:none">· optional</span></div><button class="chip chip-btn" data-act="enemy-clear" data-v="${key}">Clear</button></div>
      ${TYPES.map((t, i) => `<div style="display:grid;grid-template-columns:6px minmax(0,1fr) 70px;gap:8px;align-items:center"><div style="width:6px;height:28px;border-radius:3px;background:var(--${t})"></div>
        <select class="in" data-ebind="${key}.heroes.${i}.n">${opts(t).map(([v, l]) => `<option value="${esc(v)}"${e.heroes[i].n === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
        <select class="in" data-ebind="${key}.heroes.${i}.st">${st.map(([v, l]) => `<option value="${v}"${String(e.heroes[i].st) === String(v) ? ' selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}
      <div style="display:grid;grid-template-columns:50px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small">Ratio %</div>
        ${TYPES.map((t) => `<input class="in mini" style="color:var(--${t})" data-ebind="${key}.ratio.${t}" value="${esc(e.ratio[t])}" placeholder="${t === 'inf' ? 'inf' : t === 'lan' ? 'lan' : 'mar'}" inputmode="numeric">`).join('')}</div>
      <div class="small">Add the enemy's heroes and ratio to adapt the formation to them. Leave empty for your best formation in general.</div>
      <button class="btn" data-act="recalc">CALCULATE</button></section>`;
  }

  function battleCard(res, kind, mode, key) {
    if (!res) return noHeroes();
    const who = S.fmode === 'meta' ? 'Meta' : 'Your';
    const enemyTxt = res.enemyGiven ? (S.fmode === 'meta' ? 'Meta vs this enemy' : 'Against this enemy') : (mode === 'attack' ? who + ' best attack' : who + ' best defense');
    const out = res.result;
    const verdict = res.enemyGiven ? (out.win ? `<span class="badge-ok" style="color:var(--ok)">Likely win · ${Math.round(out.remA * 100)}% left</span>` : `<span class="badge-ok" style="color:var(--bad)">Likely loss</span>`) : '';
    return `<section class="card"><div class="card-head"><div class="card-title">${enemyTxt}</div>${verdict || '<button class="chip chip-btn" data-act="refine">Refine vs enemy ↓</button>'}</div>
      <div class="label">${kind === 'rally' ? (mode === 'attack' ? 'Rally leader' : 'Garrison stats provider') : 'Your march'} · 3 heroes · gear</div>
      ${TYPES.map((t) => unitRow(res.units[t], res.units[t] ? 'Gear A' : '', 'var(--gold)')).join('')}
      <div class="label">Troop ratio</div>
      ${ratioBar('Best', res.ratio, 'var(--ok)')}${res.ratio2 ? ratioBar('Second', res.ratio2, 'var(--muted)') : ''}${legend}
      ${res.joiners ? `<div class="label">Ask for these 4 joiners</div>${joinerRows(res.joiners.chosen)}${altPills(res.joiners.alts)}` : ''}
      <div class="note" style="border-top:1px solid #1E2A44;padding-top:10px"><b>Why:</b> ${whyBattle(res, mode)}</div></section>`;
  }
  function whyBattle(res, mode) {
    const r = res.ratio;
    const parts = [];
    if (mode === 'defense') parts.push('in defense survival comes first, so infantry stays at 50% or more (community rule)');
    else if (r.mar >= 50) parts.push('your marksmen deal the most damage, so the ratio leans on them while infantry holds the front line');
    else parts.push('a solid front line protects your damage dealers');
    if (res.joiners) parts.push('joiner buffs of different types (damage, attack, lethality) multiply each other instead of just adding up');
    return parts.join('; ') + '.';
  }

  function formBody() {
    const acc = activeAccount();
    const heroesCount = Object.keys(acc.heroes || {}).length;
    if (!heroesCount) return noHeroes();
    const tag = S.fmode;
    if (S.ftab === 'rally' || S.ftab === 'solo') {
      const key = S.ftab;
      const mode = key === 'rally' ? S.rallyMode : S.soloMode;
      const enemy = S.enemy[key];
      const res = cached(`${tag}-${key}-${mode}-${JSON.stringify(enemy)}`, () => WOS.optimizeBattle(acc, { mode, kind: key, enemy }));
      return `<div class="seg warm" style="grid-template-columns:1fr 1fr"><button class="${mode === 'attack' ? 'on' : ''}" data-act="bmode" data-v="attack">ATTACK</button><button class="${mode === 'defense' ? 'on' : ''}" data-act="bmode" data-v="defense">DEFENSE</button></div>
        ${metaGap('rally')}${battleCard(res, key, mode, key)}${enemyForm(key)}`;
    }
    if (S.ftab === 'bear') {
      const b = cached(tag + '-bear', () => WOS.optimizeBear(acc));
      if (!b) return noHeroes();
      return `${metaGap('bear')}<section class="card"><div class="card-title">Open your rally</div>
        ${TYPES.map((t) => unitRow(b.units[t], b.units[t] ? 'Gear A' : '')).join('')}
        ${ratioBar('Best', b.ratio, 'var(--ok)')}${b.ratio2 ? ratioBar('Second', b.ratio2, 'var(--muted)') : ''}${legend}
        <div class="label">Joiners to ask for</div>${joinerRows(b.joiners.chosen)}</section>
        ${b.ownJoin ? `<section class="card warm"><div class="card-head"><div><div class="label" style="color:#E8D9B8">When you join a Bear rally</div><div class="note">1st slot of your march</div></div><div class="h-font" style="font-size:20px;color:var(--gold)">${esc(b.ownJoin)}</div></div></section>` : ''}
        <section class="card"><div class="card-head"><div class="card-title">Bear joiners</div><div class="small">max 8</div></div>
        ${b.top.map((x) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:8px;align-items:center;border-top:1px solid #1E2A44;padding-top:7px"><div><div class="jname">${esc(x.n)}</div><div class="jeff">${esc(skillText(x.n))}</div></div><div class="badge-ok" style="text-align:center;color:${x.tier === 'Top' ? 'var(--ok)' : 'var(--gold)'}">${x.tier}</div></div>`).join('')}</section>
        <div class="note"><b>Why:</b> the Bear doesn't fight back, so damage is everything. A small share of infantry and lancers still scored higher than 0/0/100 in community tests.</div>`;
    }
    if (S.ftab === 'joe') {
      const j = cached(tag + '-joe-' + S.joeMode, () => WOS.optimizeJoe(acc, S.joeMode));
      const full = j.full;
      return `<section class="card"><div class="card-title">Reinforce allies</div><div class="small">Your 6 marches: only the 1st hero of each march counts</div>
        ${j.reinforce.length ? j.reinforce.map((n, i) => `<div class="list-row"><div class="rank">${i + 1}</div><div><div class="jname">${esc(n)}</div><div class="jeff">${esc(skillText(n))}</div></div></div>`).join('') : '<div class="small">No defensive first-slot heroes in your roster: Sergey and Patrick are free options.</div>'}
        ${altPills(j.reinforceAlt)}${ratioBar('Ratio', j.cityRatio, 'var(--ok)')}</section>
        <section class="card red"><div class="card-title" style="color:#FECACA">Waves 10 &amp; 20 · HQ defense</div>
        <div class="label">HQ mode · set by your alliance</div>
        <div class="seg" style="grid-template-columns:1fr 1fr"><button class="${!full ? 'on' : ''}" data-act="joe" data-v="standard">Standard</button><button class="${full ? 'on' : ''}" data-act="joe" data-v="full">Full marksmen</button></div>
        <div class="small">Switch to full marksmen when infantry can no longer clear wave 20.</div>
        <div class="label" style="color:#FECACA">If you lead the defense</div>
        ${TYPES.map((t) => unitRow(j.hq.units && j.hq.units[t], j.hq.units && j.hq.units[t] ? 'Gear A' : '')).join('')}
        ${ratioBar('Wave 10', j.hq.w10, '#FECACA')}${ratioBar('Wave 20', j.hq.w20, '#FECACA')}
        <div class="small">The strongest player present provides the stats for the whole garrison. If you can, apply for Minister of Defense: +10% lethality.</div>
        <div class="label" style="color:#FECACA">If you join the HQ defense</div>
        <div class="list-row"><div class="rank">1</div><div><div class="jname">${esc(j.hq.joinHero)} · ${WOS.ratioText(j.hq.joinRatio)}</div><div class="jeff">${esc(skillText(j.hq.joinHero))}</div></div></div>
        ${altPills(j.hq.joinAlt)}
        ${full ? '<div class="card warm"><div class="note"><b>Works only if everyone sends 100% marksmen</b>, leader included. Infantry acts first and takes the first kills: one infantry march splits the points unfairly.</div></div><div class="small">Don\'t use Sergey or Patrick in the 1st slot here: this needs damage, not defense.</div>' : ''}
        </section>`;
    }
    if (S.ftab === 'canyon') {
      const sq = cached(tag + '-canyon', () => WOS.optimizeCanyon(acc));
      const names = ['Main', 'Support', 'Occupation'];
      return `<div class="card blue"><div class="note">In Canyon Clash you only pick heroes, troops are provided. Each hero and gear set is used once: the calculator splits them across 3 squads for the best total.</div></div>
        ${sq.map((s, i) => `<section class="card ${i === 0 ? 'warm' : ''}"><div class="card-title">${i + 1} · ${names[i]}</div>${s.map((u, k) => unitRow(u, u && u.set ? 'Gear ' + u.set : (u ? 'Base gear' : ''), u && u.set === 'A' ? 'var(--gold)' : 'var(--soft)')).join('')}</section>`).join('')}`;
    }
    if (S.ftab === 'arena') {
      const a = cached(tag + '-arena', () => WOS.optimizeArena(acc));
      if (!a) return noHeroes();
      const slot = (u, pos) => `<div class="arena-slot"><div class="small" style="font-weight:700;color:${pos.indexOf('1') === 0 ? 'var(--gold)' : 'var(--muted)'}">POS. ${pos}</div>${ticon(u.h.t)}<div style="font-size:13px;font-weight:600">${esc(u.h.n)}</div><div class="small">${levelLabel(u.st, u.sp || 0)}</div>${u.set ? `<div class="tag" style="color:${u.set === 'A' ? 'var(--gold)' : 'var(--soft)'}">Gear ${u.set}</div>` : ''}</div>`;
      const f = a.front;
      const b = a.back;
      return `<section class="card"><div class="card-head"><div class="card-title">Arena lineup</div><div class="small">Exploration skills</div></div>
        <div class="label" style="text-align:center">Front row · tank</div>
        <div class="grid2" style="padding:0 30px">${f[1] ? slot(f[1], '2') : '<div></div>'}${f[0] ? slot(f[0], '1 · TANK') : ''}</div>
        <div class="label" style="text-align:center">Back row · damage</div>
        <div class="grid3">${b[2] ? slot(b[2], '3') : '<div></div>'}${b[1] ? slot(b[1], '2') : '<div></div>'}${b[0] ? slot(b[0], '1') : ''}</div></section>
        ${a.bench.length ? `<section class="card"><div class="card-title">Alternatives</div><div class="pills">${a.bench.map((u) => `<span class="pill" style="cursor:default">${esc(u.h.n)}</span>`).join('')}</div></section>` : ''}
        <div class="note"><b>Why:</b> the Arena uses Exploration skills. In each row position 1 is on the right: the toughest hero goes front-right, the biggest damage dealer back-right.</div>
        <div class="small">An Expedition Arena alternating weekly is starting in November: its rules will be added once known.</div>`;
    }
    return '';
  }

  /* ---------- upgrades / next gen ---------- */

  function viewUp() {
    return `<div><div class="h-font" style="font-size:24px">Where to invest</div><div class="small">Only heroes that improve the formations you actually use.</div></div>
      <section class="card"><div class="card-head"><div class="label">Based on what you do</div><a href="#" data-act="nav" data-v="account">Edit</a></div>
      <div class="pills">${(S.profile.roles.length ? S.profile.roles : ['rallyAtk', 'bear']).map((r) => `<span class="pill on" style="cursor:default">${esc((ROLES.find((x) => x[0] === r) || [r, r])[1])}</span>`).join('')}</div>
      ${S.profile.roles.length ? '' : '<div class="small">Nothing selected yet: using attack rallies and Bear as default.</div>'}</section>
      <div id="up-body"><div class="loading">Calculating…</div></div>`;
  }
  function renderUpBody() {
    const el = $('#up-body');
    if (!el) return;
    setTimeout(() => {
      const acc = account();
      if (!Object.keys(acc.heroes).length) { el.innerHTML = noHeroes(); return; }
      const adv = cached('up', () => WOS.upgradeAdvice(acc, S.profile.roles));
      const items = adv.invest.map((x, i) => `<section class="card" style="${i === 0 ? 'border-color:#6B4A12' : ''}">
        <div class="row"><div class="rank" style="width:28px;height:28px;border-radius:8px;background:${i === 0 ? 'var(--ember)' : '#1B2A47'};color:${i === 0 ? '#1A1206' : 'var(--ice)'};display:flex;align-items:center;justify-content:center">${i + 1}</div>
        <div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(x.label)}</div><div class="small">Now: ${esc(x.now)}</div></div><div class="h-font" style="color:var(--ok)">+${x.gain.toFixed(1)}%</div></div>
        <div class="note"><b>Why:</b> ${x.kind === 'unlock' ? `you don't own ${esc(x.hero)} yet: at this level it would enter your formations for what you do. Below it, your current heroes are better.` : (x.inUse ? `${esc(x.hero)} is in your best formations, so this improves the events you play.` : `with this upgrade ${esc(x.hero)} becomes better than the hero you use now.`)}</div></section>`).join('');
      const avoid = adv.avoid.length ? `<section class="card red"><div class="card-title" style="color:var(--bad)">Don't invest</div>
        <div class="note">${adv.avoid.map(esc).join(', ')}: not used in your best formations for what you do, and one more upgrade doesn't change that.</div></section>` : '';
      const days = daysToNext();
      const soon = Number.isFinite(days) && days <= 30 && currentGen() < 17
        ? `<section class="card warm"><div class="note"><b>Next gen in ${days} days.</b> Prefer upgrades that are cheap or that keep value (SW, joiner skills). Avoid pushing an old hero to 5★ now: check Next Gen first.</div></section>` : '';
      el.innerHTML = soon + (items || '<div class="card"><div class="note">No upgrade gives a clear gain right now: your current heroes are already the best choice for what you do.</div></div>') + avoid +
        '<div class="small">Estimated by the simulator. The more reports are sent, the more accurate it gets.</div>';
    }, 20);
  }

  function viewGen() {
    const gen = currentGen();
    const days = daysToNext();
    return `<section class="card"><div class="label">Next generation</div>
      <div class="row" style="align-items:baseline"><div class="h-font" style="font-size:42px;color:var(--ember)">Gen ${gen + 1}</div>${Number.isFinite(days) ? `<div class="small">in ${days} days</div>` : ''}</div></section>
      <div id="gen-body"><div class="loading">Calculating…</div></div>`;
  }
  function renderGenBody() {
    const el = $('#gen-body');
    if (!el) return;
    setTimeout(() => {
      const acc = account();
      if (!Object.keys(acc.heroes).length) { el.innerHTML = noHeroes(); return; }
      const adv = cached('gen', () => WOS.nextGenAdvice(acc, S.profile.roles, S.profile.spend));
      if (!adv.picks.length) { el.innerHTML = '<div class="card"><div class="note">No newer generation is known yet.</div></div>'; return; }
      const days = daysToNext();
      const inv = adv.picks.filter((p) => p.verdict === 'Invest').map((p) => TYPE_NAME[p.type].toLowerCase());
      let timing = '';
      if (Number.isFinite(days) && inv.length) {
        timing = days <= 30
          ? `<section class="card warm"><div class="note"><b>Timing:</b> Gen ${adv.gen} arrives in ${days} days. Save shards, SW materials and gear for your ${inv.join(' / ')} hero now: don't push current ${inv.join(' / ')} heroes to 5★, they'll be replaced soon.</div></section>`
          : `<section class="card"><div class="note"><b>Timing:</b> Gen ${adv.gen} is ${days} days away. You still get good use from upgrades on your current heroes; start saving about 30 days before.</div></section>`;
      }
      el.innerHTML = timing + adv.picks.map((p, i) => {
        const color = p.verdict === 'Invest' ? 'var(--ok)' : (p.verdict === 'Skip' ? 'var(--muted)' : 'var(--gold)');
        const target = p.target ? `${p.target.st}★${p.target.sw ? ' + SW ' + p.target.sw : ''}` : '—';
        return `<section class="card ${p.verdict === 'Invest' && i === 0 ? 'warm' : ''}"><div class="row">${ticon(p.type)}<div style="flex:1"><div style="font-size:16px;font-weight:600">${esc(p.name)}</div><div class="small">Gen ${adv.gen} · ${TYPE_NAME[p.type]}</div></div><div class="badge-ok" style="color:${color}">${p.verdict}</div></div>
          <div class="grid2"><div class="card" style="padding:10px;gap:2px"><div class="label">Useful from</div><div class="h-font" style="font-size:18px">${target}</div></div><div class="card" style="padding:10px;gap:2px"><div class="label">Gain when maxed</div><div class="h-font" style="font-size:18px">${p.gainMax > 0 ? '+' + p.gainMax.toFixed(1) + '%' : '—'}</div></div></div>
          <div class="note"><b>Why:</b> ${p.target ? `from ${target} this hero makes your formations stronger for what you do.` : 'even maxed, this hero doesn\'t beat the heroes you already use for what you do.'} ${p.verdict === 'Only if spare' ? 'With your spending, put resources here only after the first pick.' : ''}</div></section>`;
      }).join('') + '<div class="small">Advice depends on your spending profile and on what you do in game (Account › Profile).</div>';
    }, 20);
  }

  /* ---------- report ---------- */

  function viewReport() {
    const r = S.report;
    const owned = Object.keys(account().heroes);
    const allHeroes = heroOptions(WOS.db.heroes.filter((h) => h.sk.length));
    const ownedOpts = heroOptions(owned.map((n) => WOS.hero(n)).filter(Boolean));
    const types = [['rally', 'Rally'], ['garrison', 'Garrison'], ['solo', '1 vs 1'], ['bear', 'Bear'], ['joe', 'Crazy Joe']];
    const heroSel = (bind, list, val) => `<select class="in" data-rbind="${bind}"><option value="">—</option>${list.map(([n, l]) => `<option value="${esc(n)}"${val === n ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    const troopRow = (label, base) => `<div style="display:grid;grid-template-columns:70px repeat(3,minmax(0,1fr));gap:6px;align-items:center"><div class="small">${label}</div>${TYPES.map((t) => `<input class="in mini" style="color:var(--${t})" data-rbind="${base}.${t}" value="${esc(getPath(r, base + '.' + t))}" inputmode="numeric" placeholder="${t}">`).join('')}</div>`;
    const pvp = r.type !== 'bear';
    return `<div class="note">Every report makes the calculator more accurate for everyone. Copy the values from the battle report in game.</div>
      <div class="pills">${types.map(([k, l]) => `<button class="pill ${r.type === k ? 'on' : ''}" data-act="rtype" data-v="${k}">${l}</button>`).join('')}</div>
      ${pvp ? `<div class="seg" style="grid-template-columns:1fr 1fr"><button class="${r.role === 'attacker' ? 'on' : ''}" data-act="rrole" data-v="attacker">I attacked</button><button class="${r.role === 'defender' ? 'on' : ''}" data-act="rrole" data-v="defender">I defended</button></div>` : ''}
      <section class="card"><div class="card-title">Your side</div>
        <div class="label">Your 3 heroes</div>${[0, 1, 2].map((i) => heroSel(`myHeroes.${i}.n`, ownedOpts, r.myHeroes[i].n)).join('')}
        ${troopRow('Troops', 'myTroops')}<div class="small">Gear, stars and bonuses come from your profile.</div></section>
      ${pvp ? `<section class="card red"><div class="card-title" style="color:var(--bad)">Enemy</div>
        ${[0, 1, 2].map((i) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:6px">${heroSel(`enemyHeroes.${i}.n`, allHeroes, r.enemyHeroes[i].n)}<select class="in" data-rbind="enemyHeroes.${i}.st">${[5, 4, 3, 2, 1, 0].map((x) => `<option value="${x}"${String(r.enemyHeroes[i].st) === String(x) ? ' selected' : ''}>${x}★</option>`).join('')}</select></div>`).join('')}
        ${troopRow('Troops', 'enemyTroops')}
        <details><summary class="small" style="cursor:pointer">Enemy bonus % (12 fields, optional)</summary>
        ${TYPES.map((t) => `<div style="display:grid;grid-template-columns:70px repeat(4,minmax(0,1fr));gap:6px;align-items:center;margin-top:6px"><div class="small" style="color:var(--${t})">${TYPE_NAME[t]}</div>${['atk', 'def', 'leth', 'hp'].map((k) => `<input class="in mini" data-rbind="enemyBonus.${t}.${k}" value="${esc(r.enemyBonus[t][k] || '')}" placeholder="${k}" inputmode="decimal">`).join('')}</div>`).join('')}
        </details></section>` : ''}
      <section class="card"><div class="card-title">Result</div>
        ${pvp ? `<div class="grid2"><button class="pill ${r.result === 'win' ? 'on' : ''}" data-act="rres" data-v="win">VICTORY</button><button class="pill ${r.result === 'loss' ? 'on' : ''}" data-act="rres" data-v="loss">DEFEAT</button></div>
        ${troopRow('Your losses', 'myLoss')}${troopRow('Enemy losses', 'enemyLoss')}` : ''}
        ${r.type === 'bear' ? `<div class="field"><label>DAMAGE DEALT</label><input class="in" data-rbind="bearDamage" value="${esc(r.bearDamage)}" inputmode="numeric"></div>` : ''}
        ${r.type === 'joe' ? `<div class="field"><label>CRAZY JOE LEVEL</label><input class="in" data-rbind="joeLevel" value="${esc(r.joeLevel)}" inputmode="numeric"></div>` : ''}
        <div class="field"><label>JOINERS ACTIVATED (from the report)</label><input class="in" data-rbind="joiners" value="${esc(r.joiners)}" placeholder="e.g. Jessie, Jasser"></div>
        <div class="field"><label>NOTES</label><input class="in" data-rbind="notes" value="${esc(r.notes)}" maxlength="300"></div></section>
      <button class="btn" data-act="send-report">SEND REPORT</button>
      ${S.lastPrediction ? `<section class="card blue"><div class="note">${esc(S.lastPrediction)}</div></section>` : '<div class="small">After sending you\'ll see what the calculator had predicted, to compare it with the real result.</div>'}`;
  }

  /* ---------- render & events ---------- */

  function render() {
    const app = $('#app');
    if (!S.session) { app.innerHTML = viewLogin(S.loginError); return; }
    let body = '';
    if (S.view === 'account') body = viewAccount();
    else if (S.view === 'form') body = viewForm();
    else if (S.view === 'up') body = viewUp();
    else if (S.view === 'gen') body = viewGen();
    else body = viewReport();
    app.innerHTML = `${header()}<main>${body}</main>${bottomNav()}`;
    if (S.view === 'form') renderFormBody();
    if (S.view === 'up') renderUpBody();
    if (S.view === 'gen') renderGenBody();
  }

  async function doLogin(user, code) {
    const btn = $('#login-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'CHECKING…'; }
    try {
      const r = await api('login', { user, code });
      if (!r.ok) { S.loginError = r.error || 'Invalid username or code'; render(); return; }
      S.session = { user, code, state: r.state || '', alliance: r.alliance || '', role: r.role || 'user', stateOpen: r.stateOpen || '' };
      S.profile = mergeProfile(r.profile);
      S.loginError = '';
      try { sessionStorage.setItem('wostop_session', JSON.stringify({ user, code })); } catch (e) { /* ignore */ }
      render();
    } catch (e) {
      S.loginError = 'Connection error, try again.'; render();
    }
  }

  document.addEventListener('submit', (ev) => {
    if (ev.target.id === 'login-form') {
      ev.preventDefault();
      doLogin($('#lu').value.trim(), $('#lc').value.trim());
    }
  });

  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const v = el.dataset.v;
    if (el.tagName === 'A') ev.preventDefault();
    if (act === 'nav') { S.view = v; window.scrollTo(0, 0); render(); }
    else if (act === 'sub') { S.sub = v; render(); }
    else if (act === 'logout') {
      clearTimeout(S.saveTimer); await saveNow();
      S.session = null; S.profile = null; S.cache = {};
      try { sessionStorage.removeItem('wostop_session'); } catch (e) { /* ignore */ }
      render();
    } else if (act === 'spend') { S.profile.spend = v; scheduleSave(); render(); }
    else if (act === 'role') {
      const i = S.profile.roles.indexOf(v);
      if (i >= 0) S.profile.roles.splice(i, 1); else S.profile.roles.push(v);
      scheduleSave(); render();
    } else if (act === 'hfilter') { S.heroFilter = v; render(); }
    else if (act === 'ftab') { S.ftab = v; render(); }
    else if (act === 'fmode') { S.fmode = v; render(); }
    else if (act === 'bmode') { if (S.ftab === 'rally') S.rallyMode = v; else S.soloMode = v; render(); }
    else if (act === 'joe') { S.joeMode = v; render(); }
    else if (act === 'enemy-clear') { S.enemy[v] = blankEnemy(); render(); }
    else if (act === 'recalc') { render(); }
    else if (act === 'refine') { const c = $('#enemy-card'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else if (act === 'rtype') { S.report.type = v; render(); }
    else if (act === 'rrole') { S.report.role = v; render(); }
    else if (act === 'rres') { S.report.result = v; render(); }
    else if (act === 'send-report') { sendReport(el); }
    else if (act === 'save') { clearTimeout(S.saveTimer); await saveNow(); toast(S.saveState === 'Saved' ? 'Saved: formations and upgrades now use these data' : S.saveState); }
  });

  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.sbind) {
      S.session[t.dataset.sbind] = t.value.trim().slice(0, t.dataset.sbind === 'alliance' ? 12 : 10);
      scheduleSave();
      const hdr = document.querySelector('header.top');
      if (hdr) hdr.outerHTML = header();
      if (t.dataset.sbind === 'state') { clearTimeout(S.stTimer); S.stTimer = setTimeout(() => { S.cache = {}; render(); const el = $('#st-in'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 700); }
      return;
    }
    if (t.dataset.hlevel || t.dataset.hown) {
      const name = t.dataset.hlevel || t.dataset.hown;
      const h = S.profile.heroes[name] || (S.profile.heroes[name] = { st: 0, sp: 0, sw: 0 });
      if (t.dataset.hlevel) {
        const parts = t.value.split('.');
        h.st = num(parts[0], 0); h.sp = num(parts[1], 0); h.own = true;
      } else {
        h.own = !t.checked;
        if (h.st === '' || h.st == null) { h.st = 0; h.sp = 0; }
      }
      if (h.sw == null) h.sw = 0;
      render(); scheduleSave();
      return;
    }
    if (t.dataset.bind) {
      setPath(S.profile, t.dataset.bind, t.value);
      if (/^heroes\./.test(t.dataset.bind)) {
        const h = S.profile.heroes[t.dataset.bind.split('.')[1]];
        if (h) {
          // setting the SW means the player owns the hero
          if (h.st === '' || h.st == null) { h.st = 0; h.sp = 0; }
          h.own = true;
        }
        render();
      }
      if (/^gear\..*\.q$/.test(t.dataset.bind)) t.parentNode.className = 'gear-cell q-' + t.value;
      if (t.dataset.bind === 'genManual') { S.cache = {}; render(); }
      scheduleSave();
    } else if (t.dataset.ebind) {
      setPath(S.enemy, t.dataset.ebind, t.value);
    } else if (t.dataset.rbind) {
      setPath(S.report, t.dataset.rbind, t.value);
    }
  });

  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'hero-search') {
      S.heroSearch = ev.target.value;
      clearTimeout(S.searchTimer);
      S.searchTimer = setTimeout(() => {
        render();
        const s = $('#hero-search');
        if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
      }, 250);
    }
  });

  async function sendReport(btn) {
    const r = S.report;
    if (r.type !== 'bear' && !r.result) { toast('Choose victory or defeat first'); return; }
    let prediction = null;
    try { prediction = WOS.predict(account(), r); } catch (e) { prediction = null; }
    btn.disabled = true; btn.textContent = 'SENDING…';
    try {
      const res = await api('report', { user: S.session.user, code: S.session.code, report: Object.assign({}, r, { prediction, profileGen: currentGen(), sentAt: new Date().toISOString() }) });
      if (!res.ok) throw new Error(res.error || 'error');
      S.lastPrediction = prediction
        ? `Report sent. The calculator had predicted a ${prediction.win ? 'win' : 'loss'} with ${prediction.myLeft}% of your troops left (enemy ${prediction.enemyLeft}%).`
        : 'Report sent. Thanks! (No prediction: troop numbers were missing.)';
      S.report = blankReport();
      render();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'SEND REPORT';
      toast('Not sent: ' + e.message);
    }
  }

  /* ---------- boot ---------- */

  WOS.setDB(window.WOS_DB);
  render();
  try {
    const saved = JSON.parse(sessionStorage.getItem('wostop_session') || 'null');
    if (saved && saved.user) doLogin(saved.user, saved.code);
  } catch (e) { /* ignore */ }
  window.addEventListener('beforeunload', () => { if (S.saveState === 'Unsaved changes') saveNow(); });
})();

</script>
</body>
</html>
